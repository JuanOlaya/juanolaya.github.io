            { name: "MultiVibes", mechanism: "Vibromotor array creates spat-temp patterns.", useCase: "Creating rich, directional tactile feedback across the hand, such as feeling an object slide through your palm.", submodalities: ["Fine vibration"], imageUrl: "https://placehold.co/400x250/E2E8F0/4A5568?text=MultiVibes", doi: "10.1109/ISMAR59233.2023.00085" },
            { name: "BrushStroke", mechanism: "Belt and motor mechanism stroking the back of the hand and fingers", useCase: "", submodalities: [], imageUrl: "https://placehold.co/400x250/E2E8F0/4A5568?text=BrushStroke", doi: "" }
        ];

        // Define which submodalities belong to which primary modality
        const cutaneousSubmodalities = new Set(["Thermal", "Stiffness", "Friction", "Fine vibration"]);
        const kinestheticSubmodalities = new Set(["Macro vibration", "Impact", "Motion", "Resistance", "Weight amount", "Weight distribution", "Shape"]);

        const cardContainer = document.getElementById('card-container');

        // --- Gemini API Call Function ---
        async function getGeminiIdeas(device, buttonElement) {
            const ideasContainer = document.getElementById(`gemini-ideas-${device.name.replace(/\s+/g, '-')}`);
            ideasContainer.innerHTML = '<div class="loader"></div>';
            buttonElement.disabled = true;

            const systemPrompt = `You are an expert HCI researcher and creative technologist specializing in haptics. Your goal is to brainstorm novel, concrete, and imaginative use cases for haptic devices.
            - Provide exactly three distinct ideas.
            - Format the output as a simple HTML unordered list (<ul><li>Idea 1</li>...</ul>).
            - Do not include any other text, titles, or explanations.`;
            const userQuery = `Brainstorm three new, creative use cases for the following haptic device:
            - Name: ${device.name}
            - Mechanism: ${device.mechanism}
            - Known Modalities: ${device.submodalities.join(', ')}
            - Existing Use Case (for context, do not repeat): ${device.useCase}`;
            
            const apiKey = ""; // Leave as-is
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userQuery }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                    })
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.statusText}`);
                }

                const result = await response.json();
                const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                
                if (text) {
                    ideasContainer.innerHTML = text;
                } else {
                    ideasContainer.innerHTML = '<p class="text-red-500 text-sm">Could not generate ideas. Please try again.</p>';
                }

            } catch (error) {
                console.error('Gemini API call failed:', error);
                ideasContainer.innerHTML = `<p class="text-red-500 text-sm">Error: ${error.message}</p>`;
            } finally {
                 buttonElement.style.display = 'none'; // Hide button after use
            }
        }
        
        // --- Gemini API Call for Concept Explainer ---
        async function getGeminiExplanation(modalityName) {
            const modal = document.getElementById('explainer-modal');
            const modalTitle = document.getElementById('modal-title');
            const modalContent = document.getElementById('modal-content');

            modalTitle.textContent = modalityName;
            modalContent.innerHTML = '<div class="loader"></div>';
            modal.classList.remove('hidden');

            const systemPrompt = `You are an expert HCI professor. Explain haptic concepts clearly and concisely for a student.
            - Provide the explanation in a single, simple paragraph.
            - Do not include any other text, titles, or formatting.`;
            const userQuery = `Explain the haptic concept of "${modalityName}".`;
            
            const apiKey = ""; // Leave as-is
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userQuery }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                    })
                });
                if (!response.ok) throw new Error(`API Error: ${response.status}`);
                
                const result = await response.json();
                const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                
                if (text) {
                    modalContent.innerHTML = `<p>${text}</p>`;
                } else {
                    modalContent.innerHTML = '<p class="text-red-500">Could not get explanation.</p>';
                }
            } catch (error) {
                console.error("Gemini explanation call failed:", error);
                modalContent.innerHTML = `<p class="text-red-500">Error: ${error.message}</p>`;
            }
        }


        // Function to generate and append cards
        function createCards() {
            devices.forEach((device) => {
                const deviceId = device.name.replace(/\s+/g, '-');
                const deviceCutaneous = device.submodalities.filter(sm => cutaneousSubmodalities.has(sm));
                const deviceKinesthetic = device.submodalities.filter(sm => kinestheticSubmodalities.has(sm));

                // Card Template
                const cardHTML = `
                <div class="bg-[#E0FFFF] rounded-lg shadow-md hover:shadow-xl transition-shadow duration-300 ease-in-out p-6 flex flex-col">
                    <h2 class="text-xl font-bold text-blue-700 mb-2 pb-2 border-b border-gray-200">${device.name}</h2>
                    
                    <img src="${device.imageUrl}" alt="Image of ${device.name}" class="mb-4 rounded-lg object-cover h-48 w-full bg-gray-200" onerror="this.onerror=null;this.src='https://placehold.co/400x250/CBD5E0/4A5568?text=Image+Not+Available';">

                    <div class="mb-4">
                        <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider">Primary Mechanism</h3>
                        <p class="text-gray-700 mt-1">${device.mechanism}</p>
                    </div>

                    <div class="mb-4 flex-grow">
                        <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider">Example Use Case</h3>
                        <p class="text-gray-700 mt-1">${device.useCase}</p>
                    </div>

                    <div class="mt-auto pt-4 border-t border-gray-200">
                        <div class="mb-2">
                            <h4 class="text-xs font-bold text-gray-600 mb-1">Cutaneous Perception</h4>
                            <div class="flex flex-wrap gap-2 min-h-[24px]">
                                ${deviceCutaneous.map(sm => `<button data-modality="${sm}" class="modality-tag cutaneous text-white text-xs font-medium px-2.5 py-0.5 rounded-full hover:opacity-80 transition-opacity">${sm}</button>`).join('')}
                            </div>
                        </div>

                        <div>
                            <h4 class="text-xs font-bold text-gray-600 mb-1">Kinesthetic Perception</h4>
                            <div class="flex flex-wrap gap-2 min-h-[24px]">
                                ${deviceKinesthetic.map(sm => `<button data-modality="${sm}" class="modality-tag kinesthetic text-white text-xs font-medium px-2.5 py-0.5 rounded-full hover:opacity-80 transition-opacity">${sm}</button>`).join('')}
                            </div>
                        </div>
                    </div>

                    <!-- DOI Link Section -->
                    ${device.doi ? `
                    <div class="mt-4 pt-4 border-t border-gray-200">
                        <a href="https://doi.org/${device.doi}" target="_blank" rel="noopener noreferrer" class="text-blue-600 hover:text-blue-800 text-sm font-medium transition-colors inline-flex items-center">
                            Paper
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                              <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                            </svg>
                        </a>
                    </div>
                    ` : ''}

                     <!-- Gemini Section -->
                    <div class="gemini-section mt-4 pt-4 border-t border-dashed border-gray-300 hidden">
                         <button id="gemini-btn-${deviceId}" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition-colors duration-300">
                            Generate Ideas ✨
                        </button>
                        <div id="gemini-ideas-${deviceId}" class="gemini-ideas text-gray-700 mt-4 text-sm"></div>
                    </div>
                </div>
                `;
                
                cardContainer.innerHTML += cardHTML;
            });
            
             // Add event listeners after all cards are created
            devices.forEach(device => {
                 const deviceId = device.name.replace(/\s+/g, '-');
                 const button = document.getElementById(`gemini-btn-${deviceId}`);
                 if (button) { // Check if the button exists
                    button.addEventListener('click', () => getGeminiIdeas(device, button));
                 }
            });

            // Add event listeners for modality tags
            document.querySelectorAll('.modality-tag').forEach(tag => {
                tag.addEventListener('click', () => {
                    const modalityName = tag.dataset.modality;
                    getGeminiExplanation(modalityName);
                });
            });
        }

        // Run the function on page load
        window.onload = function() {
            createCards();

            // Setup toggle functionality
            const ideaToggle = document.getElementById('toggle-ideas');
            ideaToggle.addEventListener('change', () => {
                const geminiSections = document.querySelectorAll('.gemini-section');
                geminiSections.forEach(section => {
                    if (ideaToggle.checked) {
                        section.classList.remove('hidden');
                    } else {
                        section.classList.add('hidden');
                    }
                });
            });

            // Setup modal close functionality
            const modal = document.getElementById('explainer-modal');
            const closeBtn = document.getElementById('modal-close-btn');
            closeBtn.addEventListener('click', () => modal.classList.add('hidden'));
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.add('hidden');
                }
            });
        };
    </script>

</body>
</html>
