        // Define which submodalities belong to which primary modality
        const cutaneousSubmodalities = new Set(["Thermal", "Stiffness", "Friction", "Fine vibration"]);
        const kinestheticSubmodalities = new Set(["Macro vibration", "Impact", "Motion", "Resistance", "Weight amount", "Weight distribution", "Shape"]);

        const cardContainer = document.getElementById('card-container');

        // --- Gemini API Call Function ---
        async function getGeminiIdeas(device, buttonElement) {
            const ideasContainer = document.getElementById(`gemini-ideas-${device.name.replace(/\s+/g, '-')}`);
            ideasContainer.innerHTML = '<div class="loader"></div>';
            buttonElement.disabled = true;

            const systemPrompt = `You are an expert HCI researcher and creative technologist specializing in haptics. Your goal is to brainstorm novel, concrete, and imaginative use cases for haptic devices.
            - Provide exactly three distinct ideas.
            - Format the output as a simple HTML unordered list (<ul><li>Idea 1</li>...</ul>).
            - Do not include any other text, titles, or explanations.`;
            const userQuery = `Brainstorm three new, creative use cases for the following haptic device:
            - Name: ${device.name}
            - Mechanism: ${device.mechanism}
            - Known Modalities: ${device.submodalities.join(', ')}
            - Existing Use Case (for context, do not repeat): ${device.useCase}`;
            
            const apiKey = ""; // Leave as-is
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userQuery }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                    })
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.statusText}`);
                }

                const result = await response.json();
                const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                
                if (text) {
                    ideasContainer.innerHTML = text;
                } else {
                    ideasContainer.innerHTML = '<p class="text-red-500 text-sm">Could not generate ideas. Please try again.</p>';
                }

            } catch (error) {
                console.error('Gemini API call failed:', error);
                ideasContainer.innerHTML = `<p class="text-red-500 text-sm">Error: ${error.message}</p>`;
            } finally {
                 buttonElement.style.display = 'none'; // Hide button after use
            }
        }
        
        // --- Gemini API Call for Concept Explainer ---
        async function getGeminiExplanation(modalityName) {
            const modal = document.getElementById('explainer-modal');
            const modalTitle = document.getElementById('modal-title');
            const modalContent = document.getElementById('modal-content');

            modalTitle.textContent = modalityName;
            modalContent.innerHTML = '<div class="loader"></div>';
            modal.classList.remove('hidden');

            const systemPrompt = `You are an expert HCI professor. Explain haptic concepts clearly and concisely for a student.
            - Provide the explanation in a single, simple paragraph.
            - Do not include any other text, titles, or formatting.`;
            const userQuery = `Explain the haptic concept of "${modalityName}".`;
            
            const apiKey = ""; // Leave as-is
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userQuery }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                    })
                });
                if (!response.ok) throw new Error(`API Error: ${response.status}`);
                
                const result = await response.json();
                const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                
                if (text) {
                    modalContent.innerHTML = `<p>${text}</p>`;
                } else {
                    modalContent.innerHTML = '<p class="text-red-500">Could not get explanation.</p>';
                }
            } catch (error) {
                console.error("Gemini explanation call failed:", error);
                modalContent.innerHTML = `<p class="text-red-500">Error: ${error.message}</p>`;
            }
        }

                            </svg>
                        </a>
                    </div>
                    ` : ''}

                     <!-- Gemini Section -->
                    <div class="gemini-section mt-4 pt-4 border-t border-dashed border-gray-300 hidden">
                         <button id="gemini-btn-${deviceId}" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition-colors duration-300">
                            Generate Ideas ✨
                        </button>
                        <div id="gemini-ideas-${deviceId}" class="gemini-ideas text-gray-700 mt-4 text-sm"></div>
                    </div>
                </div>
                `;
                
                cardContainer.innerHTML += cardHTML;
            });
            
             // Add event listeners after all cards are created
            devices.forEach(device => {
                 const deviceId = device.name.replace(/\s+/g, '-');
                 const button = document.getElementById(`gemini-btn-${deviceId}`);
                 if (button) { // Check if the button exists
                    button.addEventListener('click', () => getGeminiIdeas(device, button));
                 }
            });

            // Add event listeners for modality tags
            document.querySelectorAll('.modality-tag').forEach(tag => {
                tag.addEventListener('click', () => {
                    const modalityName = tag.dataset.modality;
                    getGeminiExplanation(modalityName);
                });
            });
        }

        // Run the function on page load
        window.onload = function() {
            createCards();

            // Setup toggle functionality
            const ideaToggle = document.getElementById('toggle-ideas');
            ideaToggle.addEventListener('change', () => {
                const geminiSections = document.querySelectorAll('.gemini-section');
                geminiSections.forEach(section => {
                    if (ideaToggle.checked) {
                        section.classList.remove('hidden');
                    } else {
                        section.classList.add('hidden');
                    }
                });
            });

            // Setup modal close functionality
            const modal = document.getElementById('explainer-modal');
            const closeBtn = document.getElementById('modal-close-btn');
            closeBtn.addEventListener('click', () => modal.classList.add('hidden'));
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.add('hidden');
                }
            });
        };
    </script>
