name = "juanolaya-gemini-proxy"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# GEMINI_API_KEY is a secret: `npx wrangler@4 secret put GEMINI_API_KEY`. Never add it here.

# Workers Rate Limiting binding: at most 20 requests per client IP every 60 s (period must be 10 or 60).
# namespace_id is any integer unique within the Cloudflare account.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1016"

  [ratelimits.simple]
  limit = 20
  period = 60
