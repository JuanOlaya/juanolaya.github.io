<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiD: Einbürgerungstest Kompakt</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #334155;

            /* Neon Article Colors */
            --color-der: #3b82f6;
            /* Blue */
            --color-die: #ef4444;
            /* Red */
            --color-das: #22c55e;
            /* Green */
            --color-pl: #a855f7;
            /* Purple */

            --modal-overlay: rgba(0, 0, 0, 0.75);
            --accent-gold: #f59e0b;
            --accent-green: #00ffa1;
            /* Neon Mint for Design System */
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
            width: 100%;
            max-width: 1200px;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            font-weight: 800;
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin: 0;
        }

        /* GRID LAYOUT - RESPONSIVE */
        .container {
            width: 100%;
            max-width: 1500px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            padding-bottom: 50px;
        }

        @media (min-width: 1200px) {
            .container {
                grid-template-columns: repeat(3, 1fr);
                align-items: start;
            }
        }

        /* Interactive Title Word */
        .audio-trigger {
            color: #333;
            border-bottom: 3px dashed #4682B4;
            cursor: pointer;
            padding-bottom: 2px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .audio-trigger:hover {
            color: #4682B4;
            border-bottom-style: solid;
        }

        .audio-icon-small {
            font-size: 0.9rem;
        }

        /* Category Card Styles */
        .category-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);

        }

        .category-header {

            display: flex;
            align-items: center;

        .category-header:hover {

        .category-icon {

        }

        .category-title {

            text-align: right;
            flex-shrink: 0;

        .info-icon-header {

        }

        }
        .noun-tag {

            padding: 2px 8px;
            border-radius: 999px;

            font-style: italic;
            font-size: 0.95rem;
            text-align: right;
            cursor: pointer;
            transition: color 0.2s;
        }

        .col-trans:hover {
            color: white;
            text-decoration: underline;
            text-decoration-style: dotted;
        }

        /* Article Colors (kept distinct for meaning, but softened if needed or integrated) */
        /* ... existing article colors ... */

        /* MODAL STYLES aligned with Adverb Design */
        /* ... (modal styles handled separately or below) ... */

        /* Table Styles */
        .word-table {
            width: 100%;
            border-collapse: collapse;
        }

        /* REMOVED thead blocks per Design System */


        .word-table tr {

            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        }

        .word-table td {

        .col-word {

            cursor: pointer;
            /* Shows clickability */

            position: relative;
        }

        .col-word:hover {

        }

            gap: 10px;
            flex-wrap: wrap;
        }

        .qa-card {

        .qa-text-de {

        .qa-text-es {

        .ex-label {

        .close-btn {

        @media (max-width: 600px) {

            }

            /* .col-trans {
    display: none;
    } - User requested to show translation */

            .word-table td {

            }

        }

        /* Search Container */
        .search-container {

    <script charset="UTF-8" src="lid_kompakt_nouns.js?v=2026-04-08-2"></script>
    <script charset="UTF-8" src="lid_kompakt_modal.js?v=2026-04-08-2"></script>
    <script>
        const verbenPalette = [
            "#8b5cf6",
            "#ec4899",
            "#f59e0b",
            "#f97316",
            "#22c55e",
            "#3b82f6"
        ];

        function getModalEntryKey(groupId, itemWord) {
            return `${groupId}::${itemWord}`;
        }

        function normalizeModalItem(item) {
            if (!item) return item;

            const normalizedItem = { ...item };
            if (Array.isArray(normalizedItem.qa) && normalizedItem.qa.length) {
                delete normalizedItem.ex;
                delete normalizedItem.ex_es;
            }

            return normalizedItem;
        }

        function mergeModalData(groups, modalData) {
            return (groups || []).map(group => ({
                ...group,
                items: (group.items || []).map(item => ({
                    ...normalizeModalItem({
                        ...item,
                        ...((modalData || {})[getModalEntryKey(group.id, item.w)] || {})
                    })
                }))
            }));
        }

        const data = mergeModalData(window.lidKompaktData || [], window.lidKompaktModalData || {});

        // Helper: Get class based on article
        function getArtClass(art) {
            art = (art || "").toLowerCase().trim();
            if (!art) return 'none';
            if (art.includes('/')) return 'mixed';
            if (art.includes('der')) return 'der';
            if (art.includes('die') && !art.includes('pl')) return 'die';
            if (art.includes('das')) return 'das';
            return 'pl';
        }

        // Helper: Clean speech text (remove parenthesis content)
        function getSpeechText(art, word) {
            const cleanArt = (art || "").replace(/\(.*\)/, '').trim();
            return cleanArt ? `${cleanArt} ${word}` : word;
        }

        function getCardWord(item) {
            const word = (item.w || "").trim();
            if (!word.includes('/')) return word;

            const parts = word.split('/').map(part => part.trim()).filter(Boolean);
            if (parts.length < 2) return word;

            const normalizedArt = (item.art || "").toLowerCase().replace(/\s+/g, '');
            const maleIndex = normalizedArt.startsWith('der') ? 0 : 1;
            return parts[maleIndex] || parts[0];
        }

        function getCardArticle(item) {
            const art = (item.art || "").trim();
            if (!art.includes('/')) return art;

            const parts = art.split('/').map(part => part.trim()).filter(Boolean);
            if (parts.length < 2) return art;

            const normalizedArt = art.toLowerCase().replace(/\s+/g, '');
            const maleIndex = normalizedArt.startsWith('der') ? 0 : 1;
            return parts[maleIndex] || parts[0];
        }

        function getCardTranslation(item) {
            if (item.card_tr) return item.card_tr;
            const translation = (item.tr || "").trim();
            if (!translation.includes('/')) return translation;

            const parts = translation.split('/').map(part => part.trim()).filter(Boolean);
            if (parts.length < 2) return translation;

            const normalizedArt = (item.art || "").toLowerCase().replace(/\s+/g, '');
            const maleIndex = normalizedArt.startsWith('der') ? 0 : 1;
            return parts[maleIndex] || parts[0];
        }

        function formatHeaderTitle(text) {
            if (!text) return "";
            return text.charAt(0).toUpperCase() + text.slice(1).toLowerCase();
        }

        const headerThemeLabels = {
            institutionen: { de: "Organe", es: "Órganos" },
            bundesregierung: { de: "Regierung", es: "Gobierno" },
            wahlen: { de: "Wahlen", es: "Elecciones" },
            wahlrecht: { de: "Beteiligung", es: "Participación" },
            wahlsystem: { de: "Wahlsystem", es: "Sistema electoral" },
            bildung: { de: "Bildung", es: "Educación" },
            ordnung: { de: "Ordnung", es: "Orden" },
            landespolitik: { de: "Länder", es: "Estados federados" },
            "verwaltung-soziales": { de: "Verwaltung", es: "Administración" },
            "gesellschaft-extra": { de: "Alltag", es: "Vida cotidiana" },
            "beruf-wirtschaft": { de: "Wirtschaft", es: "Economía" },
            "weitere-begriffe": { de: "Begriffe", es: "Conceptos" },
            "staat-extra": { de: "Staat", es: "Estado" },
            "wirtschaft-extra": { de: "Wirtschaft", es: "Economía" },
            wahlformen: { de: "Wahlformen", es: "Voto" },
            parteien: { de: "Parteien", es: "Partidos" },
            staatsprinzipien: { de: "Prinzipien", es: "Principios" },
            werte: { de: "Werte", es: "Valores" },
            rechte: { de: "Rechte", es: "Derechos" },
            freiheiten: { de: "Freiheiten", es: "Libertades" },
            "recht-grundlagen": { de: "Recht", es: "Derecho" },
            gerichte: { de: "Justiz", es: "Justicia" },
            strafen: { de: "Strafen", es: "Penas" },
            diskriminierung: { de: "Schutz", es: "Protección" },
            pruefungslogik: { de: "Prüfungslogik", es: "Examen" },
            "deutsche-geschichte": { de: "Geschichte", es: "Historia" },
            gedenken: { de: "Gedenken", es: "Memoria" },
            "eu-integration": { de: "Integration", es: "Integración europea" },
            wiedervereinigung: { de: "Einheit", es: "Unidad" },
            berlin: { de: "Berlin", es: "Berlin" },
            gesellschaft: { de: "Gesellschaft", es: "Sociedad" },
            migration: { de: "Migration", es: "Migración" },
            "religion-gemeinschaft": { de: "Religion", es: "Religion" },
            sozialsystem: { de: "Soziales", es: "Social" },
            foederalismus: { de: "Föderalismus", es: "Federalismo" },
            eu: { de: "Europa", es: "Europa" },
            "kommune-aemter": { de: "Kommune", es: "Municipio" },
            behoerden: { de: "Behörden", es: "Autoridades" },
            staatsgewalten: { de: "Gewalten", es: "Poderes" },
            staatsaemter: { de: "Ämter", es: "Cargos" }
        };

        function getHeaderLabels(cat) {
            return headerThemeLabels[cat.id] || {
                de: formatHeaderTitle(cat.title),
                es: cat.title_es
            };
        }

        function validateCategorySize(groups) {
            const oversizedCategory = groups.find(cat => (cat.items || []).length > 7);
            if (!oversizedCategory) return;

            throw new Error(`Category "${oversizedCategory.id}" exceeds the maximum of 7 items.`);
        }

        // Initialize
        validateCategorySize(data);
        renderCards(data);

        // --- SEARCH LOGIC ---
        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            renderCards(data, query);
        }

        function normalizeForSearch(text) {
            return (text || "")
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase();
        }

        function highlightMatch(text, query) {
            if (!query || !text) return text;
            const originalText = String(text);
            const normalizedText = normalizeForSearch(originalText);
            const normalizedQuery = normalizeForSearch(query);

            if (!normalizedQuery) return originalText;

            const ranges = [];
            let startIndex = 0;

            while (startIndex < normalizedText.length) {
                const matchIndex = normalizedText.indexOf(normalizedQuery, startIndex);
                if (matchIndex === -1) break;
                ranges.push([matchIndex, matchIndex + normalizedQuery.length]);
                startIndex = matchIndex + normalizedQuery.length;
            }

            if (!ranges.length) return originalText;

            const normalizedCharMap = [];
            for (let i = 0; i < originalText.length; i++) {
                const folded = normalizeForSearch(originalText[i]) || originalText[i].toLowerCase();
                for (let j = 0; j < folded.length; j++) {
                    normalizedCharMap.push(i);
                }
            }

            let result = "";
            let originalCursor = 0;

            ranges.forEach(([normStart, normEnd]) => {
                const originalStart = normalizedCharMap[normStart];
                const originalEnd = normalizedCharMap[normEnd - 1] + 1;

                if (originalStart == null || originalEnd == null) return;

                result += originalText.slice(originalCursor, originalStart);
                result += `<mark class="search-highlight">${originalText.slice(originalStart, originalEnd)}</mark>`;
                originalCursor = originalEnd;
            });

            result += originalText.slice(originalCursor);
            return result;
        }

        function itemMatchesQuery(item, query) {
            if (!query) return true;

            const article = item.art || "";
            const translation = item.tr || "";
            const modalTranslation = item.modal_tr || "";
            const cardTranslation = item.card_tr ? item.card_tr.replace(/<br\s*\/?>/gi, ' ') : "";
            const example = item.ex || "";
            const exampleEs = item.ex_es || "";
            const qaText = item.qa ? item.qa.map(entry =>
                [entry.q, entry.a, entry.q_es, entry.a_es].join(' ')
            ).join(' ') : "";
            const noteText = item.note || "";
            const normalizedQuery = normalizeForSearch(query);

            return [
                item.w,
                article,
                translation,
                modalTranslation,
                cardTranslation,
                example,
                exampleEs,
                qaText,
                noteText
            ].some(value => normalizeForSearch(value).includes(normalizedQuery));
        }

        // --- RENDER LOGIC ---
        function renderCards(groups, query = "") {
            const container = document.getElementById('app-container');
            container.innerHTML = ""; // Clear existing

            groups.forEach((cat, catIndex) => {
                const categoryMatchesQuery = query && [
                    cat.title,
                    cat.title_es
                ].some(value => (value || "").toLowerCase().includes(query));

                const cardMatchesQuery = query
                    ? categoryMatchesQuery || cat.items.some(item => itemMatchesQuery(item, query))
                    : true;

                if (!cardMatchesQuery) return;

                const card = document.createElement('div');
                card.className = 'category-card';

                const headerLabels = getHeaderLabels(cat);
                const displayTitle = query && categoryMatchesQuery
                    ? highlightMatch(headerLabels.de, query)
                    : headerLabels.de;
                const displayTitleEs = query && categoryMatchesQuery
                    ? highlightMatch(headerLabels.es, query)
                    : headerLabels.es;

                const header = document.createElement('div');
                header.className = 'category-header';
                header.style.backgroundColor = verbenPalette[catIndex % verbenPalette.length];
                header.title = "Klicken für Übersetzung / Click para traducción";
                header.onclick = () => openCategoryModal(cat);

                header.innerHTML = `
                        <h2 class="category-title">${displayTitle}</h2>
                        <span class="category-title-es">${displayTitleEs}</span>
                    `;

                const table = document.createElement('table');
                table.className = 'word-table';
                const tbody = document.createElement('tbody');

                cat.items.forEach((item, index) => {
                    const artClass = getArtClass(item.art);
                    const tr = document.createElement('tr');
                    tr.className = artClass;

                    const cardWord = getCardWord(item);
                    const speechText = getSpeechText(getCardArticle(item), cardWord);
                    const itemMatches = itemMatchesQuery(item, query);

                    let displayWord = cardWord;
                    let displayTrans = getCardTranslation(item);

                    if (query && itemMatches) {
                        displayWord = highlightMatch(displayWord, query);
                        displayTrans = highlightMatch(displayTrans, query);
                    }

                    if (query && itemMatches) {
                        tr.classList.add('search-hit');
                    }

                    const importantStar = item.important ? '<span class="importance-star" title="Importante">★</span>' : '';
                    const useTag = item.tag === 'light';
                    const wordHTML = useTag ? `<span class="noun-tag noun-tag-light">${displayWord}</span>` : displayWord;

                    const tdWord = document.createElement('td');
                    tdWord.className = 'col-word';
                    tdWord.title = "Hören / Escuchar";
                    tdWord.onclick = (e) => {
                        e.stopPropagation();
                        speak(speechText);
                    };

                    const speakerIcon = index === 0 ? '<span style="margin-left:8px; font-size:0.9rem; vertical-align:middle;">🔊</span>' : '';

                    tdWord.innerHTML = `
                            <div class="word-wrapper">
                                <span class="article-dot"></span>
                                <span class="noun-text">${wordHTML}${importantStar} ${speakerIcon}</span>
                            </div>
                        `;

                    const tdTrans = document.createElement('td');
                    tdTrans.className = 'col-trans';
                    tdTrans.title = "Details & Beispiele / Detalles y ejemplos";
                    tdTrans.onclick = (e) => {
                        e.stopPropagation();
                        openWordModal(item, artClass);
                    };
                    tdTrans.innerHTML = displayTrans;

                    tr.appendChild(tdWord);
                    tr.appendChild(tdTrans);
                    tbody.appendChild(tr);
                });

                table.appendChild(tbody);
                card.appendChild(header);
                card.appendChild(table);
                container.appendChild(card);
            });

            // No Results Message
            if (container.innerHTML === "") {
                container.innerHTML = `
                    <div style="text-align:center; padding:40px; color:var(--text-muted); grid-column: 1 / -1;">
                        <div style="font-size:3rem; margin-bottom:10px;">🔍</div>
                        <p>Keine Ergebnisse gefunden / No results found</p>
                    </div>
                `;
            }
        }

        // Modal Logic
        const modal = document.getElementById('detail-modal');
        const mEmoji = document.getElementById('m-emoji');
        const mArt = document.getElementById('m-art');
        const mWord = document.getElementById('m-word');
        const mTrans = document.getElementById('m-trans');
        const mExDe = document.getElementById('m-ex-de');
        const mExEs = document.getElementById('m-ex-es');
        const mHeaderLine = document.getElementById('m-header-line');
        const mSpeaker = document.getElementById('m-speaker-icon');
        const mExampleCard = document.getElementById('m-example-card');
        const mQaSection = document.getElementById('m-qa-section');
        const mQaList = document.getElementById('m-qa-list');
        const mQaSliderHeader = document.getElementById('m-qa-slider-header');
        const mQaCounter = document.getElementById('m-qa-counter');
        const mQaPrev = document.getElementById('m-qa-prev');
        const mQaNext = document.getElementById('m-qa-next');
        const mQaDots = document.getElementById('m-qa-dots');
        const mNoteCard = document.getElementById('m-note-card');
        const mNote = document.getElementById('m-note');

        let currentSpeechText = "";
        let currentQaEntries = [];
        let currentQaIndex = 0;
        let currentQaStorageKey = "";

        function getQaStorageKey(item) {
            const art = item.art || '';
            return `lid_qa_index::${art}::${item.w}`;
        }

        function loadStoredQaIndex(storageKey, total) {
            if (!storageKey || !total || !window.localStorage) return 0;
            try {
                const storedValue = window.localStorage.getItem(storageKey);
                const parsed = Number.parseInt(storedValue, 10);
                if (Number.isInteger(parsed) && parsed >= 0 && parsed < total) return parsed;
            } catch (error) {
                return 0;
            }
            return 0;
        }

        function saveStoredQaIndex() {
            if (!currentQaStorageKey || !currentQaEntries.length || !window.localStorage) return;
            try {
                window.localStorage.setItem(currentQaStorageKey, String(currentQaIndex));
            } catch (error) {
                // Ignore storage failures quietly.
            }
        }

        function renderQaSlider() {
            mQaList.innerHTML = "";
            mQaDots.innerHTML = "";

            if (!currentQaEntries.length) {
                mQaSliderHeader.style.display = 'none';
                return;
            }

            const entry = currentQaEntries[currentQaIndex];
            const qaCard = document.createElement('div');
            qaCard.className = 'qa-card';
            qaCard.innerHTML = `
                <div class="qa-row">
                    <span class="qa-kind">Frage</span>
                    <div class="qa-text-de">${entry.q}</div>
                    <div class="qa-text-es">${entry.q_es}</div>
                </div>
                <div class="qa-row">
                    <span class="qa-kind">Antwort</span>
                    <div class="qa-text-de">${entry.a}</div>
                    <div class="qa-text-es">${entry.a_es}</div>
                </div>
            `;
            mQaList.appendChild(qaCard);

            mQaCounter.textContent = `${currentQaIndex + 1} / ${currentQaEntries.length}`;
            mQaSliderHeader.style.display = currentQaEntries.length > 1 ? 'flex' : 'none';
            mQaPrev.disabled = currentQaEntries.length <= 1;
            mQaNext.disabled = currentQaEntries.length <= 1;

            currentQaEntries.forEach((_, index) => {
                const dot = document.createElement('span');
                dot.className = `qa-slider-dot${index === currentQaIndex ? ' active' : ''}`;
                mQaDots.appendChild(dot);
            });
        }

        function stepQa(direction) {
            if (currentQaEntries.length <= 1) return;
            currentQaIndex = (currentQaIndex + direction + currentQaEntries.length) % currentQaEntries.length;
            saveStoredQaIndex();
            renderQaSlider();
        }

        // Function to open Modal for a specific WORD
        function openWordModal(item, artClass) {
            // Populate Data
            mEmoji.textContent = item.e;
            mArt.textContent = item.art;
            mWord.innerHTML = item.important ? `${item.w} <span class="importance-star" title="Importante">★</span>` : item.w;
            mTrans.textContent = item.modal_tr || item.tr;
            mExDe.textContent = item.ex;
            mExEs.textContent = item.ex_es;
            mNote.textContent = item.note || "";
            currentQaEntries = item.qa || [];
            currentQaStorageKey = currentQaEntries.length ? getQaStorageKey(item) : "";
            currentQaIndex = loadStoredQaIndex(currentQaStorageKey, currentQaEntries.length);
            renderQaSlider();

            currentSpeechText = getSpeechText(item.art, item.w);

            // Styling & Visibility
            mArt.style.display = item.art ? 'inline' : 'none';
            mExampleCard.style.display = item.qa && item.qa.length ? 'none' : 'block';
            mQaSection.style.display = item.qa && item.qa.length ? 'block' : 'none';
            mNoteCard.style.display = item.note ? 'block' : 'none';
            mEmoji.style.filter = ''; // Reset filter logic later
            mWord.style.color = 'white'; // Default

            // Set dynamic colors based on article
            mHeaderLine.className = `modal-word-line ${artClass}`;
            let colorVar;
            if (artClass === 'der') colorVar = 'var(--color-der)';
            else if (artClass === 'die') colorVar = 'var(--color-die)';
            else if (artClass === 'das') colorVar = 'var(--color-das)';
            else if (artClass === 'mixed') colorVar = 'var(--accent-gold)';
            else if (artClass === 'none') colorVar = 'var(--accent-green)';
            else colorVar = 'var(--color-pl)';

            mArt.style.color = colorVar;
            mEmoji.style.filter = `drop-shadow(0 0 15px ${colorVar})`;

            modal.classList.add('active');

            // REMOVED auto-speak here to keep actions distinct as requested
            // speak(currentSpeechText); 
        }

        // Function to open Modal for a CATEGORY
        function openCategoryModal(cat) {
            // Populate Data
            mEmoji.textContent = cat.icon;
            mWord.textContent = formatHeaderTitle(cat.title);
            mTrans.textContent = cat.title_es;

            currentSpeechText = cat.title;

            // Styling & Visibility
            mArt.style.display = 'none'; // Hide Article
            mExampleCard.style.display = 'none'; // Hide Examples
            mQaSection.style.display = 'none';
            mNoteCard.style.display = 'none';
            currentQaEntries = [];
            currentQaIndex = 0;
            currentQaStorageKey = "";
            renderQaSlider();

            mHeaderLine.className = `modal-word-line`; // No specific article class
            mWord.style.color = 'var(--accent-gold)'; // Special color for titles
            mEmoji.style.filter = 'drop-shadow(0 0 15px rgba(255,255,255,0.3))';

            modal.classList.add('active');

            // Auto-speak Title
            speak(currentSpeechText);
        }

        // Speaker click in modal
        mSpeaker.onclick = (e) => {
            e.stopPropagation();
            if (currentSpeechText) speak(currentSpeechText);
        }

        mQaPrev.onclick = (e) => {
            e.stopPropagation();
            stepQa(-1);
        };

        mQaNext.onclick = (e) => {
            e.stopPropagation();
            stepQa(1);
        };

        function closeModal(event) {
            if (event && event.target !== modal && !event.target.classList.contains('close-btn')) return;
            modal.classList.remove('active');
        }

        // TTS
        function speak(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'de-DE';

            // Attempt to use a German voice specifically if available
            const voices = window.speechSynthesis.getVoices();
            const deVoice = voices.find(v => v.lang.includes('de'));
            if (deVoice) utterance.voice = deVoice;

            window.speechSynthesis.speak(utterance);
        }

        // Load voices initially to ensure they are available
        if (window.speechSynthesis) {
            window.speechSynthesis.getVoices();
        }
    </script>
