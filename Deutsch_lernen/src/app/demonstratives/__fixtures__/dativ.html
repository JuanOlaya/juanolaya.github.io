<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>German Demonstratives - Dativ Case</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f7f7f7; }
        #table-container { max-width: calc(100vw - 4rem); overflow-x: hidden; }
        table { width: 100%; table-layout: auto; }
        td, th { overflow: visible; }
        .table-cell { padding: 0.25rem 0.3rem; white-space: nowrap; vertical-align: top; font-size: 0.8rem; }
        .wrap-cell { white-space: normal; }
        .study-cell { position: relative; display: flex; flex-direction: column; align-items: flex-start; cursor: pointer; padding: 0.3rem 0.3rem; min-height: 3.5rem; justify-content: center; }
        .merged-gender-cell { padding: 0.25rem 0.3rem; min-height: 5rem; display: flex; flex-direction: column; justify-content: flex-start; }
        .merged-gender-cell .study-cell { min-height: auto; padding: 0; margin-top: 0.3rem; }
        .merged-possessive-cell { padding: 0.4rem 0.6rem; white-space: normal; vertical-align: top; font-size: 0.9rem; line-height: 1.2; min-height: 5.5rem; }
        .german-phrase { color: #1f2937; font-size: 0.8rem; line-height: 1.2; }
        .base-article-german { background-color: #f0fdf4; display: inline-block; padding: 0.05rem 0.2rem; border-radius: 0.25rem; font-weight: 700; color: #15803d; }
        .spanish-translation { color: #4b5563; font-style: italic; font-size: 0.8rem; max-height: 0; overflow: hidden; opacity: 0; transition: max-height 0.3s ease-out, opacity 0.3s ease-out; line-height: 1.2; white-space: normal; margin-top: 0.1rem; }
        .study-cell:hover .spanish-translation, .study-cell.active .spanish-translation { max-height: 10rem; opacity: 1; }
        .dativ-determiner { font-weight: 700; color: #15803d; background-color: #f0fdf4; display: inline-block; padding: 0.1rem 0.2rem; border-radius: 0.25rem; }
        .force-open .spanish-translation { max-height: 10rem !important; opacity: 1 !important; margin-top: 0.1rem !important; }
        .stacked-content-line { margin-bottom: 2px; line-height: 1.2; }
    </style>
</head>
<body class="p-4 sm:p-8">
    <div class="max-w-7xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">German Demonstratives - Dativ Case (A1–A2)</h1>
        <p class="text-gray-600 mb-6">Demostrativos en alemán: diesem (a este), jenem (a aquel), jedem (a cada), welchem (a cuál) - Caso Dativ.</p>
        <div id="table-container" class="bg-white shadow-xl rounded-xl overflow-hidden border border-gray-200"></div>
        <div class="mt-6 flex justify-end">
            <button id="toggle-all-button" onclick="toggleAllTranslations()" class="px-4 py-2 bg-indigo-600 text-white font-semibold rounded-lg shadow-md hover:bg-indigo-700 transition duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-4 5a1 1 0 100 2h2a1 1 0 100-2h-2z" clip-rule="evenodd"/></svg>
                Mostrar todas las traducciones
            </button>
        </div>
    </div>

    <script>
        const tableData = [
            {
                "Tipo": "dieser (a este/esta)",
                "Trad. Tipo": "a este / a esta / a estos / a estas",
                "dem männlich": "diesem",
                "Männlich (M)": "Ich helfe diesem Mann.",
                "Trad. (M)": "Ayudo a este hombre.",
                "der weiblich": "dieser",
                "Weiblich (F)": "Er gibt dieser Frau Geld.",
                "Trad. (F)": "Él le da dinero a esta mujer.",
                "dem neutral": "diesem",
                "Neutral (N)": "Sie dankt diesem Kind.",
                "Trad. (N)": "Ella le agradece a este niño.",
                "den plural": "diesen",
                "Plural (P)": "Wir folgen diesen Leuten.",
                "Trad. (P)": "Seguimos a estas personas."
            },
            {
                "Tipo": "jener (a aquel/aquella)",
                "Trad. Tipo": "a aquel / a aquella / a aquellos / a aquellas",
                "dem männlich": "jenem",
                "Männlich (M)": "Er antwortet jenem Lehrer.",
                "Trad. (M)": "Él le responde a aquel profesor.",
                "der weiblich": "jener",
                "Weiblich (F)": "Sie schreibt jener Person.",
                "Trad. (F)": "Ella le escribe a aquella persona.",
                "dem neutral": "jenem",
                "Neutral (N)": "Wir geben jenem Tier Futter.",
                "Trad. (N)": "Le damos comida a aquel animal.",
                "den plural": "jenen",
                "Plural (P)": "Ich helfe jenen Studenten.",
                "Trad. (P)": "Ayudo a aquellos estudiantes."
            },
            {
                "Tipo": "jeder (a cada)",
                "Trad. Tipo": "a cada (singular)",
                "dem männlich": "jedem",
                "Männlich (M)": "Er gibt jedem Schüler ein Buch.",
                "Trad. (M)": "Él le da un libro a cada alumno.",
                "der weiblich": "jeder",
                "Weiblich (F)": "Sie hilft jeder Person.",
                "Trad. (F)": "Ella ayuda a cada persona.",
                "dem neutral": "jedem",
                "Neutral (N)": "Wir danken jedem Kind.",
                "Trad. (N)": "Le agradecemos a cada niño.",
                "den plural": "-",
                "Plural (P)": "-",
                "Trad. (P)": "(No se usa en plural)"
            },
            {
                "Tipo": "welcher (a cuál)",
                "Trad. Tipo": "a cuál / a cuáles (interrogativo)",
                "dem männlich": "welchem",
                "Männlich (M)": "Mit welchem Lehrer sprichst du?",
                "Trad. (M)": "¿Con cuál profesor hablas?",
                "der weiblich": "welcher",
                "Weiblich (F)": "Von welcher Person redest du?",
                "Trad. (F)": "¿De cuál persona hablas?",
                "dem neutral": "welchem",
                "Neutral (N)": "Aus welchem Land kommst du?",
                "Trad. (N)": "¿De cuál país vienes?",
                "den plural": "welchen",
                "Plural (P)": "Mit welchen Freunden gehst du?",
                "Trad. (P)": "¿Con cuáles amigos vas?"
            }
        ];

        const mergedDeterminerKeys = [
            { key: "dem männlich", example: "Männlich (M)", translation: "Trad. (M)", color: 'bg-green-200' },
            { key: "der weiblich", example: "Weiblich (F)", translation: "Trad. (F)", color: 'bg-green-300' },
            { key: "dem neutral", example: "Neutral (N)", translation: "Trad. (N)", color: 'bg-green-400' },
            { key: "den plural", example: "Plural (P)", translation: "Trad. (P)", color: 'bg-green-500' }
        ];

        const determinerKeys = ["dem männlich", "der weiblich", "dem neutral", "den plural"];

        let translationsVisible = false;
        function toggleAllTranslations() {
            const studyWrappers = document.querySelectorAll('.study-cell');
            const button = document.getElementById('toggle-all-button');
            const table = document.getElementById('table-container');
            translationsVisible = !translationsVisible;
            if (translationsVisible) {
                table.classList.add('force-open');
                button.textContent = 'Ocultar todas las traducciones';
            }
            else {
                table.classList.remove('force-open');
                button.textContent = 'Mostrar todas las traducciones';
                studyWrappers.forEach(w => w.classList.remove('active'));
            }
        }

        function renderTable() {
            const container = document.getElementById('table-container');
            let html = '<table class="divide-y divide-gray-300">';
            html += '<thead class="bg-gray-100">';
            html += '<tr>';
            html += `<th colspan="1" class="table-cell text-xs font-semibold uppercase tracking-wider text-gray-700 border-r border-gray-300 bg-green-100">Demostrativo</th>`;
            html += `<th colspan="4" class="table-cell text-xs font-semibold uppercase tracking-wider text-gray-700 bg-green-100">Dativ Case (por Género)</th>`;
            html += '</tr>';
            html += '<tr>';
            html += `<th colspan="1" class="table-cell text-xs font-semibold tracking-wider text-gray-700 border-r border-gray-300 bg-green-200">Tipo</th>`;
            const genders = [
                { title: 'Männlich (M)', color: 'bg-green-200', colspan: 1 },
                { title: 'Weiblich (F)', color: 'bg-green-300', colspan: 1 },
                { title: 'Neutral (N)', color: 'bg-green-400', colspan: 1 },
                { title: 'Plural (P)', color: 'bg-green-500', colspan: 1 }
            ];
            genders.forEach(g => {
                html += `<th colspan="${g.colspan}" class="table-cell text-xs font-semibold tracking-wider text-gray-900 ${g.color}">${g.title}</th>`;
            });
            html += '</tr>';
            html += '</thead>';

            const keysToSkip = ["Trad. (M)", "Trad. (F)", "Trad. (N)", "Trad. (P)", "Männlich (M)", "Weiblich (F)", "Neutral (N)", "Plural (P)", "Trad. Tipo"];

            html += '<tbody class="divide-y divide-gray-200">';
            tableData.forEach((row) => {
                html += `<tr class="hover:bg-opacity-75">`;

                const headers = [
                    "Tipo", "Trad. Tipo",
                    "dem männlich", "Männlich (M)", "Trad. (M)",
                    "der weiblich", "Weiblich (F)", "Trad. (F)",
                    "dem neutral", "Neutral (N)", "Trad. (N)",
                    "den plural", "Plural (P)", "Trad. (P)"
                ];

                headers.forEach((key) => {
                    const value = row[key];
                    if (keysToSkip.includes(key)) return;
                    let cellClass = 'table-cell text-sm text-gray-800 text-left';
                    let contentHtml = value;

                    if (determinerKeys.includes(key)) {
                        const mergedData = mergedDeterminerKeys.find(d => d.key === key);
                        const determiner = row[mergedData.key];
                        const exampleValue = row[mergedData.example];
                        const tradExampleValue = row[mergedData.translation];

                        const exampleTextToBold = determiner;
                        let styledExampleValue = exampleValue && exampleValue !== '-' ?
                            exampleValue.replace(new RegExp(`\\b(${exampleTextToBold})\\b`, 'i'), (m) => `<b>${m}</b>`) :
                            exampleValue;
                        cellClass += ` merged-gender-cell wrap-cell align-top ${mergedData.color}`;

                        if (exampleValue && exampleValue !== '-' && tradExampleValue && tradExampleValue !== '-') {
                            contentHtml = `
                                <span class="dativ-determiner">${determiner}</span>
                                <div class="study-cell cursor-pointer p-0 pt-1" onclick="this.classList.toggle('active')">
                                    <span class="german-phrase whitespace-nowrap">${styledExampleValue}</span>
                                    <span class="spanish-translation">${tradExampleValue}</span>
                                </div>`;
                        } else {
                            contentHtml = `<span class="dativ-determiner">${determiner}</span>`;
                        }
                    }
                    else if (key === "Tipo") {
                        const tipoValue = row["Tipo"];
                        const tradTipoValue = row["Trad. Tipo"];
                        contentHtml = `
                            <div class="stacked-content-line"><span class="base-article-german">${tipoValue}</span></div>
                            <div class="stacked-content-line text-xs italic text-gray-500" style="margin-top: 0.2rem;">${tradTipoValue}</div>`;
                        cellClass += ' merged-possessive-cell bg-green-100';
                    }

                    html += `<td class="${cellClass}">${contentHtml}</td>`;
                });
                html += '</tr>';
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        window.onload = renderTable;
    </script>
</body>
</html>
