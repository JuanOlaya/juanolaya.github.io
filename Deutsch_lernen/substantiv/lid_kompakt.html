            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #334155;

            /* Neon Article Colors */

            /* Red */

            /* Green */

        }

            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
            width: 100%;
            max-width: 1200px;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            background: linear-gradient(to right, #facc15, #f59e0b);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin: 0;
        }

        /* GRID LAYOUT - RESPONSIVE */
        .container {
            width: 100%;
            max-width: 1400px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            padding-bottom: 50px;
        }

        @media (min-width: 900px) {
            .container {
                grid-template-columns: repeat(2, 1fr);
                align-items: start;
            }
        }

        /* Interactive Title Word */
        .audio-trigger {
            color: var(--text-main);
            border-bottom: 2px dashed var(--accent-gold);
            cursor: pointer;
            padding-bottom: 2px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .audio-trigger:hover {
            color: var(--accent-gold);
            border-bottom-style: solid;
        }

        .audio-icon-small {
            font-size: 0.9rem;
        }

            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
        }

        .category-header {
            padding: 12px 20px;
            /* Background set dynamically via JS */
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            /* Interaction Cue */
            transition: filter 0.2s;
        }

        .category-header:hover {
            filter: brightness(1.1);
        }

        .category-icon {
            font-size: 1.4rem;
        }

        .category-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0;
            color: white;
            flex-grow: 1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-icon-header {
            font-size: 1rem;
            opacity: 0.5;
        }

        /* German Word: Mint */
        .noun-text {
            font-size: 1.1rem;
            font-weight: 700;
            color: #CBF6DB;
            /* Pale Mint Green from Design System */
            white-space: nowrap;
        }

        .col-trans {
            color: #F3F4F7;
            /* Off-White / Slate 50 from Design System */
            font-style: italic;
            font-size: 0.95rem;
            text-align: right;
            cursor: pointer;
            transition: color 0.2s;
        }

        .col-trans:hover {
            color: white;
            text-decoration: underline;
            text-decoration-style: dotted;
        }

        /* ... existing article colors ... */

        /* MODAL STYLES aligned with Adverb Design */
        /* ... (modal styles handled separately or below) ... */

        .word-table {
            width: 100%;
            border-collapse: collapse;
        }

        /* REMOVED thead blocks per Design System */


        .word-table tr {
            /* Removed row-wide pointer since interactions are split */
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .word-table tr:last-child {
            border-bottom: none;
        }

        .word-table tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
            /* Subtle row hover */
        }

        .word-table td {
            padding: 12px 20px;
            vertical-align: middle;
        }

        /* Word Cell Styling (German) */
        .col-word {
            width: auto;
            cursor: pointer;
            /* Shows clickability */
            transition: background-color 0.2s, color 0.2s;
            position: relative;
        }

        .col-word:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* Audio visual hint on hover */
        /* Audio visual hint on hover REMOVED per design system */

        .word-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .article-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px currentColor;
            flex-shrink: 0;
        }

        .article-text {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            width: 30px;
            opacity: 0.9;
            flex-shrink: 0;
        }

        .noun-text {
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            white-space: nowrap;
        }

        /* Translation Cell Styling (Spanish) */
        .col-trans {
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.95rem;
            text-align: right;
            cursor: pointer;
            /* Shows clickability */
            transition: color 0.2s;
        }

        .col-trans:hover {
            color: var(--text-main);
            text-decoration: underline;
            text-decoration-style: dotted;
        }

        .importance-star {
            color: var(--accent-gold);
            font-size: 0.95rem;
            margin-left: 6px;
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.45);
            vertical-align: middle;
        }

        /* Article Colors */
        .der .article-text,
        .der .article-dot {
            color: var(--color-der);
        }

        .die .article-text,
        .die .article-dot {
            color: var(--color-die);
        }

        .das .article-text,
        .das .article-dot {
            color: var(--color-das);
        }

        .pl .article-text,
        .pl .article-dot {
            color: var(--color-pl);
        }

        .mixed .article-text,
        .mixed .article-dot {
            color: var(--accent-gold);
        }

        .none .article-dot {
            opacity: 0;
            box-shadow: none;
        }

            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-overlay);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--card-bg);
            width: 90%;
            max-width: 500px;
            border-radius: 20px;
            border: 1px solid var(--accent-green);

            transform: translateY(20px);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            position: relative;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

            text-align: center;
            position: relative;

        .modal-body {

            margin-bottom: 5px;

            text-transform: uppercase;

        .modal-noun {

            text-align: center;
        }

        .modal-trans {

            font-size: 1.2rem;
            font-style: italic;
            display: block;
            margin-bottom: 20px;
            text-align: center;

            margin-left: 10px;
            vertical-align: middle;
            transition: transform 0.2s;

            color: var(--text-main);

            line-height: 1.5;

            color: var(--text-muted);

            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 10px;

            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
            z-index: 10;
        }

        .close-btn:hover {
            color: white;

    display: none;
    } - User requested to show translation */

            }

        .search-container {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }

            max-width: 400px;

            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-main);

            text-align: center;

            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

            outline: none;
            border-color: var(--accent-green);
            box-shadow: 0 0 0 3px rgba(0, 255, 161, 0.2);

    </style>
</head>

        // Initialize
        renderCards(data);

        // Helper: Get class based on article
        function getArtClass(art) {
            art = art.toLowerCase();
            if (art.includes('der')) return 'der';
            if (art.includes('die') && !art.includes('pl')) return 'die';
            if (art.includes('das')) return 'das';
            return 'pl';
        }

        // Helper: Clean speech text (remove parenthesis content)
        function getSpeechText(art, word) {
            const cleanArt = art.replace(/\(.*\)/, '').trim();
            return `${cleanArt} ${word}`;
        }

        // --- SEARCH LOGIC ---
        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            renderCards(data, query);
        }

        function highlightMatch(text, query) {
            if (!query || !text) return text;
            const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escapedQuery})`, 'gi');
            return text.replace(regex, '<span style="color:#00ffa1; font-weight:bold; text-decoration:underline;">$1</span>');
        }

        // --- RENDER LOGIC ---
        function renderCards(groups, query = "") {
            const container = document.getElementById('app-container');
            container.innerHTML = ""; // Clear existing

            groups.forEach(cat => {
                // Filter Items if Query exists
                let filteredItems = cat.items;
                if (query) {
                    filteredItems = cat.items.filter(item =>
                        item.w.toLowerCase().includes(query) ||
                        item.tr.toLowerCase().includes(query)
                    );
                }

                // If no items match in this category, skip
                if (filteredItems.length === 0) return;

                const chunkSize = 6;
                const totalChunks = Math.ceil(filteredItems.length / chunkSize);

                for (let i = 0; i < filteredItems.length; i += chunkSize) {
                    const chunk = filteredItems.slice(i, i + chunkSize);
                    const chunkIndex = Math.floor(i / chunkSize);

                    const card = document.createElement('div');
                    card.className = 'category-card';

                    // Title with Pagination if needed
                    let displayTitle = cat.title;
                    if (totalChunks > 1) {
                        displayTitle += ` <span style="opacity:0.7; font-size:0.9em;">(${chunkIndex + 1}/${totalChunks})</span>`;
                    }

                    // Header
                    const header = document.createElement('div');
                    header.className = 'category-header';
                    header.style.backgroundColor = cat.color;
                    header.title = "Klicken für Übersetzung / Click para traducción";
                    header.onclick = () => openCategoryModal(cat);

                    header.innerHTML = `
                        <div class="category-icon">${cat.icon}</div>
                        <h2 class="category-title">${displayTitle}</h2>
                        <span class="info-icon-header">ℹ️</span>
                    `;

                    // Table
                    const table = document.createElement('table');
                    table.className = 'word-table';
                    const tbody = document.createElement('tbody');

                    chunk.forEach((item, index) => {
                        const artClass = getArtClass(item.art);
                        const tr = document.createElement('tr');
                        tr.className = artClass;

                        const speechText = getSpeechText(item.art, item.w);

                        // Display Strings (with Highlight)
                        let displayWord = item.w;
                        let displayTrans = item.tr;

                        if (query) {
                            displayWord = highlightMatch(displayWord, query);
                            displayTrans = highlightMatch(displayTrans, query);
                        }

                        // 1. German Word Cell
                        const tdWord = document.createElement('td');
                        tdWord.className = 'col-word';
                        tdWord.title = "Hören / Escuchar";
                        tdWord.onclick = (e) => {
                            e.stopPropagation();
                            speak(speechText);
                        };

                        // Speaker Icon Logic: Only on first item of the chunk (index === 0)
                        const speakerIcon = index === 0 ? '<span style="margin-left:8px; font-size:0.9rem; vertical-align:middle;">🔊</span>' : '';

                        tdWord.innerHTML = `
                            <div class="word-wrapper">
                                <span class="article-dot"></span>
                                <span class="noun-text">${displayWord} ${speakerIcon}</span>
                            </div>
                        `;

                        // 2. Translation Cell
                        const tdTrans = document.createElement('td');
                        tdTrans.className = 'col-trans';
                        tdTrans.title = "Details & Beispiele / Detalles y ejemplos";
                        tdTrans.onclick = (e) => {
                            e.stopPropagation();
                            openWordModal(item, artClass);
                        };
                        tdTrans.innerHTML = displayTrans; // innerHTML for highlight spans

                        tr.appendChild(tdWord);
                        tr.appendChild(tdTrans);
                        tbody.appendChild(tr);
                    });

                    table.appendChild(tbody);
                    card.appendChild(header);
                    card.appendChild(table);
                    container.appendChild(card);
                }
            });

            // No Results Message
            if (container.innerHTML === "") {
                container.innerHTML = `
                    <div style="text-align:center; padding:40px; color:var(--text-muted); grid-column: 1 / -1;">
                        <div style="font-size:3rem; margin-bottom:10px;">🔍</div>
                        <p>Keine Ergebnisse gefunden / No results found</p>
                    </div>
                `;
            }
        }

        // Modal Logic
        const modal = document.getElementById('detail-modal');
        const mEmoji = document.getElementById('m-emoji');
        const mArt = document.getElementById('m-art');
        const mWord = document.getElementById('m-word');
        const mTrans = document.getElementById('m-trans');
        const mExDe = document.getElementById('m-ex-de');
        const mExEs = document.getElementById('m-ex-es');
        const mHeaderLine = document.getElementById('m-header-line');
        const mSpeaker = document.getElementById('m-speaker-icon');
        const mExampleCard = document.getElementById('m-example-card');

        let currentSpeechText = "";

        // Function to open Modal for a specific WORD
        function openWordModal(item, artClass) {
            // Populate Data
            mEmoji.textContent = item.e;
            mArt.textContent = item.art;
            mWord.textContent = item.w;
            mTrans.textContent = item.tr;
            mExDe.textContent = item.ex;
            mExEs.textContent = item.ex_es;

            currentSpeechText = getSpeechText(item.art, item.w);

            // Styling & Visibility
            mArt.style.display = 'inline'; // Show Article
            mExampleCard.style.display = 'block'; // Show Examples
            mEmoji.style.filter = ''; // Reset filter logic later
            mWord.style.color = 'white'; // Default

            // Set dynamic colors based on article
            mHeaderLine.className = `modal-word-line ${artClass}`;
            let colorVar;
            if (artClass === 'der') colorVar = 'var(--color-der)';
            else if (artClass === 'die') colorVar = 'var(--color-die)';
            else if (artClass === 'das') colorVar = 'var(--color-das)';
            else colorVar = 'var(--color-pl)';

            mArt.style.color = colorVar;
            mEmoji.style.filter = `drop-shadow(0 0 15px ${colorVar})`;

            modal.classList.add('active');

            // REMOVED auto-speak here to keep actions distinct as requested
            // speak(currentSpeechText); 
        }

        // Function to open Modal for a CATEGORY
        function openCategoryModal(cat) {
            // Populate Data
            mEmoji.textContent = cat.icon;
            mWord.textContent = cat.title;
            mTrans.textContent = cat.title_es;

            currentSpeechText = cat.title;

            // Styling & Visibility
            mArt.style.display = 'none'; // Hide Article
            mExampleCard.style.display = 'none'; // Hide Examples

            mHeaderLine.className = `modal-word-line`; // No specific article class
            mWord.style.color = 'var(--accent-gold)'; // Special color for titles
            mEmoji.style.filter = 'drop-shadow(0 0 15px rgba(255,255,255,0.3))';

            modal.classList.add('active');

            // Auto-speak Title
            speak(currentSpeechText);
        }

        // Speaker click in modal
        mSpeaker.onclick = (e) => {
            e.stopPropagation();
            if (currentSpeechText) speak(currentSpeechText);
        }

        function closeModal(event) {
            if (event && event.target !== modal && !event.target.classList.contains('close-btn')) return;
            modal.classList.remove('active');
        }

        // TTS
        function speak(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'de-DE';

            // Attempt to use a German voice specifically if available
            const voices = window.speechSynthesis.getVoices();
            const deVoice = voices.find(v => v.lang.includes('de'));
            if (deVoice) utterance.voice = deVoice;

            window.speechSynthesis.speak(utterance);
        }

        // Load voices initially to ensure they are available
        if (window.speechSynthesis) {
            window.speechSynthesis.getVoices();
        }
    </script>
