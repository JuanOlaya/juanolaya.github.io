            padding-bottom: 50px;

            align-items: center;
            gap: 5px;

            text-decoration-style: dotted;
        }

        /* ... existing article colors ... */

        /* ... (modal styles handled separately or below) ... */

        }

            height: 10px;
            border-radius: 50%;

            box-shadow: 0 0 8px currentColor;
            flex-shrink: 0;

            left: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-overlay);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;

            max-width: 500px;

</head>

                                        "ex": "Der Begriff ist im Test wichtig.",
                                        "ex_es": "El concepto es importante en el examen.",
                                        "qa": [
                                                  {
                                                            "q": "Was bedeutet der Begriff \"Demokratie\"?",
                                                            "a": "Volksherrschaft.",
                                                            "q_es": "¿Qué significa el concepto \"democracia\"?",
                                                            "a_es": "Gobierno del pueblo."
                                                  }
                                        ]
                              },
                              {
                                        "art": "die",
                                        "w": "Verbreitung",
                                        "e": "📣",
                                        "tr": "difusión",
                                        "ex": "Die Verbreitung von Hass ist verboten.",
                                        "ex_es": "La difusión del odio está prohibida.",
                                        "qa": [
                                                  {
                                                            "q": "Was ist in Deutschland verboten, wenn es um nationalsozialistische Propaganda geht?",
                                                            "a": "Die Verbreitung.",
                                                            "q_es": "¿Qué está prohibido en Alemania cuando se trata de propaganda nacionalsocialista?",
                                                            "a_es": "La difusión."
                                                  }
                                        ]
                              },
                              {
                                        "art": "der",
                                        "w": "Nachteil",
                                        "e": "👎",
                                        "tr": "desventaja",
                                        "ex": "Das ist ein Nachteil.",
                                        "ex_es": "Eso es una desventaja."
                              }
                    ]
          }
];

        // Helper: Get class based on article
        function getArtClass(art) {
            art = (art || "").toLowerCase().trim();
            if (!art) return 'none';
            if (art.includes('/')) return 'mixed';
            if (art.includes('der')) return 'der';
            if (art.includes('die') && !art.includes('pl')) return 'die';
            if (art.includes('das')) return 'das';
            return 'pl';
        }

        // Helper: Clean speech text (remove parenthesis content)
        function getSpeechText(art, word) {
            const cleanArt = (art || "").replace(/\(.*\)/, '').trim();
            return cleanArt ? `${cleanArt} ${word}` : word;
        }

        function getCardWord(item) {
            const word = (item.w || "").trim();
            if (!word.includes('/')) return word;

            const parts = word.split('/').map(part => part.trim()).filter(Boolean);
            if (parts.length < 2) return word;

            const normalizedArt = (item.art || "").toLowerCase().replace(/\s+/g, '');
            const maleIndex = normalizedArt.startsWith('der') ? 0 : 1;
            return parts[maleIndex] || parts[0];
        }

        function getCardArticle(item) {
            const art = (item.art || "").trim();
            if (!art.includes('/')) return art;

            const parts = art.split('/').map(part => part.trim()).filter(Boolean);
            if (parts.length < 2) return art;

            const normalizedArt = art.toLowerCase().replace(/\s+/g, '');
            const maleIndex = normalizedArt.startsWith('der') ? 0 : 1;
            return parts[maleIndex] || parts[0];
        }

        function getCardTranslation(item) {
            if (item.card_tr) return item.card_tr;
            const translation = (item.tr || "").trim();
            if (!translation.includes('/')) return translation;

            const parts = translation.split('/').map(part => part.trim()).filter(Boolean);
            if (parts.length < 2) return translation;

            const normalizedArt = (item.art || "").toLowerCase().replace(/\s+/g, '');
            const maleIndex = normalizedArt.startsWith('der') ? 0 : 1;
            return parts[maleIndex] || parts[0];
        }

        function formatHeaderTitle(text) {
            if (!text) return "";
            return text.charAt(0).toUpperCase() + text.slice(1).toLowerCase();
        }

        const headerThemeLabels = {
            institutionen: { de: "Institutionen", es: "Instituciones" },
            wahlen: { de: "Wahlen", es: "Elecciones" },
            wahlrecht: { de: "Wahlrecht", es: "Sufragio" },
            parteien: { de: "Parteien", es: "Partidos" },
            staatsprinzipien: { de: "Staatsprinzipien", es: "Principios" },
            werte: { de: "Werte", es: "Valores" },
            rechte: { de: "Rechte", es: "Derechos" },
            freiheiten: { de: "Freiheiten", es: "Libertades" },
            "recht-grundlagen": { de: "Grundlagen", es: "Bases" },
            gerichte: { de: "Justiz", es: "Justicia" },
            strafen: { de: "Strafen", es: "Penas" },
            diskriminierung: { de: "Diskriminierung", es: "Discriminación" },
            pruefungslogik: { de: "Prüfungslogik", es: "Examen" },
            "deutsche-geschichte": { de: "Geschichte", es: "Historia" },
            wiedervereinigung: { de: "Deutschland", es: "Alemania" },
            berlin: { de: "Berlin", es: "Berlin" },
            gesellschaft: { de: "Gesellschaft", es: "Sociedad" },
            migration: { de: "Migration", es: "Migración" },
            "religion-gemeinschaft": { de: "Religion", es: "Religion" },
            sozialsystem: { de: "Sozialsystem", es: "Sistema" },
            foederalismus: { de: "Föderalismus", es: "Federalismo" },
            eu: { de: "EU", es: "Unión Europea" },
            "kommune-aemter": { de: "Kommune", es: "Municipio" },
            behoerden: { de: "Behörden", es: "Autoridades" },
            staatsgewalten: { de: "Staatsgewalten", es: "Poderes" },
            staatsaemter: { de: "Staatsämter", es: "Cargos" }
        };

        function getHeaderLabels(cat) {
            return headerThemeLabels[cat.id] || {
                de: formatHeaderTitle(cat.title),
                es: cat.title_es
            };
        }

        // Initialize
        renderCards(data);

        // --- SEARCH LOGIC ---
        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            renderCards(data, query);
        }

        function highlightMatch(text, query) {
            if (!query || !text) return text;
            const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escapedQuery})`, 'gi');
            return text.replace(regex, '<span style="color:#00ffa1; font-weight:bold; text-decoration:underline;">$1</span>');
        }

        function itemMatchesQuery(item, query) {
            if (!query) return true;

            const article = item.art || "";
            const translation = item.tr || "";
            const modalTranslation = item.modal_tr || "";
            const cardTranslation = item.card_tr ? item.card_tr.replace(/<br\s*\/?>/gi, ' ') : "";
            const example = item.ex || "";
            const exampleEs = item.ex_es || "";
            const qaText = item.qa ? item.qa.map(entry =>
                [entry.q, entry.a, entry.q_es, entry.a_es].join(' ')
            ).join(' ') : "";

            return [
                item.w,
                article,
                translation,
                modalTranslation,
                cardTranslation,
                example,
                exampleEs,
                qaText
            ].some(value => (value || "").toLowerCase().includes(query));
        }

        // --- RENDER LOGIC ---
        function renderCards(groups, query = "") {
            const container = document.getElementById('app-container');
            container.innerHTML = ""; // Clear existing

            groups.forEach((cat, catIndex) => {
                const chunkSize = 7;
                const allChunks = [];
                for (let i = 0; i < cat.items.length; i += chunkSize) {
                    allChunks.push({
                        items: cat.items.slice(i, i + chunkSize),
                        index: Math.floor(i / chunkSize)
                    });
                }

                const categoryMatchesQuery = query && [
                    cat.title,
                    cat.title_es
                ].some(value => (value || "").toLowerCase().includes(query));

                const visibleChunks = query
                    ? allChunks.filter(chunk =>
                        categoryMatchesQuery ||
                        chunk.items.some(item => itemMatchesQuery(item, query))
                    )
                    : allChunks;

                if (visibleChunks.length === 0) return;

                const totalChunks = allChunks.length;

                visibleChunks.forEach(({ items: chunk, index: chunkIndex }) => {

                    const card = document.createElement('div');
                    card.className = 'category-card';

                    // Title with Pagination if needed
                    const headerLabels = getHeaderLabels(cat);
                    let displayTitle = headerLabels.de;
                    if (totalChunks > 1) {
                        displayTitle += ` <span style="opacity:0.7; font-size:0.9em;">(${chunkIndex + 1}/${totalChunks})</span>`;
                    }

                    // Header
                    const header = document.createElement('div');
                    header.className = 'category-header';
                    header.style.backgroundColor = verbenPalette[catIndex % verbenPalette.length];
                    header.title = "Klicken für Übersetzung / Click para traducción";
                    header.onclick = () => openCategoryModal(cat);

                    header.innerHTML = `
                        <h2 class="category-title">${displayTitle}</h2>
                        <span class="category-title-es">${headerLabels.es}</span>
                    `;

                    // Table
                    const table = document.createElement('table');
                    table.className = 'word-table';
                    const tbody = document.createElement('tbody');

                    chunk.forEach((item, index) => {
                        const artClass = getArtClass(item.art);
                        const tr = document.createElement('tr');
                        tr.className = artClass;

                        const cardWord = getCardWord(item);
                        const speechText = getSpeechText(getCardArticle(item), cardWord);
                        const itemMatches = itemMatchesQuery(item, query);

                        // Display Strings (with Highlight)
                        let displayWord = cardWord;
                        let displayTrans = getCardTranslation(item);

                        if (query && itemMatches) {
                            displayWord = highlightMatch(displayWord, query);
                            displayTrans = highlightMatch(displayTrans, query);
                        }

                        const importantStar = item.important ? '<span class="importance-star" title="Importante">★</span>' : '';
                        const useTag = item.tag === 'light';
                        const wordHTML = useTag ? `<span class="noun-tag noun-tag-light">${displayWord}</span>` : displayWord;

                        // 1. German Word Cell
                        const tdWord = document.createElement('td');
                        tdWord.className = 'col-word';
                        tdWord.title = "Hören / Escuchar";
                        tdWord.onclick = (e) => {
                            e.stopPropagation();
                            speak(speechText);
                        };

                        // Speaker Icon Logic: Only on first item of the chunk (index === 0)
                        const speakerIcon = index === 0 ? '<span style="margin-left:8px; font-size:0.9rem; vertical-align:middle;">🔊</span>' : '';

                        tdWord.innerHTML = `
                            <div class="word-wrapper">
                                <span class="article-dot"></span>
                                <span class="noun-text">${wordHTML}${importantStar} ${speakerIcon}</span>
                            </div>
                        `;

                        // 2. Translation Cell
                        const tdTrans = document.createElement('td');
                        tdTrans.className = 'col-trans';
                        tdTrans.title = "Details & Beispiele / Detalles y ejemplos";
                        tdTrans.onclick = (e) => {
                            e.stopPropagation();
                            openWordModal(item, artClass);
                        };
                        tdTrans.innerHTML = displayTrans; // innerHTML for highlight spans

                        tr.appendChild(tdWord);
                        tr.appendChild(tdTrans);
                        tbody.appendChild(tr);
                    });

                    table.appendChild(tbody);
                    card.appendChild(header);
                    card.appendChild(table);
                    container.appendChild(card);
                });
            });

            // No Results Message
            if (container.innerHTML === "") {
                container.innerHTML = `
                    <div style="text-align:center; padding:40px; color:var(--text-muted); grid-column: 1 / -1;">
                        <div style="font-size:3rem; margin-bottom:10px;">🔍</div>
                        <p>Keine Ergebnisse gefunden / No results found</p>
                    </div>
                `;
            }
        }

        // Modal Logic
        const modal = document.getElementById('detail-modal');
        const mEmoji = document.getElementById('m-emoji');
        const mArt = document.getElementById('m-art');
        const mWord = document.getElementById('m-word');
        const mTrans = document.getElementById('m-trans');
        const mExDe = document.getElementById('m-ex-de');
        const mExEs = document.getElementById('m-ex-es');
        const mHeaderLine = document.getElementById('m-header-line');
        const mSpeaker = document.getElementById('m-speaker-icon');
        const mExampleCard = document.getElementById('m-example-card');
        const mQaSection = document.getElementById('m-qa-section');
        const mQaList = document.getElementById('m-qa-list');
        const mNoteCard = document.getElementById('m-note-card');
        const mNote = document.getElementById('m-note');

        let currentSpeechText = "";

        // Function to open Modal for a specific WORD
        function openWordModal(item, artClass) {
            // Populate Data
            mEmoji.textContent = item.e;
            mArt.textContent = item.art;
            mWord.innerHTML = item.important ? `${item.w} <span class="importance-star" title="Importante">★</span>` : item.w;
            mTrans.textContent = item.modal_tr || item.tr;
            mExDe.textContent = item.ex;
            mExEs.textContent = item.ex_es;
            mNote.textContent = item.note || "";
            mQaList.innerHTML = "";

            if (item.qa && item.qa.length) {
                item.qa.forEach(entry => {
                    const qaCard = document.createElement('div');
                    qaCard.className = 'qa-card';
                    qaCard.innerHTML = `
                        <div class="qa-row">
                            <span class="qa-kind">Frage</span>
                            <div class="qa-text-de">${entry.q}</div>
                            <div class="qa-text-es">${entry.q_es}</div>
                        </div>
                        <div class="qa-row">
                            <span class="qa-kind">Antwort</span>
                            <div class="qa-text-de">${entry.a}</div>
                            <div class="qa-text-es">${entry.a_es}</div>
                        </div>
                    `;
                    mQaList.appendChild(qaCard);
                });
            }

            currentSpeechText = getSpeechText(item.art, item.w);

            // Styling & Visibility
            mArt.style.display = item.art ? 'inline' : 'none';
            mExampleCard.style.display = item.qa && item.qa.length ? 'none' : 'block';
            mQaSection.style.display = item.qa && item.qa.length ? 'block' : 'none';
            mNoteCard.style.display = item.note ? 'block' : 'none';
            mEmoji.style.filter = ''; // Reset filter logic later
            mWord.style.color = 'white'; // Default

            // Set dynamic colors based on article
            mHeaderLine.className = `modal-word-line ${artClass}`;
            let colorVar;
            if (artClass === 'der') colorVar = 'var(--color-der)';
            else if (artClass === 'die') colorVar = 'var(--color-die)';
            else if (artClass === 'das') colorVar = 'var(--color-das)';
            else if (artClass === 'mixed') colorVar = 'var(--accent-gold)';
            else if (artClass === 'none') colorVar = 'var(--accent-green)';
            else colorVar = 'var(--color-pl)';

            mArt.style.color = colorVar;
            mEmoji.style.filter = `drop-shadow(0 0 15px ${colorVar})`;

            modal.classList.add('active');

            // REMOVED auto-speak here to keep actions distinct as requested
            // speak(currentSpeechText); 
        }

        // Function to open Modal for a CATEGORY
        function openCategoryModal(cat) {
            // Populate Data
            mEmoji.textContent = cat.icon;
            mWord.textContent = formatHeaderTitle(cat.title);
            mTrans.textContent = cat.title_es;

            currentSpeechText = cat.title;

            // Styling & Visibility
            mArt.style.display = 'none'; // Hide Article
            mExampleCard.style.display = 'none'; // Hide Examples
            mQaSection.style.display = 'none';
            mNoteCard.style.display = 'none';

            mHeaderLine.className = `modal-word-line`; // No specific article class
            mWord.style.color = 'var(--accent-gold)'; // Special color for titles
            mEmoji.style.filter = 'drop-shadow(0 0 15px rgba(255,255,255,0.3))';

            modal.classList.add('active');

            // Auto-speak Title
            speak(currentSpeechText);
        }

        // Speaker click in modal
        mSpeaker.onclick = (e) => {
            e.stopPropagation();
            if (currentSpeechText) speak(currentSpeechText);
        }

        function closeModal(event) {
            if (event && event.target !== modal && !event.target.classList.contains('close-btn')) return;
            modal.classList.remove('active');
        }

        // TTS
        function speak(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'de-DE';

            // Attempt to use a German voice specifically if available
            const voices = window.speechSynthesis.getVoices();
            const deVoice = voices.find(v => v.lang.includes('de'));
            if (deVoice) utterance.voice = deVoice;

            window.speechSynthesis.speak(utterance);
        }

        // Load voices initially to ensure they are available
        if (window.speechSynthesis) {
            window.speechSynthesis.getVoices();
        }
    </script>
</body>
