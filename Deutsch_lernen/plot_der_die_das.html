<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Terminaciones de Sustantivos Alemanes</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      background: #f4f4f4;
    }
    .chart-wrapper {
      position: relative;
      display: inline-block;
    }
    canvas {
      max-width: 600px;
      max-height: 600px;
    }
    .chart-annotation {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.5rem;
      font-weight: bold;
      pointer-events: none;
    }
    #der-anno {
      left: calc(50% - 320px);
      color: red;
    }
    #die-anno {
      left: calc(50% + 220px);
      color: blue;
    }
  </style>
</head>
<body>

  <h1>Distribución de terminaciones de sustantivos alemanes</h1>
  <div class="chart-wrapper">
    <canvas id="myPieChart"></canvas>
    <div id="der-anno" class="chart-annotation">Der: 37.2 %</div>
    <div id="die-anno" class="chart-annotation">Die: 22.1 %</div>
  </div>

  <!-- Chart.js y plugin de datalabels -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
  <script>
    const labels = [
      '–er (der)', '–en (der)', '–el (der)',
      '–ig (der)', '–ich (der)', '–or (der)', '–us (der)', '–ant (der)', '–ist (der)', '–ling (der)', '–eur (der)',
      '–ur (die)', '–schaft (die)', '–ik (die)',
      '–ion (die)', '–ie (die)', '–ei (die)', '–heit (die)', '–ung (die)', '–keit (die)', '–in (die)', '–tät (die)',
      '–chen (das)', '–lein (das)', '–um (das)', '–ment (das)', '–tum (das)', '–ma (das)'
    ];
    const dataValues = [
      17.3, 12.4, 7.5,
       1.1,  1.0, 0.6, 0.5, 0.5, 0.5, 0.4, 0.2,
      15.98, 3.43, 2.66,
       2.0,  1.4, 1.1, 0.59, 0.58, 0.54, 0.7, 0.05,
       0.8,  0.4, 0.4, 0.3, 0.2, 0.15
    ];

    const ctx = document.getElementById('myPieChart').getContext('2d');
    new Chart(ctx, {
      type: 'pie',
      data: {
        labels,
        datasets: [{
          data: dataValues,
          backgroundColor: [
            '#FFCDD2','#EF9A9A','#E57373','#EF5350','#F44336','#E53935','#D32F2F','#C62828','#B71C1C','#FF8A80','#FF5252',
            '#BBDEFB','#90CAF9','#64B5F6','#42A5F5','#2196F3','#1E88E5','#1976D2','#1565C0','#0D47A1','#82B1FF',
            '#C8E6C9','#A5D6A7','#81C784','#66BB6A','#4CAF50','#43A047'
          ]
        }]
      },
      options: {
        plugins: {
          legend: { display: false },
          datalabels: {
            color: 'black',            // ahora en negro
            anchor: 'end',
            align: 'outside',
            clamp: true,
            formatter: (value, ctx) => {
              // incluir terminación + artículo + valor
              const label = ctx.chart.data.labels[ctx.dataIndex];
              return `${label}: ${value.toFixed(1)}%`;
            },
            font: ctx => ({
              size: 14,
              weight: ctx.dataset.data[ctx.dataIndex] > 3 ? 'bold' : 'normal'
            })
          }
        }
      },
      plugins: [ChartDataLabels]
    });
  </script>

</body>
</html>
