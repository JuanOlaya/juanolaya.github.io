    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f7f3ee 0%, #edf3f7 50%, #f3f8f5 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(230, 235, 240, 0.85);
            --text-main: #2d3748;
            --text-muted: #718096;
            --primary: #4a6fa5;
            --primary-light: #e9f0f8;
            --accent: #e07a5f;
            --accent-soft: #fdf0ec;
            --success: #38a169;
            --success-soft: #f0fff4;
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 20px 40px -15px rgba(65, 80, 105, 0.12);
            --radius-xl: 24px;
            --radius-md: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 40px;
        }

        .header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .level-badge {
            background: #e2e8f0;
            color: #4a5568;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 999px;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .version-toggle {
            display: inline-flex;
            background: white;
            padding: 3px;
            border-radius: 999px;
            box-shadow: var(--shadow-sm);
            gap: 2px;
            border: 1px solid #e2e8f0;
        }

        .ver-link {
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 999px;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }

        .ver-link.active {
            background: var(--accent);
            color: white;
        }

        .ver-link:hover:not(.active) {
            color: var(--primary);
            background: #f1f5f9;
        }

        /* Presentation Player Card */
        .presentation-card {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Progress Bar Section */
        .progress-section {
            padding: 20px 28px 12px;
            border-bottom: 1px solid rgba(226, 232, 240, 0.7);
        }

        .progress-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 10px;
        }

        .category-tag {
            display: inline-flex;
            align-items: center;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--primary);
            background: var(--primary-light);
            padding: 4px 12px;
            border-radius: 999px;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .progress-segments {
            display: flex;
            gap: 6px;
            width: 100%;
            height: 6px;
        }

        .progress-step {
            flex: 1;
            height: 100%;
            background: #e2e8f0;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .progress-step.completed {
            background: var(--primary);
            opacity: 0.6;
        }

        .progress-step.active {
            background: var(--accent);
            opacity: 1;
        }

        /* Subtitle Stage */
        .stage {
            min-height: 280px;
            padding: 40px 32px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            background: radial-gradient(circle at 50% 30%, rgba(255, 255, 255, 0.96), rgba(248, 250, 252, 0.85));
        }

        .german-text-wrap {
            position: relative;
            margin-bottom: 16px;
        }

        .german-text {
            font-size: 1.85rem;
            line-height: 1.45;
            font-weight: 700;
            color: var(--text-main);
            transition: all 0.25s ease;
            max-width: 780px;
        }

        @media (max-width: 600px) {
            .german-text {
                font-size: 1.35rem;
            }
        }

        .spanish-text {
            font-size: 1.12rem;
            font-weight: 500;
            color: #64748b;
            max-width: 700px;
            line-height: 1.4;
            transition: opacity 0.3s ease;
        }

        .spanish-text.hidden {
            display: none;
        }

        /* Audio Wave Indicator */
        .audio-wave {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 20px;
            margin-top: 18px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .audio-wave.playing {
            opacity: 1;
        }

        .wave-bar {
            width: 3px;
            height: 6px;
            background: var(--accent);
            border-radius: 2px;
            animation: bounce 0.8s ease-in-out infinite alternate;
        }

        .wave-bar:nth-child(2) { animation-delay: 0.15s; }
        .wave-bar:nth-child(3) { animation-delay: 0.3s; }
        .wave-bar:nth-child(4) { animation-delay: 0.45s; }
        .wave-bar:nth-child(5) { animation-delay: 0.6s; }

        @keyframes bounce {
            from { height: 4px; }
            to { height: 18px; }
        }

        /* Grammar Note Drawer */
        .grammar-box {
            margin: 6px 0 16px;
            padding: 14px 18px;
            background: #fff9f6;
            border-left: 4px solid var(--accent);
            border-radius: var(--radius-md);
            font-size: 0.92rem;
            line-height: 1.5;
            color: #5c4d47;
            display: none;
            animation: fadeIn 0.25s ease;
        }

        .grammar-box.show {
            display: block;
        }

        .grammar-title {
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Controls Section */
        .controls-section {
            padding: 18px 28px 24px;
            background: rgba(255, 255, 255, 0.8);
            border-top: 1px solid rgba(226, 232, 240, 0.8);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .primary-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
        }

        .ctrl-btn {
            background: white;
            border: 1px solid #e2e8f0;
            color: var(--text-main);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
        }

        .ctrl-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
            color: var(--primary);
        }

        .ctrl-btn.play-btn {
            width: 62px;
            height: 62px;
            background: var(--accent);
            color: white;
            border: none;
            font-size: 1.5rem;
            box-shadow: 0 8px 20px rgba(224, 122, 95, 0.35);
        }

        .ctrl-btn.play-btn:hover {
            transform: scale(1.06);
            background: #d4684c;
        }

        /* Settings Bar */
        .settings-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding-top: 12px;
            border-top: 1px dashed #e2e8f0;
            font-size: 0.88rem;
        }

        .segmented-group {
            display: inline-flex;
            background: #edf2f7;
            padding: 3px;
            border-radius: 999px;
            gap: 2px;
        }

        .seg-btn {
            border: none;
            background: transparent;
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .seg-btn.active {
            background: white;
            color: var(--text-main);
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: white;
            border: 1px solid #e2e8f0;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .toggle-btn.active {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Overview Accordion */
        .overview-section {
            width: 100%;
            max-width: 900px;
            margin-top: 24px;
            background: white;
            border-radius: var(--radius-xl);
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-sm);
            padding: 18px 24px;
            transition: all 0.2s ease;
        }

        .overview-top-row {
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .progress-status-badge {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent);
            background: var(--accent-soft);
            padding: 3px 10px;
            border-radius: 6px;
            letter-spacing: 0.3px;
        }

        .overview-header {
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .overview-title {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-main);
        }

        .overview-toggle-icon {
            font-size: 0.85rem;
            transition: transform 0.25s ease;
            color: var(--text-muted);
        }

        .overview-section.open .overview-toggle-icon {
            transform: rotate(180deg);
        }

        .sentence-list {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #edf2f7;
        }

        .overview-section.open .sentence-list {
            display: flex;
        }

        .sentence-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            border: 1px solid #edf2f7;
            background: #fafbfc;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .sentence-item:hover {
            background: var(--primary-light);
            border-color: #cbd5e1;
            transform: translateX(3px);
        }

        .sentence-item.active {
            background: #fdf2ee;
            border-color: var(--accent);
        }

        .sentence-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .item-num {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
        }

        .item-de {
            font-size: 0.98rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .item-play-icon {
            color: var(--primary);
            font-size: 1.1rem;
            opacity: 0.7;
            margin-left: 12px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

                        "id": 11,
                        "category": "5. Sprachen",
                        "de": "Auch spreche ich Deutsch und ein bisschen Englisch.",
                        "es": "También hablo alemán y un poco de inglés.",
                        "grammar": "<b>auch</b> en posición 1 genera inversión del verbo conjugado (<i>spreche ich</i>).",
                        "filename": "11_deutsch_englisch.mp3",
                        "start": 53.74,
                        "end": 58.78,
                        "duration": 5.04
            },
            {
                        "id": 12,
                        "category": "6. Zukunft & Ziel",
                        "de": "Ich lerne Deutsch, weil ich in Deutschland lebe und später gerne wieder als Rechtsanwältin arbeiten möchte.",
                        "es": "Aprendo alemán porque vivo en Alemania y más adelante me gustaría volver a trabajar como abogada.",
                        "grammar": "Oración compleja coordinada dentro de la subordinada causal con <b>weil</b>: <i>...lebe und später gerne wieder ... arbeiten möchte</i>.",
                        "filename": "12_deutsch_ziel_rechtsanwaeltin.mp3",
                        "start": 59.53,
                        "end": 69.87,
                        "duration": 10.34
            }
];

        let currentIndex = 0;
        let isPlaying = false;
        let studyMode = 'continuous'; // 'continuous' or 'shadowing'
        let playbackRate = 1.0;
        let showSpanish = false;
        let showGrammar = false;
        let isSeekingInternally = false;

        const audioPlayer = document.getElementById('audio-player');
        const btnPlay = document.getElementById('btn-play');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnRepeat = document.getElementById('btn-repeat');
        const germanText = document.getElementById('german-text');
        const spanishText = document.getElementById('spanish-text');
        const categoryTag = document.getElementById('category-tag');
        const progressText = document.getElementById('progress-text');
        const progressSegments = document.getElementById('progress-segments');
        const audioWave = document.getElementById('audio-wave');
        const grammarBox = document.getElementById('grammar-box');
        const grammarContent = document.getElementById('grammar-content');
        const toggleSpanishBtn = document.getElementById('toggle-spanish');
        const toggleGrammarBtn = document.getElementById('toggle-grammar');
        const modeContinuousBtn = document.getElementById('mode-continuous');
        const modeShadowingBtn = document.getElementById('mode-shadowing');
        const sentenceList = document.getElementById('sentence-list');
        const overviewSection = document.getElementById('overview-section');
        const overviewHeader = document.getElementById('overview-header');

        overviewHeader.onclick = () => {
            overviewSection.classList.toggle('open');
        };

        // Initialize UI Elements
        function initUI() {
            progressSegments.innerHTML = '';
            sentenceList.innerHTML = '';

            sentences.forEach((s, idx) => {
                // Segment
                const seg = document.createElement('div');
                seg.className = 'progress-step' + (idx === 0 ? ' active' : '');
                seg.onclick = () => jumpToSentence(idx, true);
                seg.title = `Satz ${idx + 1}: ${s.de}`;
                progressSegments.appendChild(seg);

                // List item (No Spanish shown as requested)
                const item = document.createElement('div');
                item.className = 'sentence-item' + (idx === 0 ? ' active' : '');
                item.id = `item-${idx}`;
                item.onclick = () => jumpToSentence(idx, true);
                item.innerHTML = `
                    <div class="sentence-info">
                        <span class="item-num">Satz ${idx + 1} • ${s.category.split('. ')[1] || s.category}</span>
                        <span class="item-de">${s.de}</span>
                    </div>
                    <span class="item-play-icon">▶</span>
                `;
                sentenceList.appendChild(item);
            });

            updateDisplay();
            initMediaSession();
        }

        function updateDisplay() {
            const current = sentences[currentIndex];
            germanText.textContent = current.de;
            spanishText.textContent = current.es;
            categoryTag.textContent = current.category;
            grammarContent.innerHTML = current.grammar;

            progressText.textContent = `Satz ${currentIndex + 1} von ${sentences.length}`;

            // Update progress segments
            const segs = progressSegments.children;
            for (let i = 0; i < segs.length; i++) {
                segs[i].className = 'progress-step';
                if (i < currentIndex) segs[i].classList.add('completed');
                else if (i === currentIndex) segs[i].classList.add('active');
            }

            // Update list active
            const items = sentenceList.children;
            for (let i = 0; i < items.length; i++) {
                items[i].classList.toggle('active', i === currentIndex);
            }

            updateMediaSessionMetadata();
        }

        // Web MediaSession API for lock-screen & background control on Android
        function initMediaSession() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.setActionHandler('play', () => playCurrent());
                navigator.mediaSession.setActionHandler('pause', () => pauseCurrent());
                navigator.mediaSession.setActionHandler('previoustrack', () => {
                    if (currentIndex > 0) jumpToSentence(currentIndex - 1, true);
                });
                navigator.mediaSession.setActionHandler('nexttrack', () => {
                    if (currentIndex < sentences.length - 1) jumpToSentence(currentIndex + 1, true);
                });
                try {
                    navigator.mediaSession.setActionHandler('seekto', (details) => {
                        if (details.seekTime != null) {
                            audioPlayer.currentTime = details.seekTime;
                        }
                    });
                } catch (e) {}
            }
        }

        function updateMediaSessionMetadata() {
            if ('mediaSession' in navigator) {
                const s = sentences[currentIndex];
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: `${s.de}`,
                    artist: 'Angela (B1 Vorstellung)',
                    album: 'Deutsch Sprechen B1',
                    artwork: [
                        { src: 'https://juanolaya.github.io/Deutsch_lernen/favicon.ico', sizes: '96x96', type: 'image/x-icon' }
                    ]
                });
            }
        }

        function playCurrent() {
            audioPlayer.playbackRate = playbackRate;
            audioPlayer.play().then(() => {
                isPlaying = true;
                btnPlay.textContent = '⏸';
                audioWave.classList.add('playing');
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.playbackState = 'playing';
                }
            }).catch(err => {
                console.warn('Playback prevented:', err);
            });
        }

        function pauseCurrent() {
            audioPlayer.pause();
            isPlaying = false;
            btnPlay.textContent = '▶';
            audioWave.classList.remove('playing');
            if ('mediaSession' in navigator) {
                navigator.mediaSession.playbackState = 'paused';
            }
        }

        function jumpToSentence(idx, autoPlay = false) {
            if (idx < 0 || idx >= sentences.length) return;
            currentIndex = idx;
            isSeekingInternally = true;
            audioPlayer.currentTime = sentences[idx].start;
            updateDisplay();
            setTimeout(() => { isSeekingInternally = false; }, 150);

            if (autoPlay || isPlaying) {
                playCurrent();
            }
        }

        // Real-time synchronization during continuous playback
        audioPlayer.ontimeupdate = () => {
            if (isSeekingInternally) return;

            const t = audioPlayer.currentTime;

            // In Shadowing / Pause mode: check if sentence ended
            if (studyMode === 'shadowing') {
                const cur = sentences[currentIndex];
                if (t >= cur.end) {
                    pauseCurrent();
                    if (currentIndex < sentences.length - 1) {
                        currentIndex++;
                        audioPlayer.currentTime = sentences[currentIndex].start;
                        updateDisplay();
                    }
                    return;
                }
            }

            // In continuous mode: dynamically highlight active sentence based on timestamps
            let activeIdx = -1;
            for (let i = 0; i < sentences.length; i++) {
                const s = sentences[i];
                const nextStart = (i < sentences.length - 1) ? sentences[i + 1].start : s.end + 0.8;
                if (t >= s.start && t < nextStart) {
                    activeIdx = i;
                    break;
                }
            }

            if (activeIdx !== -1 && activeIdx !== currentIndex) {
                currentIndex = activeIdx;
                updateDisplay();
            }
        };

        audioPlayer.onended = () => {
            pauseCurrent();
            audioPlayer.currentTime = 0;
            currentIndex = 0;
            updateDisplay();
        };

        // Event Listeners
        btnPlay.onclick = () => {
            if (isPlaying) {
                pauseCurrent();
            } else {
                playCurrent();
            }
        };

        btnPrev.onclick = () => {
            if (currentIndex > 0) {
                jumpToSentence(currentIndex - 1, isPlaying);
            }
        };

        btnNext.onclick = () => {
            if (currentIndex < sentences.length - 1) {
                jumpToSentence(currentIndex + 1, isPlaying);
            }
        };

        btnRepeat.onclick = () => {
            jumpToSentence(currentIndex, true);
        };

        // Speed selectors
        document.querySelectorAll('[data-speed]').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('[data-speed]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                playbackRate = parseFloat(btn.dataset.speed);
                audioPlayer.playbackRate = playbackRate;
            };
        });

        // Mode selectors
        modeContinuousBtn.onclick = () => {
            studyMode = 'continuous';
            modeContinuousBtn.classList.add('active');
            modeShadowingBtn.classList.remove('active');
        };

        modeShadowingBtn.onclick = () => {
            studyMode = 'shadowing';
            modeShadowingBtn.classList.add('active');
            modeContinuousBtn.classList.remove('active');
        };

        // Toggles
        toggleSpanishBtn.onclick = () => {
            showSpanish = !showSpanish;
            toggleSpanishBtn.classList.toggle('active', showSpanish);
            spanishText.classList.toggle('hidden', !showSpanish);
        };

        toggleGrammarBtn.onclick = () => {
            showGrammar = !showGrammar;
            toggleGrammarBtn.classList.toggle('active', showGrammar);
            grammarBox.classList.toggle('show', showGrammar);
        };

        // Keyboard Shortcuts
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                btnPlay.click();
            } else if (e.code === 'ArrowRight') {
                e.preventDefault();
                btnNext.click();
            } else if (e.code === 'ArrowLeft') {
                e.preventDefault();
                btnPrev.click();
            } else if (e.key.toLowerCase() === 'r') {
                btnRepeat.click();
            }
        });

        // Startup
        initUI();
    </script>
</body>
</html>
