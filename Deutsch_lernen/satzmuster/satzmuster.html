<!DOCTYPE html>
<html lang="de" translate="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Deutsche Satzmuster</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --panel-2: #243247;
            --line: #334155;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #f59e0b;
            --accent-2: #fb7185;
            --a1: #22c55e;
            --a2: #3b82f6;
            --b1: #ec4899;
            --shadow: rgba(0, 0, 0, 0.28);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Nunito', sans-serif;
            background:
                radial-gradient(circle at top left, rgba(245, 158, 11, 0.08), transparent 30%),
                radial-gradient(circle at top right, rgba(236, 72, 153, 0.08), transparent 28%),
                var(--bg);
            color: var(--text);
        }

        .page {
            width: min(1240px, calc(100% - 32px));
            margin: 0 auto;
            padding: 28px 0 56px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 22px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            margin-left: auto;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(30, 41, 59, 0.9);
            color: var(--text);
            text-decoration: none;
            font-weight: 700;
            border: 1px solid rgba(148, 163, 184, 0.18);
        }

        .hero {
            text-align: center;
            margin-bottom: 26px;
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 800;
            line-height: 1;
        }

        .hero .accent {
            color: var(--accent);
        }

        .hero .underline {
            width: min(420px, 72%);
            height: 6px;
            border-radius: 999px;
            margin: 12px auto 0;
            background: linear-gradient(90deg, var(--accent), #fbbf24);
        }

        .hero p {
            margin: 18px auto 0;
            max-width: 760px;
            color: var(--muted);
            font-size: 1.04rem;
            font-weight: 600;
        }

        .toolbar {
            display: grid;
            grid-template-columns: minmax(0, 1.35fr) auto;
            gap: 16px;
            align-items: center;
            margin-bottom: 22px;
        }

        .lang-toggle {
            display: inline-flex;
            align-items: center;
            background: var(--panel);
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 999px;
            padding: 4px;
            box-shadow: 0 14px 30px var(--shadow);
        }

        .lang-btn {
            border: none;
            background: transparent;
            color: var(--muted);
            border-radius: 999px;
            padding: 10px 14px;
            font: inherit;
            font-weight: 900;
            cursor: pointer;
            min-width: 56px;
        }

        .lang-btn.active {
            background: linear-gradient(135deg, #f59e0b, #fbbf24);
            color: #1f2937;
        }

        .search-wrap {
            position: relative;
        }

        .search-input {
            width: 100%;
            border: 2px solid rgba(148, 163, 184, 0.2);
            background: var(--panel);
            color: var(--text);
            border-radius: 18px;
            padding: 16px 52px 16px 18px;
            font: inherit;
            font-size: 1rem;
            font-weight: 700;
            outline: none;
            box-shadow: 0 14px 30px var(--shadow);
        }

        .search-input::placeholder {
            color: #7c8aa0;
            font-weight: 600;
        }

        .search-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
        }

        .level-filters {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 10px;
        }

        .level-btn {
            border: 1px solid rgba(148, 163, 184, 0.18);
            background: var(--panel);
            color: var(--text);
            border-radius: 999px;
            padding: 12px 18px;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease;
        }

        .level-btn:hover {
            transform: translateY(-1px);
        }

        .level-btn.active[data-level="all"] {
            background: linear-gradient(135deg, #475569, #334155);
            box-shadow: 0 10px 24px rgba(51, 65, 85, 0.35);
        }

        .level-btn.active[data-level="A1"] {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            box-shadow: 0 10px 24px rgba(34, 197, 94, 0.28);
        }

        .level-btn.active[data-level="A2"] {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            box-shadow: 0 10px 24px rgba(59, 130, 246, 0.28);
        }

        .level-btn.active[data-level="B1"] {
            background: linear-gradient(135deg, #ec4899, #db2777);
            box-shadow: 0 10px 24px rgba(236, 72, 153, 0.28);
        }

        .section-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 22px;
        }

        .section-card {
            background: linear-gradient(180deg, rgba(36, 50, 71, 0.98), rgba(30, 41, 59, 0.98));
            border: 1px solid rgba(148, 163, 184, 0.16);
            border-radius: 26px;
            overflow: hidden;
            box-shadow: 0 18px 36px var(--shadow);
        }

        .section-header {
            padding: 18px 20px;
            color: white;
        }

        .section-header[data-level="A1"] {
            background: linear-gradient(135deg, #16a34a, #22c55e);
        }

        .section-header[data-level="A2"] {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
        }

        .section-header[data-level="B1"] {
            background: linear-gradient(135deg, #db2777, #ec4899);
        }

        .section-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .section-title {
            margin: 0;
            font-size: 1.9rem;
            line-height: 1;
        }

        .section-translation {
            font-size: 1rem;
            font-weight: 700;
            opacity: 0.9;
            text-align: right;
        }

        .section-level {
            display: inline-flex;
            margin-top: 10px;
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            background: rgba(15, 23, 42, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .pattern-list {
            padding: 10px 0 0;
        }

        .pattern-row {
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
            gap: 12px 18px;
            padding: 16px 20px;
            border-top: 1px solid var(--line);
            cursor: pointer;
            transition: background-color 0.18s ease;
        }

        .pattern-row:hover {
            background: rgba(51, 65, 85, 0.52);
        }

        .pattern-main {
            min-width: 0;
        }

        .pattern-structure {
            margin: 0;
            font-size: 1.18rem;
            font-weight: 800;
            color: #fef3c7;
        }

        .pattern-translation {
            margin-top: 6px;
            color: var(--text);
            font-weight: 700;
        }

        .pattern-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            gap: 8px;
            min-width: 0;
        }

        .use-chip {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 7px 10px;
            border-radius: 999px;
            background: rgba(59, 130, 246, 0.16);
            color: #bfdbfe;
            font-size: 0.84rem;
            font-weight: 800;
            text-align: center;
        }

        .row-level {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            border-radius: 999px;
            padding: 5px 9px;
            font-size: 0.74rem;
            font-weight: 900;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: white;
        }

        .row-level[data-level="A1"] {
            background: var(--a1);
        }

        .row-level[data-level="A2"] {
            background: var(--a2);
        }

        .row-level[data-level="B1"] {
            background: var(--b1);
        }

        .empty-state {
            display: none;
            margin-top: 20px;
            padding: 24px;
            border-radius: 24px;
            background: var(--panel);
            color: var(--muted);
            text-align: center;
            font-weight: 700;
            border: 1px solid rgba(148, 163, 184, 0.16);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(6px);
            z-index: 1000;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            width: min(760px, 100%);
            background: linear-gradient(180deg, #233146, #1e293b);
            border: 1px solid rgba(148, 163, 184, 0.16);
            border-radius: 26px;
            box-shadow: 0 22px 50px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            padding: 22px 24px 14px;
            background: linear-gradient(135deg, #f59e0b, #fb7185);
            color: white;
        }

        .modal-title {
            margin: 0;
            font-size: 2rem;
            line-height: 1.05;
        }

        .modal-subtitle {
            margin-top: 8px;
            font-weight: 700;
            font-size: 1rem;
            opacity: 0.96;
        }

        .modal-close {
            border: none;
            background: rgba(15, 23, 42, 0.18);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 999px;
            font: inherit;
            font-size: 1.4rem;
            font-weight: 800;
            cursor: pointer;
        }

        .modal-body {
            padding: 20px 24px 24px;
        }

        .modal-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
        }

        .modal-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(59, 130, 246, 0.14);
            color: #bfdbfe;
            font-weight: 800;
        }

        .modal-section-title {
            margin: 0 0 10px;
            font-size: 1rem;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .modal-example {
            background: rgba(15, 23, 42, 0.3);
            border: 1px solid rgba(148, 163, 184, 0.12);
            border-radius: 18px;
            padding: 16px;
        }

        .modal-example-de {
            margin: 0 0 10px;
            font-size: 1.15rem;
            font-weight: 800;
            color: #fef3c7;
        }

        .modal-example-translation {
            margin: 0;
            color: var(--text);
            font-weight: 700;
        }

        .mark {
            background: linear-gradient(135deg, #fde68a, #fb7185);
            color: #4a044e;
            border-radius: 6px;
            padding: 0 4px;
        }

        @media (max-width: 900px) {
            .toolbar {
                grid-template-columns: 1fr;
            }

            .level-filters {
                justify-content: flex-start;
            }
        }

        @media (max-width: 640px) {
            .page {
                width: min(100% - 18px, 1240px);
                padding-top: 18px;
            }

            .section-grid {
                grid-template-columns: 1fr;
            }

            .pattern-row {
                grid-template-columns: 1fr;
            }

            .pattern-meta {
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="topbar">
            <a class="back-link" href="../index.html">← Zurück</a>
            <div class="topbar-right">
                <div class="lang-toggle" id="langToggle" aria-label="Translation language">
                    <button class="lang-btn active" data-lang="es">ES</button>
                    <button class="lang-btn" data-lang="en">EN</button>
                </div>
            </div>
        </div>

        <header class="hero">
            <h1>Deutsche <span class="accent">Satzmuster</span></h1>
            <div class="underline"></div>
            <p>Strukturen para hablar con más naturalidad: opinión, obligación, posibilidad, tiempo, pasiva y expresiones impersonales.</p>
        </header>

        <div class="toolbar">
            <div class="search-wrap">
                <input id="searchInput" class="search-input" type="search"
                    placeholder="Suchen... (z.B. es gibt, because, obligación, generalización)">
                <span class="search-icon">🔎</span>
            </div>
            <div class="level-filters" id="levelFilters">
                <button class="level-btn active" data-level="all">Alle</button>
                <button class="level-btn" data-level="A1">A1</button>
                <button class="level-btn" data-level="A2">A2</button>
                <button class="level-btn" data-level="B1">B1</button>
            </div>
        </div>

        <div id="sectionGrid" class="section-grid"></div>
        <div id="emptyState" class="empty-state">No hay resultados para ese nivel o búsqueda.</div>
    </div>

    <div id="patternModalOverlay" class="modal-overlay" aria-hidden="true">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="patternModalTitle">
            <div class="modal-header">
                <div>
                    <h2 id="patternModalTitle" class="modal-title"></h2>
                    <div id="patternModalSubtitle" class="modal-subtitle"></div>
                </div>
                <button id="patternModalClose" class="modal-close" type="button" aria-label="Close">×</button>
            </div>
            <div class="modal-body">
                <div id="patternModalMeta" class="modal-meta"></div>
                <h3 class="modal-section-title">Beispiel</h3>
                <div class="modal-example">
                    <p id="patternModalExampleDe" class="modal-example-de"></p>
                    <p id="patternModalExampleTranslation" class="modal-example-translation"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const sections = [
            {
                id: "grundlagen",
                title: "Grundlagen",
                title_es: "Bases",
                title_en: "Basics",
                level: "A1",
                items: [
                    { de: "es gibt", es: "hay", en: "there is / there are", use: "existencia", level: "A1", example_de: "Es gibt heute einen Markt im Zentrum.", example_es: "Hay hoy un mercado en el centro.", example_en: "There is a market in the center today." },
                    { de: "es ist", es: "es / está", en: "it is", use: "estado general", level: "A1", example_de: "Es ist heute sehr kalt.", example_es: "Hoy hace mucho frío.", example_en: "It is very cold today." },
                    { de: "es + verbo (impersonal)", es: "llueve / ocurre", en: "it rains / it happens", use: "fenómenos", level: "A1", example_de: "Es regnet seit dem Morgen.", example_es: "Llueve desde la mañana.", example_en: "It has been raining since the morning." }
                ]
            },
            {
                id: "meinung",
                title: "Meinung",
                title_es: "Opinión",
                title_en: "Opinion",
                level: "B1",
                items: [
                    { de: "ich finde", es: "me parece", en: "I think / I find", use: "opinión", level: "A1", example_de: "Ich finde den Film sehr interessant.", example_es: "Me parece muy interesante la película.", example_en: "I find the movie very interesting." },
                    { de: "ich glaube", es: "creo", en: "I believe", use: "creencia", level: "A1", example_de: "Ich glaube, er kommt später.", example_es: "Creo que él llega más tarde.", example_en: "I believe he is coming later." },
                    { de: "man sagt", es: "se dice", en: "people say", use: "opinión general", level: "B1", example_de: "Man sagt, dass der Winter hart wird.", example_es: "Se dice que el invierno será duro.", example_en: "People say the winter will be harsh." },
                    { de: "meiner Meinung nach", es: "en mi opinión", en: "in my opinion", use: "opinión formal", level: "B1", example_de: "Meiner Meinung nach ist das eine gute Lösung.", example_es: "En mi opinión, esa es una buena solución.", example_en: "In my opinion, that is a good solution." }
                ]
            },
            {
                id: "faehigkeit",
                title: "Fähigkeit",
                title_es: "Capacidad",
                title_en: "Ability",
                level: "A2",
                items: [
                    { de: "ich kann", es: "puedo", en: "I can", use: "capacidad", level: "A1", example_de: "Ich kann heute länger bleiben.", example_es: "Puedo quedarme más tiempo hoy.", example_en: "I can stay longer today." },
                    { de: "man kann", es: "se puede", en: "one can", use: "posibilidad general", level: "A2", example_de: "Hier kann man gut spazieren gehen.", example_es: "Aquí se puede pasear bien.", example_en: "One can go for a nice walk here." },
                    { de: "es ist möglich", es: "es posible", en: "it is possible", use: "posibilidad", level: "A2", example_de: "Es ist möglich, online zu bezahlen.", example_es: "Es posible pagar en línea.", example_en: "It is possible to pay online." }
                ]
            },
            {
                id: "pflicht",
                title: "Pflicht",
                title_es: "Obligación",
                title_en: "Obligation",
                level: "B1",
                items: [
                    { de: "ich muss", es: "tengo que", en: "I must / have to", use: "obligación", level: "A1", example_de: "Ich muss morgen früh arbeiten.", example_es: "Tengo que trabajar mañana temprano.", example_en: "I have to work early tomorrow." },
                    { de: "ich soll", es: "debo (según otros)", en: "I should", use: "recomendación externa", level: "A2", example_de: "Ich soll mehr Wasser trinken.", example_es: "Debo beber más agua.", example_en: "I should drink more water." },
                    { de: "haben + zu + Inf.", es: "tener que", en: "to have to", use: "obligación formal", level: "B1", example_de: "Wir haben den Bericht heute abzugeben.", example_es: "Tenemos que entregar el informe hoy.", example_en: "We have to hand in the report today." },
                    { de: "sein + zu + Inf.", es: "deber / poder", en: "to be to", use: "obligación pasiva", level: "B1", example_de: "Das Problem ist sofort zu lösen.", example_es: "El problema debe resolverse de inmediato.", example_en: "The problem is to be solved immediately." }
                ]
            },
            {
                id: "wunsch",
                title: "Wunsch",
                title_es: "Deseo",
                title_en: "Desire",
                level: "A1",
                items: [
                    { de: "ich mag", es: "me gusta", en: "I like", use: "gusto", level: "A1", example_de: "Ich mag ruhige Cafés.", example_es: "Me gustan los cafés tranquilos.", example_en: "I like quiet cafés." },
                    { de: "ich möchte", es: "me gustaría", en: "I would like", use: "deseo", level: "A1", example_de: "Ich möchte einen Tee bestellen.", example_es: "Me gustaría pedir un té.", example_en: "I would like to order a tea." }
                ]
            },
            {
                id: "zeit",
                title: "Zeit",
                title_es: "Tiempo",
                title_en: "Time",
                level: "A2",
                items: [
                    { de: "ich habe Zeit", es: "tengo tiempo", en: "I have time", use: "disponibilidad", level: "A1", example_de: "Ich habe heute Abend Zeit.", example_es: "Tengo tiempo esta noche.", example_en: "I have time this evening." },
                    { de: "ich habe keine Zeit", es: "no tengo tiempo", en: "I have no time", use: "falta de tiempo", level: "A1", example_de: "Ich habe gerade keine Zeit für ein Treffen.", example_es: "Ahora no tengo tiempo para una reunión.", example_en: "I don't have time for a meeting right now." },
                    { de: "werden (Futur)", es: "ir a", en: "will", use: "futuro", level: "A1", example_de: "Ich werde morgen zu Hause bleiben.", example_es: "Mañana me quedaré en casa.", example_en: "I will stay at home tomorrow." },
                    { de: "ich war", es: "fui / estuve", en: "I was", use: "pasado básico", level: "A1", example_de: "Ich war gestern im Büro.", example_es: "Ayer estuve en la oficina.", example_en: "I was at the office yesterday." },
                    { de: "ich habe gemacht", es: "he hecho", en: "I have done", use: "experiencia", level: "A2", example_de: "Ich habe die Aufgabe schon gemacht.", example_es: "Ya he hecho la tarea.", example_en: "I have already done the task." }
                ]
            },
            {
                id: "passiv",
                title: "Passiv",
                title_es: "Pasiva",
                title_en: "Passive",
                level: "B1",
                items: [
                    { de: "werden (Passiv)", es: "ser", en: "to be (passive)", use: "voz pasiva", level: "B1", example_de: "Die E-Mail wird heute geschrieben.", example_es: "El correo se escribe hoy.", example_en: "The email is written today." },
                    { de: "das wird gemacht", es: "se hace", en: "it is done", use: "pasiva ejemplo", level: "B1", example_de: "Das wird morgen gemacht.", example_es: "Eso se hace mañana.", example_en: "That will be done tomorrow." },
                    { de: "lassen + Inf.", es: "dejar / hacer que", en: "to let / to have done", use: "acción indirecta", level: "B1", example_de: "Ich lasse mein Fahrrad reparieren.", example_es: "Voy a mandar reparar mi bicicleta.", example_en: "I am having my bike repaired." }
                ]
            },
            {
                id: "verbindungen",
                title: "Verbindungen",
                title_es: "Conectores",
                title_en: "Connectors",
                level: "A2",
                items: [
                    { de: "weil", es: "porque", en: "because", use: "causa", level: "A2", example_de: "Ich bleibe zu Hause, weil ich krank bin.", example_es: "Me quedo en casa porque estoy enfermo.", example_en: "I stay at home because I am sick." },
                    { de: "deshalb", es: "por eso", en: "therefore", use: "consecuencia", level: "A2", example_de: "Es regnet, deshalb nehme ich den Bus.", example_es: "Llueve, por eso tomo el autobús.", example_en: "It is raining, therefore I am taking the bus." },
                    { de: "um zu + Inf.", es: "para", en: "in order to", use: "propósito", level: "A2", example_de: "Ich lerne Deutsch, um in Berlin zu arbeiten.", example_es: "Aprendo alemán para trabajar en Berlín.", example_en: "I am learning German in order to work in Berlin." }
                ]
            },
            {
                id: "unpersoenlich",
                title: "Unpersönlich",
                title_es: "Impersonal",
                title_en: "Impersonal",
                level: "A2",
                items: [
                    { de: "es geht (um)", es: "se trata de", en: "it is about", use: "tema", level: "A2", example_de: "Im Artikel geht es um Sprache und Kultur.", example_es: "El artículo trata sobre lengua y cultura.", example_en: "The article is about language and culture." },
                    { de: "es geht + Dativ", es: "cómo está / me va", en: "how it goes", use: "estado personal", level: "A1", example_de: "Mir geht es heute viel besser.", example_es: "Hoy me va mucho mejor.", example_en: "I am doing much better today." },
                    { de: "man", es: "uno / la gente", en: "people / one", use: "generalización", level: "A2", example_de: "In Deutschland trinkt man viel Kaffee.", example_es: "En Alemania la gente bebe mucho café.", example_en: "In Germany people drink a lot of coffee." }
                ]
            }
        ];

        const sectionGrid = document.getElementById('sectionGrid');
        const emptyState = document.getElementById('emptyState');
        const searchInput = document.getElementById('searchInput');
        const levelButtons = Array.from(document.querySelectorAll('.level-btn'));
        const langButtons = Array.from(document.querySelectorAll('.lang-btn'));
        const modalOverlay = document.getElementById('patternModalOverlay');
        const modalClose = document.getElementById('patternModalClose');
        const modalTitle = document.getElementById('patternModalTitle');
        const modalSubtitle = document.getElementById('patternModalSubtitle');
        const modalMeta = document.getElementById('patternModalMeta');
        const modalExampleDe = document.getElementById('patternModalExampleDe');
        const modalExampleTranslation = document.getElementById('patternModalExampleTranslation');
        let currentLevel = 'all';
        let currentLang = 'es';
        let currentModalItem = null;

        function escapeRegExp(value) {
            return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function highlight(text, query) {
            if (!query) return text;
            const pattern = new RegExp(`(${escapeRegExp(query)})`, 'ig');
            return text.replace(pattern, '<mark class="mark">$1</mark>');
        }

        function matchesLevel(itemLevel, selectedLevel) {
            return selectedLevel === 'all' || itemLevel === selectedLevel;
        }

        function filterSections() {
            const query = searchInput.value.trim().toLowerCase();

            const filtered = sections
                .map(section => {
                    const matchedItems = section.items.filter(item => {
                        const haystack = [
                            section.title,
                            section.title_es,
                            section.title_en,
                            item.de,
                            item.es,
                            item.en,
                            item.use,
                            item.level
                        ].join(' ').toLowerCase();

                        const queryMatches = !query || haystack.includes(query);
                        const levelMatches = matchesLevel(item.level, currentLevel);
                        return queryMatches && levelMatches;
                    });

                    return { ...section, matchedItems };
                })
                .filter(section => section.matchedItems.length > 0);

            renderSections(filtered, query);
        }

        function getActiveTranslation(item) {
            return currentLang === 'en' ? item.en : item.es;
        }

        function getActiveExampleTranslation(item) {
            return currentLang === 'en' ? item.example_en : item.example_es;
        }

        function openModal(item) {
            currentModalItem = item;
            modalTitle.textContent = item.de;
            modalSubtitle.textContent = getActiveTranslation(item);
            modalMeta.innerHTML = `
                <div class="modal-chip">${item.use}</div>
                <div class="row-level" data-level="${item.level}">${item.level}</div>
            `;
            modalExampleDe.textContent = item.example_de;
            modalExampleTranslation.textContent = getActiveExampleTranslation(item);
            modalOverlay.classList.add('open');
            modalOverlay.setAttribute('aria-hidden', 'false');
        }

        function closeModal() {
            modalOverlay.classList.remove('open');
            modalOverlay.setAttribute('aria-hidden', 'true');
            currentModalItem = null;
        }

        function renderSections(filteredSections, query) {
            if (!filteredSections.length) {
                sectionGrid.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            sectionGrid.innerHTML = filteredSections.map(section => {
                const cardLevel = currentLevel === 'all'
                    ? section.matchedItems.reduce((acc, item) => {
                        const rank = { A1: 1, A2: 2, B1: 3 };
                        return rank[item.level] > rank[acc] ? item.level : acc;
                    }, section.matchedItems[0].level)
                    : currentLevel;

                return `
                    <section class="section-card">
                        <div class="section-header" data-level="${cardLevel}">
                            <div class="section-title-row">
                                <h2 class="section-title">${highlight(section.title, query)}</h2>
                                <div class="section-translation">${highlight(section.title_es, query)} / ${highlight(section.title_en, query)}</div>
                            </div>
                            <div class="section-level">${cardLevel}</div>
                        </div>
                        <div class="pattern-list">
                            ${section.matchedItems.map(item => `
                                <article class="pattern-row" data-section-id="${section.id}" data-item-de="${item.de}">
                                    <div class="pattern-main">
                                        <p class="pattern-structure">${highlight(item.de, query)}</p>
                                        <div class="pattern-translation">
                                            ${highlight(getActiveTranslation(item), query)}
                                        </div>
                                    </div>
                                    <div class="pattern-meta">
                                        <div class="use-chip">${highlight(item.use, query)}</div>
                                        <div class="row-level" data-level="${item.level}">${item.level}</div>
                                    </div>
                                </article>
                            `).join('')}
                        </div>
                    </section>
                `;
            }).join('');

            sectionGrid.querySelectorAll('.pattern-row').forEach((row, index) => {
                const flatItems = filteredSections.flatMap(section => section.matchedItems);
                const item = flatItems[index];
                row.addEventListener('click', () => openModal(item));
            });
        }

        levelButtons.forEach(button => {
            button.addEventListener('click', () => {
                levelButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                currentLevel = button.dataset.level;
                filterSections();
            });
        });

        langButtons.forEach(button => {
            button.addEventListener('click', () => {
                langButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                currentLang = button.dataset.lang;
                if (currentModalItem) {
                    openModal(currentModalItem);
                }
                filterSections();
            });
        });

        searchInput.addEventListener('input', filterSections);
        modalClose.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (event) => {
            if (event.target === modalOverlay) {
                closeModal();
            }
        });
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && modalOverlay.classList.contains('open')) {
                closeModal();
            }
        });

        filterSections();
    </script>
</body>

</html>
