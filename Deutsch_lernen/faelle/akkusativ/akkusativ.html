<head>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f7;
        }

        /* Remove horizontal scroll by making table fit viewport */
        #table-container {
            max-width: calc(100vw - 4rem); /* Account for body padding */
            overflow-x: hidden;
        }

        table {
            width: 100%;
            table-layout: auto;
        }

        /* Ensure all columns are visible */
        td, th {
            overflow: visible;
        }
        /* Reducir el padding de las celdas generales */
        .table-cell {
            padding: 0.25rem 0.3rem; /* Even more compact */
            white-space: nowrap;
            vertical-align: top; /* Ensure content aligns to the top */
            font-size: 0.8rem; /* Smaller font for better fit */
        }
        /* New style for cells that must wrap content (like the Base column) */
        .wrap-cell {
            white-space: normal;
        }

        /* --- Custom Styles for Inline Translation (Study Cell) --- */
        .study-cell {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            cursor: pointer;
            padding: 0.3rem 0.3rem; /* Reduced for compactness */
            min-height: 3.5rem; /* Slightly reduced for compactness */
            justify-content: center;
        }
        
        /* Specific style for the merged cell content (Gendered Akkusativ) */
        .merged-gender-cell {
            padding: 0.25rem 0.3rem; /* Further reduced for compact fit */
            min-height: 5rem; /* Reduced */
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        /* Ensure the study cell inside the merged gender cell is compact */
        .merged-gender-cell .study-cell {
            min-height: auto;
            padding: 0;
            margin-top: 0.3rem; /* Reduced space between determiner and example */
        }


        /* Style for the merged possessive cell */
        .merged-possessive-cell {
            padding: 0.4rem 0.6rem; /* Reduced */
            white-space: normal;
            vertical-align: top;
            font-size: 0.9rem;
            line-height: 1.2; /* Reduced line height */
            min-height: 5.5rem; /* Reduced */
        }
        
        /* NEW: Styles for the merged Pronoun Column (4-in-1 cell) */
        .merged-pronoun-cell {
            padding: 0.3rem 0.4rem; /* Further reduced */
            min-height: 5rem; /* Further reduced */
            display: flex;
            flex-direction: column;
            justify-content: center;
            white-space: normal; /* Allow wrapping to fit in viewport */
            /* Base color set in JS for consistency */
        }

        /* New style for the stacked content */
        .stacked-content-line {
            margin-bottom: 2px; /* Reduced vertical spacing */
            line-height: 1.2;
        }

        /* Base German/Spanish phrase styling */
        .german-phrase, .article-german-lines {
            color: #1f2937;
            font-size: 0.8rem; /* Smaller for better fit */
            line-height: 1.2;
        }
        
        /* NEW: Style for the visible German article part in Base/Trad column */
        .base-article-german {
            background-color: #fef2f2; 
            display: inline-block;
            padding: 0.05rem 0.2rem;
            border-radius: 0.25rem;
            font-weight: 700; 
            color: #991b1b; 
        }
        
        /* NEW: Style for the Akkusativ Pronoun itself */
        .akkusativ-pronoun-visible {
            font-weight: 700;
            color: #1D4ED8; /* Darker Blue for German Pronoun */
            background-color: #f0fdfa; /* Very light teal/mint background */
            display: inline-block;
            padding: 0.1rem 0.2rem;
            border-radius: 0.25rem;
            margin-right: 0.5rem;
        }
        
        /* NEW: Style for the Spanish Pronoun Translation */
        .trad-pronoun-visible {
            font-weight: 400; /* Regular weight */
            color: #4b5563; /* Dark gray for neutral look */
            font-style: italic; 
            font-size: 0.9rem;
        }

        /* NEW: Style for the hidden parts in the merged pronoun cell */
        .pronoun-hidden-part {
            color: #4b5563; 
            /* REMOVED font-style: italic; */
            font-size: 0.8rem;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
            line-height: 1.2;
            white-space: normal;
        }
        .merged-pronoun-cell:hover .pronoun-hidden-part,
        .merged-pronoun-cell.active .pronoun-hidden-part {
             max-height: 8rem;
             opacity: 1;
             margin-top: 0.2rem; /* Reduced margin */
        }


        /* NEW: Style for the hidden arrow and Spanish translation for Articles */
        .article-hidden-part {
            color: #4b5563; 
            font-style: italic;
            font-size: 0.8rem;
            opacity: 0;
            transition: opacity 0.3s ease-out;
            line-height: 1.2;
            white-space: normal;
            margin-left: 0.25rem; 
        }

        .spanish-translation {
            color: #4b5563; 
            font-style: italic;
            font-size: 0.8rem;
            max-height: 0; 
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
            line-height: 1.2;
            white-space: normal;
            margin-top: 0.1rem; /* Reduced margin */
        }

        /* --- Rule for revealing translations --- */
        .study-cell:hover .spanish-translation,
        .study-cell.active .spanish-translation {
            max-height: 10rem; 
            opacity: 1;
        }
        
        /* Rule for revealing the article translations (hidden part) */
        .article-study-cell-wrapper:hover .article-hidden-part,
        .article-study-cell-wrapper.active .article-hidden-part {
            opacity: 1;
        }

        /* NEW: Style for revealing the translations in the Subject column */
        .subject-study-cell:hover .subject-translation-hidden,
        .subject-study-cell.active .subject-translation-hidden {
            max-height: 5rem;
            opacity: 1;
        }
        
        /* Specific styling for the single interactive article cell */
        .article-study-cell-wrapper {
            cursor: pointer;
            padding: 0.4rem 0.6rem; /* Reduced */
            transition: background-color 0.15s ease-in-out;
            min-height: 5.5rem; /* Reduced */
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .article-study-cell-wrapper:hover,
        .article-study-cell-wrapper.active {
             background-color: #e5e5e5; 
        }
        /* Style for the nested translations inside the article study cell */
        .article-study-cell-wrapper .stacked-translation-line {
            display: block; 
            text-align: left;
        }

        /* NEW: Style for the IPA/Pronunciation hint */
        .pronunciation-hint {
            font-size: 0.8rem;
            color: #4b5563;
            font-weight: 500;
            margin-top: 0.1rem;
        }

        /* Hide pronunciation hint by default when combined with subject-translation-hidden */
        .pronunciation-hint.subject-translation-hidden {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
        }
        
        /* NEW: Style for simple Spanish translations in Subject column */
        .subject-spanish-translation {
            font-size: 0.8rem;
            color: #4b5563;
            font-style: italic;
            margin-top: 0.1rem;
            /* Hidden styles */
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
        }
        /* NEW: Style for parenthesis text in Subject column (now italic) */
        .subject-parenthesis-italic {
            font-size: 0.8rem;
            color: #4b5563;
            font-style: italic;
            margin-top: 0.1rem;
            /* Hidden styles */
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
        }
        
        /* NEW: Hidden style for the Nominative example translation */
        .nominativ-translation-hidden {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
        }

        /* NEW: Reveal Nominative example translation on hover */
        .possessive-study-wrapper:hover .nominativ-translation-hidden,
        .possessive-study-wrapper.active .nominativ-translation-hidden {
            max-height: 5rem;
            opacity: 1;
        }

        /* New style to highlight Akkusativ determiners */
        .akkusativ-determiner {
            font-weight: 700; 
            color: #991b1b; 
            background-color: #fef2f2; 
            display: inline-block;
            padding: 0.1rem 0.2rem;
            border-radius: 0.25rem;
        }

        /* Style for rows based on Personal Pronoun vs. Article */
        .article-row {
            background-color: #f7f7f7; 
        }
        .possessive-row {
            /* We will use direct styles in the TD tags instead of this class */
            background-color: #e0f2fe; /* Base light blue tone */
        }
        
        .subject-study-cell {
            min-height: 5.5rem; /* Reduced */
            padding: 0.4rem 0.6rem; /* Reduced */
            cursor: pointer;
            transition: background-color 0.15s ease-in-out;
        }

        /* Class for the global toggle to force translations open */
        .force-open .subject-translation-hidden,
        .force-open .article-hidden-part,
        .force-open .pronoun-hidden-part,
        .force-open .spanish-translation,
        .force-open .nominativ-translation-hidden {
            max-height: 10rem !important; /* Force open */
            opacity: 1 !important;
            margin-top: 0.1rem !important; /* Reduced margin */
        }
        
        /* NEW: Style for the abbreviated header text */
        .small-pronoun-header {
            font-size: 0.7rem; /* Smaller font size */
            line-height: 1;
        }
    </style>
</head>

                "Ejemplo Pronombre (Akkusativ)": "Ich sehe sie.",
                "Trad. Ejemplo": "Yo los/las veo.",
                "Base": "ihr-",
                "Trad. Base": "su (de ellos)-",
                "den männlich (akkusativ)": "ihren",
                "Männlich (M) - Ejemplos con Verbos": "Sie trinken ihren Tee.",
                "Trad. (M)": "Ellos beben su té.",
                "die weiblich (akkusativ)": "ihre",
                "Weiblich (F) - Ejemplos con Verbos": "Sie machen ihre Arbeit gut.",
                "Trad. (F)": "Ellos hacen su trabajo bien.",
                "das neutral (akkusativ)": "ihr",
                "Neutral (N) - Ejemplos con Verbos": "Sie brauchen ihr Auto.",
                "Trad. (N)": "Ellos necesitan su coche.",
                "die plural (akkusativ)": "ihre",
                "Plural (P) - Ejemplos con Verbos": "Sie rufen ihre Leute an.",
                "Trad. (P)": "Ellos llaman a su gente.",
                "Nom. Example": "Ihr Tee",
                "Trad. Nom. Example": "Su té",
            },
            {
                "Sujeto (Nominativo)": "Sie (formal)",
                "Pronombre (Akkusativ)": "Sie",
                "Trad. Pronombre": "lo/la/le",
                "Ejemplo Pronombre (Akkusativ)": "Ich frage Sie.",
                "Trad. Ejemplo": "Yo le pregunto.",
                "Base": "Ihr-",
                "Trad. Base": "su (formal)-",
                "den männlich (akkusativ)": "Ihren",
                "Männlich (M) - Ejemplos con Verbos": "Sie tragen Ihren Anzug heute.",
                "Trad. (M)": "Usted lleva su traje hoy.",
                "die weiblich (akkusativ)": "Ihre",
                "Weiblich (F) - Ejemplos con Verbos": "Sie besuchen Ihre Frau morgen.",
                "Trad. (F)": "Usted visita a su esposa mañana.",
                "das neutral (akkusativ)": "Ihr",
                "Neutral (N) - Ejemplos con Verbos": "Sie verkaufen Ihr Haus bald.",
                "Trad. (N)": "Usted vende su casa pronto.",
                "die plural (akkusativ)": "Ihre",
                "Plural (P) - Ejemplos con Verbos": "Sie treffen Ihre Freunde heute.",
                "Trad. (P)": "Usted se encuentra con sus amigos hoy.",
                "Nom. Example": "Ihr Anzug",
                "Trad. Nom. Example": "Su traje",
            }
        ];

        // Pronunciation map for Spanish speakers
        const pronunciationMap = {
            "ich": "/ij/",
            "du": "/du/",
            "er": "/ea/",
            "sie (ella)": "/si/",
            "es (neutro)": "/es/",
            "wir": "/via/",
            "ihr (vosotros)": "/ia/",
            "sie (ellos)": "/si/",
            "Sie (formal)": "/si/"
        };
        
        // Spanish translation map for simple pronouns
        const spanishTranslationMap = {
            "ich": "yo",
            "du": "tú",
            "er": "él",
            "wir": "nosotros/as"
        };


        // Helper function to format the Base and Translation Base columns
        function formatMultiLine(text, isTranslationBase) {
            if (typeof text !== 'string') return text;
            
            let newText = text.replace(/ \/ /g, '<br>');
            
            // 1. Reemplaza '(Nominativ)' por '<br>(Nom.)' SOLO en la columna BASE (alemán).
            if (!isTranslationBase) {
                newText = newText.replace(/\(Nominativ\)/g, '<br>(Nom.)');
            } else {
                // 2. Si es la columna de TRADUCCIÓN BASE, elimina '(Nominativ)' y el guión final.
                newText = newText.replace(/\(Nominativ\)/g, '').replace(/-\s*$/, '');
            }

            return newText;
        }

        // Helper function to format the Sujeto (Nominativo) column
        function formatSubjectColumn(text) {
            if (typeof text !== 'string') return text;
            
            // Regex to find the base text and the parenthesis text
            const parenthesisMatch = text.match(/ \((ella|vosotros|ellos|formal|neutro)\)/);
            const baseText = text.replace(parenthesisMatch ? parenthesisMatch[0] : '', '').trim();
            const pronunciation = pronunciationMap[text] || '';
            const simpleSpanishTranslation = spanishTranslationMap[baseText] || '';
            
            let formattedText = '';
            
            // --- Format the base pronoun (ich, du, er, wir) ---
            if (spanishTranslationMap[baseText]) {
                formattedText += `<span class="akkusativ-pronoun-visible">${baseText}</span>`;
                // SHOW: Simple Spanish translation is always visible
                if (simpleSpanishTranslation) {
                    formattedText += `<br><span class="text-xs italic text-gray-500" style="margin-top: 0.2rem;">${simpleSpanishTranslation}</span>`;
                }
                // HIDE: Pronunciation is now hidden until hover
                if (pronunciation) {
                    formattedText += `<br><span class="pronunciation-hint subject-translation-hidden">${pronunciation}</span>`;
                }
            }
            // --- Format the complex pronouns (sie, es, ihr, Sie) ---
            else {
                 // Text is the German pronoun (sie, es, ihr, Sie)
                formattedText += `<span class="akkusativ-pronoun-visible">${baseText}</span>`;

                // SHOW: Parenthesis content (translation) is now always visible
                if (parenthesisMatch) {
                    let parenthesisContent = parenthesisMatch[1]; // e.g., 'ella'

                    if (parenthesisContent === 'formal') {
                        parenthesisContent = 'Usted / Ustedes';
                    }

                    formattedText += `<br><span class="text-xs italic text-gray-500" style="margin-top: 0.2rem;">${parenthesisContent}</span>`;
                }

                // HIDE: Pronunciation is now hidden until hover
                if (pronunciation) {
                    formattedText += `<br><span class="pronunciation-hint subject-translation-hidden">${pronunciation}</span>`;
                }
            }
            
            return formattedText;
        }

        // Define the list of keys for translation columns that MUST be skipped/merged
        const translationToMergeKeys = [
            "Trad. Pronombre",          // Skipped, merged into Pronoun cell
            "Ejemplo Pronombre (Akkusativ)",// Skipped, merged into Pronoun cell
            "Trad. Ejemplo",            // Skipped, merged into Pronoun cell
            "Trad. (M)", 
            "Trad. (F)", 
            "Trad. (N)", 
            "Trad. (P)", 
            "Männlich (M) - Ejemplos con Verbos",
            "Weiblich (F) - Ejemplos con Verbos",
            "Neutral (N) - Ejemplos con Verbos",
            "Plural (P) - Ejemplos con Verbos",
            "Trad. Base",
            // Removed Nom. Example keys from here, they are now only used in logic
        ];

        // Define the keys for the Akkusativ Determiners that need the new merged format
        const mergedDeterminerKeys = [
            { key: "den männlich (akkusativ)", example: "Männlich (M) - Ejemplos con Verbos", translation: "Trad. (M)", color: 'bg-red-200' },
            { key: "die weiblich (akkusativ)", example: "Weiblich (F) - Ejemplos con Verbos", translation: "Trad. (F)", color: 'bg-red-300' },
            { key: "das neutral (akkusativ)", example: "Neutral (N) - Ejemplos con Verbos", translation: "Trad. (N)", color: 'bg-red-400' },
            { key: "die plural (akkusativ)", example: "Plural (P) - Ejemplos con Verbos", translation: "Trad. (P)", color: 'bg-red-500' }
        ];

        // Define the keys for the Akkusativ Determiners that need bold styling
        const determinerKeys = [
            "den männlich (akkusativ)", 
            "die weiblich (akkusativ)", 
            "das neutral (akkusativ)", 
            "die plural (akkusativ)"
        ];

        // --- NEW: Global Toggle Function ---
        let translationsVisible = false;

        function toggleAllTranslations() {
            const studyWrappers = document.querySelectorAll('.subject-study-cell, .article-study-cell-wrapper, .merged-pronoun-cell > .w-full, .study-cell');
            const body = document.body;
            const button = document.getElementById('toggle-all-button');
            const table = document.getElementById('table-container');

            translationsVisible = !translationsVisible;
            
            // Toggle the class on the body to force all hidden elements open using the force-open CSS class
            if (translationsVisible) {
                table.classList.add('force-open');
                button.textContent = 'Ocultar todas las traducciones';
            } else {
                table.classList.remove('force-open');
                button.textContent = 'Mostrar todas las traducciones';
                // Also remove the 'active' class from individual cells to ensure consistency
                studyWrappers.forEach(wrapper => {
                    wrapper.classList.remove('active');
                });
            }
        }


        function renderTable() {
            const container = document.getElementById('table-container');

            // Start of table structure, no horizontal scrolling
            let html = '<table class="divide-y divide-gray-300">';

            // --- HEADER ROW 1: Grouping ---
            html += '<thead class="bg-gray-100">';
            html += '<tr>';
            // Column 1: Personal Pronoun Section (Span 4 columns) -> Now Span 2
            html += `<th colspan="2" class="table-cell text-xs font-semibold uppercase tracking-wider text-gray-700 border-r border-gray-300">Pronombres Personales</th>`;
            
            // Column 2: Base/Nominative Section (Span 1 column)
            html += `<th colspan="1" class="table-cell text-xs font-semibold uppercase tracking-wider text-gray-700 border-r border-gray-300 bg-red-100">Base/Posesivo</th>`;
            
            // Column 3: Akkusativ Case by Gender Section (Span 12 columns)
            html += `<th colspan="12" class="table-cell text-xs font-semibold uppercase tracking-wider text-gray-700 bg-red-100">Akkusativ Case Determiners (Artículos y Posesivos por Género)</th>`;
            html += '</tr>';

            // --- HEADER ROW 2: Sub-Grouping ---
            html += '<tr>';
            // Sub-grouping for Personal Pronouns (3 main columns) -> Now 1 for Sujeto, 1 for Merged Pronoun
            // SUJETO (NOM.) - Color más claro: #E0F2FE
            // PRON. (NOM.) - Reducido, sin punto y tamaño más pequeño
            html += `<th colspan="1" class="table-cell font-semibold tracking-wider text-gray-700 border-r border-gray-300" style="background-color: #E0F2FE;">
                        <span class="small-pronoun-header">PRON (NOM)</span>
                    </th>`;
            // NUEVA CELDA FUSIONADA PRON. (AKK.) - Color más oscuro: #CCE5FE
            // PRON. (AKK.) - Reducido, sin punto y tamaño más pequeño
            html += `<th colspan="1" class="table-cell font-semibold tracking-wider text-gray-700 border-r border-gray-300" style="background-color: #CCE5FE;">
                        <span class="small-pronoun-header">PRON (AKK)</span>
                    </th>`;

            // Sub-grouping for Base Form (1 column)
            html += `<th colspan="1" class="table-cell text-xs font-semibold tracking-wider text-gray-700 border-r border-gray-300 bg-red-200">Base/Posesivo</th>`;

            // Sub-grouping for Gendered Akkusativ (4 groups)
            const genders = [
                { title: 'Männlich (M)', color: 'bg-red-200', colspan: 1 }, 
                { title: 'Weiblich (F)', color: 'bg-red-300', colspan: 1 }, 
                { title: 'Neutral (N)', color: 'bg-red-400', colspan: 1 }, 
                { title: 'Plural (P)', color: 'bg-red-500', colspan: 1 }
            ];
            genders.forEach(gender => {
                html += `<th colspan="${gender.colspan}" class="table-cell text-xs font-semibold tracking-wider text-gray-900 ${gender.color}">${gender.title}</th>`;
            });
            html += '</tr>';

            // --- HEADER ROW 3: Column Labels ---
            const headers = [
                "Sujeto (Nominativo)", "Pronombre (Akkusativ)", "Trad. Pronombre", "Ejemplo Pronombre (Akkusativ)", "Trad. Ejemplo", 
                "Base", "Trad. Base", 
                "den männlich (akkusativ)", "Männlich (M) - Ejemplos con Verbos", "Trad. (M)", 
                "die weiblich (akkusativ)", "Weiblich (F) - Ejemplos con Verbos", "Trad. (F)", 
                "das neutral (akkusativ)", "Neutral (N) - Ejemplos con Verbos", "Trad. (N)", 
                "die plural (akkusativ)", "Plural (P) - Ejemplos con Verbos", "Trad. (P)" 
            ];
            
            const visibleHeaders = [
                "Pron. (Nom.)",
                "Pron. (Akk.)", // Updated header title
                "Base/Posesivo",
                "den", // Simplified header
                "die", // Simplified header
                "das", // Simplified header
                "die"  // Simplified header
            ];

            // Only includes the keys that should NOT be rendered as separate columns in the body
            const keysToSkip = [
                "Trad. Pronombre", "Ejemplo Pronombre (Akkusativ)", "Trad. Ejemplo", 
                "Trad. (M)", 
                "Trad. (F)", 
                "Trad. (N)", 
                "Trad. (P)", 
                "Männlich (M) - Ejemplos con Verbos",
                "Weiblich (F) - Ejemplos con Verbos",
                "Neutral (N) - Ejemplos con Verbos",
                "Plural (P) - Ejemplos con Verbos",
                "Trad. Base",
                // Removed Nom. Example keys from here, they are now only used in logic
            ];


            html += '<tr>';
            let visibleHeaderIndex = 0;
            
            // Only render the necessary 7 columns in the third header row
            const fullHeadersForRender = [
                "Sujeto (Nominativo)", 
                "Pronombre (Akkusativ)", // Will be the trigger for the merged pronoun column
                "Base", 
                "den männlich (akkusativ)", 
                "die weiblich (akkusativ)", 
                "das neutral (akkusativ)", 
                "die plural (akkusativ)"
            ];

            fullHeadersForRender.forEach((header, index) => {
                let cellClass = 'bg-gray-50 text-gray-700 font-medium text-xs border-b-2 border-gray-200';
                
                // Set background for header row 3
                if (header === "Sujeto (Nominativo)") cellClass = 'text-gray-700 font-bold text-sm';
                if (header === "Pronombre (Akkusativ)") cellClass = 'text-gray-700 font-bold text-sm';
                
                // Apply custom colors for Pronoun section headers (Row 3 labels)
                if (header === "Sujeto (Nominativo)") cellClass += ' style="background-color: #E0F2FE;"'; // Lighter Blue for Nom
                if (header === "Pronombre (Akkusativ)") cellClass += ' style="background-color: #CCE5FE;"'; // Darker Blue for Akk
                if (header === "Base") cellClass = 'bg-red-200 text-gray-700 font-bold text-sm';

                // Gendered Akkusativ Headers
                if (header === "den männlich (akkusativ)") cellClass = 'bg-red-200 text-gray-900 font-bold text-sm wrap-cell';
                if (header === "die weiblich (akkusativ)") cellClass = 'bg-red-300 text-gray-900 font-bold text-sm wrap-cell'; 
                if (header === "das neutral (akkusativ)") cellClass = 'bg-red-400 text-gray-900 font-bold text-sm wrap-cell'; 
                if (header === "die plural (akkusativ)") cellClass = 'bg-red-500 text-gray-900 font-bold text-sm wrap-cell'; 


                const displayTitle = visibleHeaders[index];

                // Remove <br> from simplified headers
                const finalTitle = displayTitle.replace('<br>Ejemplo', '').replace('<br>', ' '); 

                html += `<th class="table-cell ${cellClass} text-left uppercase">${finalTitle}</th>`; 
                visibleHeaderIndex++;
            });
            html += '</tr>';
            html += '</thead>';

            // --- BODY ---
            html += '<tbody class="divide-y divide-gray-200">';
            tableData.forEach((row, rowIndex) => {
                // Determine if this is the "es" row to adjust the Subject column
                if (row["Sujeto (Nominativo)"] === "es") {
                    row["Sujeto (Nominativo)"] = "es (neutro)";
                }
                // Determine if this is the "Sie (formal)" row to adjust the Subject column
                if (row["Sujeto (Nominativo)"] === "Sie (formal)") {
                    row["Sujeto (Nominativo)"] = "Sie (formal)"; // No change needed here, just confirming structure
                }

                const isArticleRow = row["Sujeto (Nominativo)"].startsWith('Art.');
                const rowClass = isArticleRow ? 'article-row' : 'possessive-row';
                html += `<tr class="${rowClass} hover:bg-opacity-75">`;
                
                
                headers.forEach((key, colIndex) => {
                    const value = row[key];

                    // 1. Skip rendering the translation/example columns that are now merged elsewhere.
                    if (keysToSkip.includes(key)) {
                        return; 
                    }

                    let cellClass = 'table-cell text-sm text-gray-800 text-left';
                    let contentHtml = value;
                    let styleAttr = ''; // For direct style injection

                    // --- SPECIAL CASE: MERGED PRONOUN COLUMN (Pronoun, Trad, Example, Trad Example) ---
                    if (key === "Pronombre (Akkusativ)") {
                        const subject = row["Sujeto (Nominativo)"];
                        const pronoun = row["Pronombre (Akkusativ)"];
                        let tradPronoun = row["Trad. Pronombre"]; // Use let for modification
                        const example = row["Ejemplo Pronombre (Akkusativ)"];
                        const tradExample = row["Trad. Ejemplo"];
                        
                        // CORRECTION: Since we moved (formal) and (neutro) to the subject,
                        // we must ensure the Spanish translation text does not contain them here.
                        tradPronoun = tradPronoun.replace(' (formal)', '').replace(' (neutro)', '');


                        // NOTE: This cell uses the DARKER color #CCE5FE
                        cellClass += ' merged-pronoun-cell wrap-cell align-top cursor-pointer';

                        // Skip the merging if it's an Article row (where pronoun is '-')
                        if (pronoun === '-') {
                             contentHtml = '-';
                             cellClass = 'table-cell text-sm text-gray-800 text-left bg-gray-200'; // Neutral cell style
                        } else {
                            // Identify the Akkusativ pronoun to bold in the example phrase
                            const exampleTextToBold = pronoun; 
                            
                            // Bold the pronoun inside the example phrase
                            let styledExample = example.replace(new RegExp(`\\b(${exampleTextToBold})\\b`), (match) => {
                                return `<b>${match}</b>`;
                            });

                            contentHtml = `
                                <div class="w-full" onclick="this.classList.toggle('active')">
                                    <!-- Visible Part: German Pronoun -->
                                    <div class="stacked-content-line">
                                        <span class="akkusativ-pronoun-visible">${pronoun}</span>
                                    </div>
                                    <div class="stacked-content-line text-xs italic text-gray-500" style="margin-top: 0.2rem;">
                                        ${tradPronoun}
                                    </div>

                                    <!-- Hidden Part: Example Phrase and Translation -->
                                    <div class="pronoun-hidden-part">
                                        <div class="text-gray-700" style="white-space: nowrap;">${styledExample}</div>
                                        <div class="text-gray-500 italic">${tradExample}</div>
                                    </div>
                                </div>
                            `;
                        }
                        // Apply background color to the cell body using direct style
                        styleAttr = ' style="background-color: #CCE5FE;"';

                    }
                    // --- SPECIAL CASE: MERGED GENDER COLUMNS (Determiner + Example) ---
                    else if (determinerKeys.includes(key)) {
                        const mergedData = mergedDeterminerKeys.find(data => data.key === key);
                        
                        const determiner = row[mergedData.key];
                        
                        // --- CORRECTED MAPPING LOGIC ---
                        // Use the fixed keys from the CSV for every row, as they contain the necessary data.
                        const exampleKey = mergedData.example;
                        const translationKey = mergedData.translation;
                        
                        const exampleValue = row[exampleKey];
                        const tradExampleValue = row[translationKey];
                        // --- END CORRECTED MAPPING LOGIC ---

                        // Identify the determinant that should be bolded inside the example
                        const exampleTextToBold = determiner; 
                        
                        // Bold the determinant inside the example phrase
                        let styledExampleValue = exampleValue.replace(new RegExp(`\\b(${exampleTextToBold})\\b`), (match) => {
                            return `<b>${match}</b>`;
                        });
                        
                        cellClass += ` merged-gender-cell wrap-cell align-top ${mergedData.color}`;

                        if (exampleValue && exampleValue !== '-' && tradExampleValue && tradExampleValue !== '-') {
                            // Ensure the Akkusativ Determiner is visible and separate from the interactive study cell
                            contentHtml = `
                                <span class="akkusativ-determiner">${determiner}</span>
                                <div class="study-cell cursor-pointer p-0 pt-1" onclick="this.classList.toggle('active')">
                                    <span class="german-phrase whitespace-nowrap">${styledExampleValue}</span>
                                    <span class="spanish-translation">${tradExampleValue}</span>
                                </div>
                            `;
                        } else {
                            // Display only the determiner if example is missing (Art. Indef. plural)
                            contentHtml = `<span class="akkusativ-determiner">${determiner}</span>${exampleValue ? '<br>' + exampleValue : ''}`;
                        }
                    } 
                    // --- SPECIAL CASE: MERGED BASE / TRANSLATION COLUMN ---
                    else if (key === "Base") {
                        const baseValue = formatMultiLine(row["Base"], false); 
                        
                        const germanLines = baseValue.split('<br>');
                        
                        let alignedHtml = '';
                        
                        if (isArticleRow) {
                            // ARTICLES: INTERACTIVE SINGLE REVEAL
                            const tradBaseValue = formatMultiLine(row["Trad. Base"], true); 
                            const spanishLines = tradBaseValue.split('<br>');

                            cellClass += ' article-study-cell-wrapper wrap-cell align-top';
                            
                            let germanDisplay = '';

                            for (let i = 0; i < germanLines.length; i++) {
                                const germanText = germanLines[i].trim();
                                const spanishText = (spanishLines[i] || '').trim();

                                if (germanText) {
                                    const isNom = germanText === '(Nom.)';
                                    
                                    const germanSpan = isNom 
                                        ? `<span class="text-gray-800 font-medium">${germanText}</span>`
                                        : `<span class="base-article-german">${germanText}</span>`; 
                                    
                                    const hiddenPart = spanishText 
                                        ? `<span class="article-hidden-part">→ ${spanishText}</span>` 
                                        : '';
                                        
                                    germanDisplay += `<div class="stacked-content-line">${germanSpan}${hiddenPart}</div>`;
                                }
                            }
                            
                            contentHtml = `<div class="w-full" onclick="this.classList.toggle('active')">${germanDisplay}</div>`;
                            
                        } else {
                            // POSSESSIVES: SIMPLE DISPLAY (BASE + TRANSLATION)
                            const possessiveRoot = germanLines[0]; // e.g., mein-
                            const tradBaseValue = formatMultiLine(row["Trad. Base"], true);
                            const spanishTranslation = tradBaseValue.split('<br>')[0].trim();

                            // Simple content structure: German base + Spanish translation
                            alignedHtml = `
                                <div class="stacked-content-line">
                                    <span class="base-article-german">${possessiveRoot}</span>
                                </div>
                                <div class="stacked-content-line text-xs italic text-gray-500" style="margin-top: 0.2rem;">
                                    ${spanishTranslation}
                                </div>
                            `;

                            contentHtml = alignedHtml;
                        }
                        
                        cellClass += ' merged-possessive-cell bg-red-100'; 
                    }
                    // --- DEFAULT CELL RENDERING ---
                    else {
                        // Sujeto (Nominativo)
                        if (key === "Sujeto (Nominativo)") {
                            contentHtml = `<div class="w-full subject-study-cell" onclick="this.classList.toggle('active')">${formatSubjectColumn(value)}</div>`;
                            cellClass += ' wrap-cell align-top p-0';
                            // This uses the LIGHTER color #E0F2FE as required for Sujeto (Nom.)
                            styleAttr = ' style="background-color: #E0F2FE;"'; 
                        }
                    }
                    
                    html += `<td class="${cellClass}"${styleAttr}>${contentHtml}</td>`;
                });
                html += '</tr>';
            });
            html += '</tbody>';
            html += '</table>';

            container.innerHTML = html;
        }

        window.onload = renderTable;
    </script>
</body>
