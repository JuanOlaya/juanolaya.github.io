        function cycleBeispielMode() {
            if (currentMode === 'statement') {
                currentMode = 'question';
            } else if (currentMode === 'question') {
                currentMode = 'telc_a1';
            } else {
                currentMode = 'statement';
            }
            
            const tag = document.getElementById('beispiel-mode-tag');
            if (currentMode === 'statement') {
                tag.textContent = 'Aussage';
            } else if (currentMode === 'question') {
                tag.textContent = 'Frage';
            } else {
                tag.textContent = 'Telc A1';
            }
            renderPronouns();
        }

            pronounsContainer.innerHTML = '';

                const row = document.createElement('div');
                const isOdd = index % 2 === 0;
                const bgClass = isOdd ? 'bg-white' : 'bg-slate-50/50';

                    subject = subject.replace(' (formal)', '');
                    subject = `${subject}<span class="text-sm font-normal opacity-70 ml-1">(formal)</span>`;
                }
                const hint = item["Sujeto (Nominativo)"].includes('ella') ? 'ella' :
                    item["Sujeto (Nominativo)"].includes('ellos') ? 'ellos' :
                    item["Sujeto (Nominativo)"].includes('vosotros') ? 'vosotros' :
                    item["Sujeto (Nominativo)"].includes('formal') ? 'usted' :
                    item["Sujeto (Nominativo)"].includes('neutro') ? 'neutro' : '';

                const mascPossessive = item["den männlich (akkusativ)"];
                const mascClass = mascPossessive ? 'morph-highlight text-lg md:text-xl' : 'font-extrabold text-lg md:text-xl';

                const key = item["Sujeto (Nominativo)"];
                const modeData = contentMap[key] ? contentMap[key][currentMode] : null;
                const mainContent = modeData || { PRO: item.Example, POSS: item.PossessiveExample };

                row.innerHTML = `
                    <!-- Subject -->
                    <div class="px-1 py-1.5 border-r flex flex-col justify-center items-center">
                        <span class="font-extrabold text-slate-800 text-xl md:text-2xl">${subject}</span>
                        ${hint ? `<span class="text-[9px] text-slate-500 font-normal mt-0.5">${hint}</span>` : ''}
                    </div>

                    <!-- Pronoun Accusative -->
                    <div class="px-1 py-1.5 border-r bg-indigo-50/70 flex flex-col justify-center items-center relative overflow-hidden">
                        <span class="font-extrabold text-black text-xl md:text-2xl">${item["Pronombre (Akkusativ)"]}</span>
                        <span class="text-sm md:text-base text-slate-600 font-bold italic mt-0.5">${item["Trad. Pronombre"]}</span>
                    </div>

                    <!-- Example Sentence -->
                    <div class="px-1 py-1.5 border-r bg-slate-50/40 flex flex-col justify-center items-center text-center">
                        <span class="font-semibold text-slate-800 text-sm md:text-base leading-snug">${mainContent.PRO}</span>
                        <span class="text-xs leading-snug text-slate-500 font-medium italic mt-0.5">${mainContent.PRO_TR || ''}</span>
                    </div>

                    <!-- Possessives - Masculine -->
                    <div class="px-1 py-1.5 border-r col-masc flex flex-col justify-center items-center relative overflow-hidden">
                        <div class="${mascClass} relative z-10">${mascPossessive}</div>
                    </div>

                    <!-- Possessives - Feminine -->
                    <div class="px-1 py-1.5 border-r col-fem flex flex-col justify-center items-center">
                        <div class="flex flex-col items-center justify-center">
                            <span class="font-extrabold text-base md:text-lg">${item["die weiblich (akkusativ)"]}</span>
                            <span class="text-xs md:text-sm text-slate-600 font-bold italic mt-0.5">${item["poss_trans"]}</span>
                        </div>
                    </div>

                    <!-- Possessives - Neutral -->
                    <div class="px-1 py-1.5 border-r col-neu flex flex-col justify-center items-center font-extrabold text-base md:text-lg">
                        ${item["das neutral (akkusativ)"]}
                    </div>

                    <!-- Possessives - Plural -->
                    <div class="px-1 py-1.5 col-plu border-r flex flex-col justify-center items-center font-extrabold text-base md:text-lg">
                        ${item["die plural (akkusativ)"]}
                    </div>

                    <!-- New Column: Possessive Examples -->
                    <div class="px-1 py-1.5 bg-yellow-50/50 flex flex-col justify-center items-center text-center">
                        <span class="font-bold text-slate-700 text-sm md:text-base leading-snug">${mainContent.POSS}</span>
                        <span class="text-xs leading-snug text-slate-500 font-medium italic mt-0.5">${mainContent.POSS_TR || ''}</span>
                    </div>
                `;
                pronounsContainer.appendChild(row);
            });
        }

        renderPronouns();
    </script>
</body>

</html>
