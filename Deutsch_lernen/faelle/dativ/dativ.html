                "dem männlich (dativ)": "ihrem",
                "Männlich (M) - Ejemplos con Verbos": "Sie helfen ihrem Lehrer.",
                "Trad. (M)": "Ellos ayudan a su profesor.",
                "der weiblich (dativ)": "ihrer",
                "Weiblich (F) - Ejemplos con Verbos": "Sie danken ihrer Lehrerin.",
                "Trad. (F)": "Ellos agradecen a su profesora.",
                "dem neutral (dativ)": "ihrem",
                "Neutral (N) - Ejemplos con Verbos": "Sie geben ihrem Kind Milch.",
                "Trad. (N)": "Ellos le dan leche a su niño.",
                "den plural (dativ)": "ihren",
                "Plural (P) - Ejemplos con Verbos": "Sie helfen ihren Eltern.",
                "Trad. (P)": "Ellos ayudan a sus padres.",
                "Nom. Example": "Ihr Tee",
                "Trad. Nom. Example": "Su té"
            },
            {
                "Sujeto (Nominativo)": "Sie (formal)",
                "Pronombre (Dativ)": "Ihnen",
                "Trad. Pronombre": "a usted/es",
                "Ejemplo Pronombre (Dativ)": "Ich helfe Ihnen.",
                "Trad. Ejemplo": "Le ayudo a usted.",
                "Base": "Ihr-",
                "Trad. Base": "a su (formal)-",
                "dem männlich (dativ)": "Ihrem",
                "Männlich (M) - Ejemplos con Verbos": "Sie danken Ihrem Chef.",
                "Trad. (M)": "Usted agradece a su jefe.",
                "der weiblich (dativ)": "Ihrer",
                "Weiblich (F) - Ejemplos con Verbos": "Sie helfen Ihrer Kollegin.",
                "Trad. (F)": "Usted ayuda a su colega.",
                "dem neutral (dativ)": "Ihrem",
                "Neutral (N) - Ejemplos con Verbos": "Sie geben Ihrem Kind Geld.",
                "Trad. (N)": "Usted le da dinero a su niño.",
                "den plural (dativ)": "Ihren",
                "Plural (P) - Ejemplos con Verbos": "Sie helfen Ihren Mitarbeitern.",
                "Trad. (P)": "Usted ayuda a sus empleados.",
                "Nom. Example": "Ihr Anzug",
                "Trad. Nom. Example": "Su traje"
            }
        ];

        const pronunciationMap = {
            "ich": "/ij/",
            "du": "/du/",
            "er": "/ea/",
            "sie (ella)": "/si/",
            "es (neutro)": "/es/",
            "wir": "/via/",
            "ihr (vosotros)": "/ia/",
            "sie (ellos)": "/si/",
            "Sie (formal)": "/si/"
        };

        const spanishTranslationMap = { "ich": "yo", "du": "tú", "er": "él", "wir": "nosotros/as" };

        function formatMultiLine(text, isTranslationBase) {
            if (typeof text !== 'string') return text;
            let newText = text.replace(/ \/ /g, '<br>');
            if (!isTranslationBase) { newText = newText.replace(/\(Nominativ\)/g, '<br>(Nom.)'); }
            else { newText = newText.replace(/\(Nominativ\)/g, '').replace(/-\s*$/, ''); }
            return newText;
        }

        function formatSubjectColumn(text) {
            if (typeof text !== 'string') return text;
            const parenthesisMatch = text.match(/ \((ella|vosotros|ellos|formal|neutro)\)/);
            const baseText = text.replace(parenthesisMatch ? parenthesisMatch[0] : '', '').trim();
            const pronunciation = pronunciationMap[text] || '';
            const simpleSpanishTranslation = spanishTranslationMap[baseText] || '';
            let formattedText = '';
            if (spanishTranslationMap[baseText]) {
                formattedText += `<span class="akkusativ-pronoun-visible">${baseText}</span>`;
                if (simpleSpanishTranslation) {
                    formattedText += `<br><span class="text-xs italic text-gray-500" style="margin-top: 0.2rem;">${simpleSpanishTranslation}</span>`;
                }
                if (pronunciation) {
                    formattedText += `<br><span class="pronunciation-hint subject-translation-hidden">${pronunciation}</span>`;
                }
            } else {
                formattedText += `<span class="akkusativ-pronoun-visible">${baseText}</span>`;
                if (parenthesisMatch) {
                    let parenthesisContent = parenthesisMatch[1];
                    if (parenthesisContent === 'formal') { parenthesisContent = 'Usted / Ustedes'; }
                    formattedText += `<br><span class="text-xs italic text-gray-500" style="margin-top: 0.2rem;">${parenthesisContent}</span>`;
                }
                if (pronunciation) {
                    formattedText += `<br><span class="pronunciation-hint subject-translation-hidden">${pronunciation}</span>`;
                }
            }
            return formattedText;
        }

        const translationToMergeKeys = [
            "Trad. Pronombre", "Ejemplo Pronombre (Dativ)", "Trad. Ejemplo", "Trad. (M)", "Trad. (F)", "Trad. (N)", "Trad. (P)",
            "Männlich (M) - Ejemplos con Verbos", "Weiblich (F) - Ejemplos con Verbos", "Neutral (N) - Ejemplos con Verbos", "Plural (P) - Ejemplos con Verbos", "Trad. Base"
        ];

        const mergedDeterminerKeys = [
            { key: "dem männlich (dativ)", example: "Männlich (M) - Ejemplos con Verbos", translation: "Trad. (M)", color: 'bg-green-200' },
            { key: "der weiblich (dativ)", example: "Weiblich (F) - Ejemplos con Verbos", translation: "Trad. (F)", color: 'bg-green-300' },
            { key: "dem neutral (dativ)", example: "Neutral (N) - Ejemplos con Verbos", translation: "Trad. (N)", color: 'bg-green-400' },
            { key: "den plural (dativ)", example: "Plural (P) - Ejemplos con Verbos", translation: "Trad. (P)", color: 'bg-green-500' }
        ];

        const determinerKeys = ["dem männlich (dativ)", "der weiblich (dativ)", "dem neutral (dativ)", "den plural (dativ)"];

        let translationsVisible = false;
        function toggleAllTranslations() {
            const studyWrappers = document.querySelectorAll('.subject-study-cell, .article-study-cell-wrapper, .merged-pronoun-cell > .w-full, .study-cell');
            const button = document.getElementById('toggle-all-button');
            const table = document.getElementById('table-container');
            translationsVisible = !translationsVisible;
            if (translationsVisible) { table.classList.add('force-open'); button.textContent = 'Ocultar todas las traducciones'; }
            else { table.classList.remove('force-open'); button.textContent = 'Mostrar todas las traducciones'; studyWrappers.forEach(w => w.classList.remove('active')); }
        }

        function renderTable() {
            const container = document.getElementById('table-container');
            let html = '<table class="divide-y divide-gray-300">';
            html += '<thead class="bg-gray-100">';
            html += '<tr>';
            html += `<th colspan="2" class="table-cell text-xs font-semibold uppercase tracking-wider text-gray-700 border-r border-gray-300">Pronombres Personales</th>`;
            html += `<th colspan="1" class="table-cell text-xs font-semibold uppercase tracking-wider text-gray-700 border-r border-gray-300 bg-green-100">Base/Posesivo</th>`;
            html += `<th colspan="12" class="table-cell text-xs font-semibold uppercase tracking-wider text-gray-700 bg-green-100">Dativ Case Determiners (Artículos y Posesivos por Género)</th>`;
            html += '</tr>';
            html += '<tr>';
            html += `<th colspan="1" class="table-cell font-semibold tracking-wider text-gray-700 border-r border-gray-300" style="background-color: #E0F2FE;"><span class="small-pronoun-header">PRON (NOM)</span></th>`;
            html += `<th colspan="1" class="table-cell font-semibold tracking-wider text-gray-700 border-r border-gray-300" style="background-color: #CCE5FE;"><span class="small-pronoun-header">PRON (DAT)</span></th>`;
            html += `<th colspan="1" class="table-cell text-xs font-semibold tracking-wider text-gray-700 border-r border-gray-300 bg-green-200">Base/Posesivo</th>`;
            const genders = [
                { title: 'Männlich (M)', color: 'bg-green-200', colspan: 1 },
                { title: 'Weiblich (F)', color: 'bg-green-300', colspan: 1 },
                { title: 'Neutral (N)', color: 'bg-green-400', colspan: 1 },
                { title: 'Plural (P)', color: 'bg-green-500', colspan: 1 }
            ];
            genders.forEach(g => { html += `<th colspan="${g.colspan}" class="table-cell text-xs font-semibold tracking-wider text-gray-900 ${g.color}">${g.title}</th>`; });
            html += '</tr>';
            const fullHeadersForRender = ["Sujeto (Nominativo)", "Pronombre (Dativ)", "Base", "dem männlich (dativ)", "der weiblich (dativ)", "dem neutral (dativ)", "den plural (dativ)"];
            const visibleHeaders = ["Pron. (Nom.)","Pron. (Dat.)","Base/Posesivo","dem","der","dem","den"];
            html += '<tr>';
            fullHeadersForRender.forEach((header, index) => {
                let cellClass = 'bg-gray-50 text-gray-700 font-medium text-xs border-b-2 border-gray-200';
                if (header === "Sujeto (Nominativo)") cellClass = 'text-gray-700 font-bold text-sm';
                if (header === "Pronombre (Dativ)") cellClass = 'text-gray-700 font-bold text-sm';
                if (header === "Sujeto (Nominativo)") cellClass += ' style="background-color: #E0F2FE;"';
                if (header === "Pronombre (Dativ)") cellClass += ' style="background-color: #CCE5FE;"';
                if (header === "Base") cellClass = 'bg-green-200 text-gray-700 font-bold text-sm';
                if (header === "dem männlich (dativ)") cellClass = 'bg-green-200 text-gray-900 font-bold text-sm wrap-cell';
                if (header === "der weiblich (dativ)") cellClass = 'bg-green-300 text-gray-900 font-bold text-sm wrap-cell';
                if (header === "dem neutral (dativ)") cellClass = 'bg-green-400 text-gray-900 font-bold text-sm wrap-cell';
                if (header === "den plural (dativ)") cellClass = 'bg-green-500 text-gray-900 font-bold text-sm wrap-cell';
                const finalTitle = visibleHeaders[index];
                html += `<th class="table-cell ${cellClass} text-left uppercase">${finalTitle}</th>`;
            });
            html += '</tr>';
            html += '</thead>';

            const keysToSkip = ["Trad. Pronombre", "Ejemplo Pronombre (Dativ)", "Trad. Ejemplo", "Trad. (M)", "Trad. (F)", "Trad. (N)", "Trad. (P)", "Männlich (M) - Ejemplos con Verbos", "Weiblich (F) - Ejemplos con Verbos", "Neutral (N) - Ejemplos con Verbos", "Plural (P) - Ejemplos con Verbos", "Trad. Base", "Category (M)", "Category (F)", "Category (N)", "Category (P)", "Explanation (M)", "Explanation (F)", "Explanation (N)", "Explanation (P)"];

            html += '<tbody class="divide-y divide-gray-200">';
            tableData.forEach((row) => {
                if (row["Sujeto (Nominativo)"] === "es") { row["Sujeto (Nominativo)"] = "es (neutro)"; }
                const isArticleRow = row["Sujeto (Nominativo)"].startsWith('Art.') ||
                                     row["Sujeto (Nominativo)"].startsWith('Articulo') ||
                                     row["Sujeto (Nominativo)"] === "Nullartikel";
                const rowClass = isArticleRow ? 'article-row' : 'possessive-row';
                html += `<tr class="${rowClass} hover:bg-opacity-75">`;
                const headers = [
                    "Sujeto (Nominativo)", "Pronombre (Dativ)", "Trad. Pronombre", "Ejemplo Pronombre (Dativ)", "Trad. Ejemplo", "Base", "Trad. Base", "dem männlich (dativ)", "Männlich (M) - Ejemplos con Verbos", "Trad. (M)", "der weiblich (dativ)", "Weiblich (F) - Ejemplos con Verbos", "Trad. (F)", "dem neutral (dativ)", "Neutral (N) - Ejemplos con Verbos", "Trad. (N)", "den plural (dativ)", "Plural (P) - Ejemplos con Verbos", "Trad. (P)"
                ];
                headers.forEach((key) => {
                    const value = row[key];
                    if (keysToSkip.includes(key)) return;
                    let cellClass = 'table-cell text-sm text-gray-800 text-left';
                    let contentHtml = value;
                    let styleAttr = '';

                    if (key === "Pronombre (Dativ)") {
                        const pronoun = row["Pronombre (Dativ)"];
                        let tradPronoun = row["Trad. Pronombre"];
                        const example = row["Ejemplo Pronombre (Dativ)"];
                        const tradExample = row["Trad. Ejemplo"];
                        tradPronoun = tradPronoun.replace(' (formal)', '').replace(' (neutro)', '');
                        cellClass += ' merged-pronoun-cell wrap-cell align-top cursor-pointer';
                        if (pronoun === '-') { contentHtml = '-'; cellClass = 'table-cell text-sm text-gray-800 text-left bg-gray-200'; }
                        else if (pronoun.startsWith('Nota:')) {
                            contentHtml = `<div class="text-xs italic text-gray-600 p-2" style="white-space: normal; line-height: 1.4;">${pronoun}</div>`;
                            cellClass = 'table-cell text-sm text-gray-800 text-left bg-yellow-50';
                        }
                        else {
                            const exampleTextToBold = pronoun;
                            let styledExample = example.replace(new RegExp(`\\b(${exampleTextToBold})\\b`), (m) => `<b>${m}</b>`);
                            contentHtml = `
                                <div class="w-full" onclick="this.classList.toggle('active')">
                                    <div class="stacked-content-line"><span class="akkusativ-pronoun-visible">${pronoun}</span></div>
                                    <div class="stacked-content-line text-xs italic text-gray-500" style="margin-top: 0.2rem;">${tradPronoun}</div>
                                    <div class="pronoun-hidden-part">
                                        <div class="text-gray-700" style="white-space: nowrap;">${styledExample}</div>
                                        <div class="text-gray-500 italic">${tradExample}</div>
                                    </div>
                                </div>`;
                        }
                        styleAttr = ' style="background-color: #CCE5FE;"';
                    }
                    else if (determinerKeys.includes(key)) {
                        const mergedData = mergedDeterminerKeys.find(d => d.key === key);
                        const determiner = row[mergedData.key];
                        const exampleValue = row[mergedData.example];
                        const tradExampleValue = row[mergedData.translation];
                        const genderSuffix = key.includes('männlich') ? '(M)' : key.includes('weiblich') ? '(F)' : key.includes('neutral') ? '(N)' : '(P)';
                        const categoryValue = row[`Category ${genderSuffix}`] || '';
                        const explanationValue = row[`Explanation ${genderSuffix}`] || '';
                        const exampleTextToBold = determiner;
                        let styledExampleValue = exampleValue.replace(new RegExp(`\\b(${exampleTextToBold})\\b`), (m) => `<b>${m}</b>`);
                        cellClass += ` merged-gender-cell wrap-cell align-top ${mergedData.color}`;

                        const isNullartikel = row["Sujeto (Nominativo)"] === "Nullartikel";

                        if (exampleValue && exampleValue !== '-' && tradExampleValue && tradExampleValue !== '-') {
                            if (isNullartikel && categoryValue) {
                                contentHtml = `
                                    <span class="akkusativ-determiner">${determiner}</span>
                                    <div class="study-cell cursor-pointer p-0 pt-1" onclick="openModal('${exampleValue.replace(/'/g, "\\'")}', '${tradExampleValue.replace(/'/g, "\\'")}', '${categoryValue.replace(/'/g, "\\'")}', '${explanationValue.replace(/'/g, "\\'")}')" style="cursor: pointer;">
                                        <span class="german-phrase whitespace-nowrap">${styledExampleValue}</span>
                                        <span class="spanish-translation">${tradExampleValue}<br><span class="category-tag">${categoryValue}</span></span>
                                    </div>`;
                            } else {
                                contentHtml = `
                                    <span class="akkusativ-determiner">${determiner}</span>
                                    <div class="study-cell cursor-pointer p-0 pt-1" onclick="this.classList.toggle('active')">
                                        <span class="german-phrase whitespace-nowrap">${styledExampleValue}</span>
                                        <span class="spanish-translation">${tradExampleValue}</span>
                                    </div>`;
                            }
                        } else {
                            contentHtml = `<span class="akkusativ-determiner">${determiner}</span>${exampleValue ? '<br>' + exampleValue : ''}`;
                        }
                    }
                    else if (key === "Base") {
                        const baseValue = formatMultiLine(row["Base"], false);
                        const germanLines = baseValue.split('<br>');
                        let alignedHtml = '';
                        const isArticleRow = row["Sujeto (Nominativo)"].startsWith('Art.') || row["Sujeto (Nominativo)"].startsWith('Articulo') || row["Sujeto (Nominativo)"] === 'Nullartikel';
                        if (isArticleRow) {
                            const tradBaseValue = formatMultiLine(row["Trad. Base"], true);
                            const spanishLines = tradBaseValue.split('<br>');
                            cellClass += ' article-study-cell-wrapper wrap-cell align-top';
                            let germanDisplay = '';
                            for (let i = 0; i < germanLines.length; i++) {
                                const germanText = germanLines[i].trim();
                                const spanishText = (spanishLines[i] || '').trim();
                                if (germanText) {
                                    const isNom = germanText === '(Nom.)';
                                    const germanSpan = isNom ? `<span class="text-gray-800 font-medium">${germanText}</span>` : `<span class="base-article-german">${germanText}</span>`;
                                    const hiddenPart = spanishText ? `<span class="article-hidden-part">→ ${spanishText}</span>` : '';
                                    germanDisplay += `<div class="stacked-content-line">${germanSpan}${hiddenPart}</div>`;
                                }
                            }
                            contentHtml = `<div class="w-full" onclick=\"this.classList.toggle('active')\">${germanDisplay}</div>`;
                            cellClass += ' merged-possessive-cell bg-green-50';
                        } else {
                            const possessiveRoot = germanLines[0];
                            const tradBaseValue = formatMultiLine(row["Trad. Base"], true);
                            const spanishTranslation = tradBaseValue.split('<br>')[0].trim();
                            alignedHtml = `
                                <div class="stacked-content-line"><span class="base-article-german">${possessiveRoot}</span></div>
                                <div class="stacked-content-line text-xs italic text-gray-500" style="margin-top: 0.2rem;">${spanishTranslation}</div>`;
                            contentHtml = alignedHtml;
                            cellClass += ' merged-possessive-cell bg-green-100';
                        }
                    }
                    else {
                        if (key === "Sujeto (Nominativo)") {
                            let formattedValue = value;
                            // Format article rows with line breaks
                            if (value.includes(' / ') && (value.startsWith('Articulo') || value.startsWith('Art.'))) {
                                formattedValue = value.replace(' / ', '<br>');
                            }
                            if (value.startsWith('Articulo') || value.startsWith('Art.') || value === 'Nullartikel') {
                                contentHtml = `<div class="w-full subject-study-cell">${formattedValue}</div>`;
                            } else {
                                contentHtml = `<div class="w-full subject-study-cell" onclick="this.classList.toggle('active')">${formatSubjectColumn(formattedValue)}</div>`;
                            }
                            cellClass += ' wrap-cell align-top p-0';
                            styleAttr = ' style="background-color: #E0F2FE;"';
                        }
                    }
                    html += `<td class="${cellClass}"${styleAttr}>${contentHtml}</td>`;
                });
                html += '</tr>';
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function openModal(german, spanish, category, explanation) {
            const modal = document.getElementById('nullartikel-modal');
            const modalBody = document.getElementById('modal-body');

            modalBody.innerHTML = `
                <h2 class="modal-title">Nullartikel - Ejemplo Detallado</h2>

                <div class="modal-section">
                    <div class="modal-label">Alemán (Sin Artículo)</div>
                    <div class="modal-text" style="font-weight: 600; color: #1e40af;">${german}</div>
                </div>

                <div class="modal-section">
                    <div class="modal-label">Español (Traducción Directa)</div>
                    <div class="modal-text">${spanish}</div>
                </div>

                <div class="modal-section">
                    <div class="modal-label">Categoría</div>
                    <div class="modal-text"><span class="category-tag" style="font-size: 0.875rem; padding: 0.375rem 0.75rem;">${category}</span></div>
                </div>

                <div class="modal-section">
                    <div class="modal-label">Explicación</div>
                    <div class="modal-text">${explanation}</div>
                </div>
            `;

            modal.classList.add('active');
        }

        function closeModal(event) {
            if (!event || event.target.classList.contains('modal-overlay') || event.target.classList.contains('modal-close')) {
                document.getElementById('nullartikel-modal').classList.remove('active');
            }
        }

        // Close modal with Escape key
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeModal();
            }
        });

        window.onload = renderTable;
    </script>
</body>
</html>
