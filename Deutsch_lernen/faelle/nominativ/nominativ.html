<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>German Nominativ Case Table — A1–A2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f7f7f7; }
        #table-container { max-width: calc(100vw - 4rem); overflow-x: hidden; }
        table { width: 100%; table-layout: auto; }
        td, th { overflow: visible; }
        .table-cell { padding: 0.25rem 0.3rem; white-space: nowrap; vertical-align: top; font-size: 0.8rem; }
        .wrap-cell { white-space: normal; }
        .study-cell { position: relative; display: flex; flex-direction: column; align-items: flex-start; cursor: pointer; padding: 0.3rem 0.3rem; min-height: 3.5rem; justify-content: center; }
        .merged-gender-cell { padding: 0.25rem 0.3rem; min-height: 5rem; display: flex; flex-direction: column; justify-content: flex-start; }
        .merged-gender-cell .study-cell { min-height: auto; padding: 0; margin-top: 0.3rem; }
        .merged-possessive-cell { padding: 0.4rem 0.6rem; white-space: normal; vertical-align: top; font-size: 0.9rem; line-height: 1.2; min-height: 5.5rem; }
        .stacked-content-line { margin-bottom: 2px; line-height: 1.2; }
        .german-phrase, .article-german-lines { color: #1f2937; font-size: 0.8rem; line-height: 1.2; }
        .base-article-german { background-color: #eff6ff; display: inline-block; padding: 0.05rem 0.2rem; border-radius: 0.25rem; font-weight: 700; color: #1e40af; }
        .article-hidden-part { color: #4b5563; font-style: italic; font-size: 0.8rem; opacity: 0; transition: opacity 0.3s ease-out; line-height: 1.2; white-space: normal; margin-left: 0.25rem; }
        .spanish-translation { color: #4b5563; font-style: italic; font-size: 0.8rem; max-height: 0; overflow: hidden; opacity: 0; transition: max-height 0.3s ease-out, opacity 0.3s ease-out; line-height: 1.2; white-space: normal; margin-top: 0.1rem; }
        .study-cell:hover .spanish-translation, .study-cell.active .spanish-translation { max-height: 10rem; opacity: 1; }
        .article-study-cell-wrapper:hover .article-hidden-part, .article-study-cell-wrapper.active .article-hidden-part { opacity: 1; }
        .article-study-cell-wrapper { cursor: pointer; padding: 0.4rem 0.6rem; transition: background-color 0.15s ease-in-out; min-height: 5.5rem; display: flex; flex-direction: column; justify-content: center; }
        .article-study-cell-wrapper:hover, .article-study-cell-wrapper.active { background-color: #e5e5e5; }
        .article-study-cell-wrapper .stacked-translation-line { display: block; text-align: left; }
        .nominativ-determiner { font-weight: 700; color: #1e40af; background-color: #eff6ff; display: inline-block; padding: 0.1rem 0.2rem; border-radius: 0.25rem; }
        .article-row { background-color: #f7f7f7; }
        .possessive-row { background-color: #dbeafe; }
        .force-open .article-hidden-part, .force-open .spanish-translation { max-height: 10rem !important; opacity: 1 !important; margin-top: 0.1rem !important; }
    </style>
</head>
<body class="p-4 sm:p-8">
    <div class="max-w-7xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">German Nominativ Case: Articles, Pronouns, and Possessives (A1–A2)</h1>
        <p class="text-gray-600 mb-6">El Nominativ responde a "¿Quién?" o "¿Qué?". Se usa para el <strong>sujeto</strong> de la oración - la persona o cosa que hace la acción.</p>
        <div id="table-container" class="bg-white shadow-xl rounded-xl overflow-hidden border border-gray-200"></div>
        <div class="mt-6 flex justify-end">
            <button id="toggle-all-button" onclick="toggleAllTranslations()" class="px-4 py-2 bg-indigo-600 text-white font-semibold rounded-lg shadow-md hover:bg-indigo-700 transition duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-4 5a1 1 0 100 2h2a1 1 0 100-2h-2z" clip-rule="evenodd"/></svg>
                Mostrar todas las traducciones
            </button>
        </div>
    </div>

    <script>
        const tableData = [
            {
                "Sujeto (Nominativo)": "Articulo / Definido",
                "Base": "der / die / das",
                "Trad. Base": "el / la / el",
                "der männlich (nominativ)": "der",
                "Männlich (M)": "Der Mann ist freundlich.",
                "Trad. (M)": "El hombre es amable.",
                "die weiblich (nominativ)": "die",
                "Weiblich (F)": "Die Frau ist Ärztin.",
                "Trad. (F)": "La mujer es doctora.",
                "das neutral (nominativ)": "das",
                "Neutral (N)": "Das Kind schläft.",
                "Trad. (N)": "El niño duerme.",
                "die plural (nominativ)": "die",
                "Plural (P)": "Die Hunde bellen.",
                "Trad. (P)": "Los perros ladran."
            },
            {
                "Sujeto (Nominativo)": "Art. Indef.",
                "Base": "ein / eine / ein",
                "Trad. Base": "un / una / un",
                "der männlich (nominativ)": "ein",
                "Männlich (M)": "Ein Vogel singt laut.",
                "Trad. (M)": "Un pájaro canta fuerte.",
                "die weiblich (nominativ)": "eine",
                "Weiblich (F)": "Eine Blume blüht.",
                "Trad. (F)": "Una flor florece.",
                "das neutral (nominativ)": "ein",
                "Neutral (N)": "Ein Buch liegt da.",
                "Trad. (N)": "Un libro está ahí.",
                "die plural (nominativ)": "-",
                "Plural (P)": "-",
                "Trad. (P)": "(No existe art. indefinido)"
            },
            {
                "Sujeto (Nominativo)": "Art. Neg.",
                "Base": "kein / keine / kein",
                "Trad. Base": "ningún / ninguna / ningún",
                "der männlich (nominativ)": "kein",
                "Männlich (M)": "Es ist kein Wein auf dem Tisch.",
                "Trad. (M)": "No hay vino en la mesa.",
                "die weiblich (nominativ)": "keine",
                "Weiblich (F)": "Es ist keine Milch im Kühlschrank.",
                "Trad. (F)": "No hay leche en el refrigerador.",
                "das neutral (nominativ)": "kein",
                "Neutral (N)": "Kein Auto steht draußen.",
                "Trad. (N)": "Ningún carro está afuera.",
                "die plural (nominativ)": "keine",
                "Plural (P)": "Keine Kinder spielen hier.",
                "Trad. (P)": "Ningún niño juega aquí."
            },
            {
                "Sujeto (Nominativo)": "ich",
                "Base": "mein-",
                "Trad. Base": "mi-",
                "der männlich (nominativ)": "mein",
                "Männlich (M)": "Mein Hund ist süß.",
                "Trad. (M)": "Mi perro es lindo.",
                "die weiblich (nominativ)": "meine",
                "Weiblich (F)": "Meine Lampe brennt.",
                "Trad. (F)": "Mi lámpara está encendida.",
                "das neutral (nominativ)": "mein",
                "Neutral (N)": "Mein Haus ist groß.",
                "Trad. (N)": "Mi casa es grande.",
                "die plural (nominativ)": "meine",
                "Plural (P)": "Meine Katzen schlafen.",
                "Trad. (P)": "Mis gatos duermen."
            },
            {
                "Sujeto (Nominativo)": "du",
                "Base": "dein-",
                "Trad. Base": "tu-",
                "der männlich (nominativ)": "dein",
                "Männlich (M)": "Dein Tisch ist leer.",
                "Trad. (M)": "Tu mesa está vacía.",
                "die weiblich (nominativ)": "deine",
                "Weiblich (F)": "Deine Uhr ist kaputt.",
                "Trad. (F)": "Tu reloj está roto.",
                "das neutral (nominativ)": "dein",
                "Neutral (N)": "Dein Glas ist voll.",
                "Trad. (N)": "Tu vaso está lleno.",
                "die plural (nominativ)": "deine",
                "Plural (P)": "Deine Bücher sind neu.",
                "Trad. (P)": "Tus libros son nuevos."
            },
            {
                "Sujeto (Nominativo)": "er",
                "Base": "sein-",
                "Trad. Base": "su (de él)-",
                "der männlich (nominativ)": "sein",
                "Männlich (M)": "Sein Name ist Tom.",
                "Trad. (M)": "Su nombre es Tom.",
                "die weiblich (nominativ)": "seine",
                "Weiblich (F)": "Seine Frau arbeitet hier.",
                "Trad. (F)": "Su esposa trabaja aquí.",
                "das neutral (nominativ)": "sein",
                "Neutral (N)": "Sein Buch ist interessant.",
                "Trad. (N)": "Su libro es interesante.",
                "die plural (nominativ)": "seine",
                "Plural (P)": "Seine Eltern sind nett.",
                "Trad. (P)": "Sus padres son amables."
            },
            {
                "Sujeto (Nominativo)": "sie (ella)",
                "Base": "ihr-",
                "Trad. Base": "su (de ella)-",
                "der männlich (nominativ)": "ihr",
                "Männlich (M)": "Ihr Mann ist Ingenieur.",
                "Trad. (M)": "Su esposo es ingeniero.",
                "die weiblich (nominativ)": "ihre",
                "Weiblich (F)": "Ihre Katze ist schwarz.",
                "Trad. (F)": "Su gato es negro.",
                "das neutral (nominativ)": "ihr",
                "Neutral (N)": "Ihr Kind spielt draußen.",
                "Trad. (N)": "Su hijo juega afuera.",
                "die plural (nominativ)": "ihre",
                "Plural (P)": "Ihre Taschen sind schwer.",
                "Trad. (P)": "Sus bolsas son pesadas."
            },
            {
                "Sujeto (Nominativo)": "es (neutro)",
                "Base": "sein-",
                "Trad. Base": "su (de ello)-",
                "der männlich (nominativ)": "sein",
                "Männlich (M)": "Sein Auto fährt schnell.",
                "Trad. (M)": "Su carro va rápido.",
                "die weiblich (nominativ)": "seine",
                "Weiblich (F)": "Seine Farbe ist schön.",
                "Trad. (F)": "Su color es bonito.",
                "das neutral (nominativ)": "sein",
                "Neutral (N)": "Sein Buch ist dick.",
                "Trad. (N)": "Su libro es grueso.",
                "die plural (nominativ)": "seine",
                "Plural (P)": "Seine Blätter fallen.",
                "Trad. (P)": "Sus hojas caen."
            },
            {
                "Sujeto (Nominativo)": "wir",
                "Base": "unser-",
                "Trad. Base": "nuestro/a-",
                "der männlich (nominativ)": "unser",
                "Männlich (M)": "Unser Lehrer ist streng.",
                "Trad. (M)": "Nuestro profesor es estricto.",
                "die weiblich (nominativ)": "unsere",
                "Weiblich (F)": "Unsere Stadt ist schön.",
                "Trad. (F)": "Nuestra ciudad es bonita.",
                "das neutral (nominativ)": "unser",
                "Neutral (N)": "Unser Haus ist alt.",
                "Trad. (N)": "Nuestra casa es vieja.",
                "die plural (nominativ)": "unsere",
                "Plural (P)": "Unsere Kinder sind laut.",
                "Trad. (P)": "Nuestros hijos son ruidosos."
            },
            {
                "Sujeto (Nominativo)": "ihr (vosotros)",
                "Base": "euer- / eur-",
                "Trad. Base": "vuestro/a-",
                "der männlich (nominativ)": "euer",
                "Männlich (M)": "Euer Garten ist grün.",
                "Trad. (M)": "Vuestro jardín es verde.",
                "die weiblich (nominativ)": "eure",
                "Weiblich (F)": "Eure Wohnung ist klein.",
                "Trad. (F)": "Vuestro apartamento es pequeño.",
                "das neutral (nominativ)": "euer",
                "Neutral (N)": "Euer Auto ist rot.",
                "Trad. (N)": "Vuestro carro es rojo.",
                "die plural (nominativ)": "eure",
                "Plural (P)": "Eure Kleider sind schön.",
                "Trad. (P)": "Vuestras ropas son bonitas."
            },
            {
                "Sujeto (Nominativo)": "sie (ellos)",
                "Base": "ihr-",
                "Trad. Base": "su (de ellos)-",
                "der männlich (nominativ)": "ihr",
                "Männlich (M)": "Ihr Baum ist hoch.",
                "Trad. (M)": "Su árbol es alto.",
                "die weiblich (nominativ)": "ihre",
                "Weiblich (F)": "Ihre Idee ist gut.",
                "Trad. (F)": "Su idea es buena.",
                "das neutral (nominativ)": "ihr",
                "Neutral (N)": "Ihr Geld ist weg.",
                "Trad. (N)": "Su dinero se fue.",
                "die plural (nominativ)": "ihre",
                "Plural (P)": "Ihre Kinder spielen.",
                "Trad. (P)": "Sus hijos juegan."
            },
            {
                "Sujeto (Nominativo)": "Sie (formal)",
                "Base": "Ihr-",
                "Trad. Base": "su (formal)-",
                "der männlich (nominativ)": "Ihr",
                "Männlich (M)": "Ihr Kaffee ist fertig.",
                "Trad. (M)": "Su café está listo.",
                "die weiblich (nominativ)": "Ihre",
                "Weiblich (F)": "Ihre Rechnung ist korrekt.",
                "Trad. (F)": "Su cuenta es correcta.",
                "das neutral (nominativ)": "Ihr",
                "Neutral (N)": "Ihr Gepäck ist angekommen.",
                "Trad. (N)": "Su equipaje ha llegado.",
                "die plural (nominativ)": "Ihre",
                "Plural (P)": "Ihre Kollegen sind hier.",
                "Trad. (P)": "Sus colegas están aquí."
            }
        ];

        const mergedDeterminerKeys = [
            { key: "der männlich (nominativ)", example: "Männlich (M)", translation: "Trad. (M)", color: 'bg-blue-200' },
            { key: "die weiblich (nominativ)", example: "Weiblich (F)", translation: "Trad. (F)", color: 'bg-blue-300' },
            { key: "das neutral (nominativ)", example: "Neutral (N)", translation: "Trad. (N)", color: 'bg-blue-400' },
            { key: "die plural (nominativ)", example: "Plural (P)", translation: "Trad. (P)", color: 'bg-blue-500' }
        ];

        const determinerKeys = ["der männlich (nominativ)", "die weiblich (nominativ)", "das neutral (nominativ)", "die plural (nominativ)"];

        function formatMultiLine(text, isTranslationBase) {
            if (typeof text !== 'string') return text;
            let newText = text.replace(/ \/ /g, '<br>');
            if (!isTranslationBase) { newText = newText.replace(/\(Nominativ\)/g, '<br>(Nom.)'); }
            else { newText = newText.replace(/\(Nominativ\)/g, '').replace(/-\s*$/, ''); }
            return newText;
        }

        let translationsVisible = false;
        function toggleAllTranslations() {
            const studyWrappers = document.querySelectorAll('.article-study-cell-wrapper, .study-cell');
            const button = document.getElementById('toggle-all-button');
            const table = document.getElementById('table-container');
            translationsVisible = !translationsVisible;
            if (translationsVisible) {
                table.classList.add('force-open');
                button.textContent = 'Ocultar todas las traducciones';
            }
            else {
                table.classList.remove('force-open');
                button.textContent = 'Mostrar todas las traducciones';
                studyWrappers.forEach(w => w.classList.remove('active'));
            }
        }

        function renderTable() {
            const container = document.getElementById('table-container');
            let html = '<table class="divide-y divide-gray-300">';
            html += '<thead class="bg-gray-100">';
            html += '<tr>';
            html += `<th colspan="1" class="table-cell text-xs font-semibold uppercase tracking-wider text-gray-700 border-r border-gray-300">Sujeto</th>`;
            html += `<th colspan="1" class="table-cell text-xs font-semibold uppercase tracking-wider text-gray-700 border-r border-gray-300 bg-blue-100">Base/Posesivo</th>`;
            html += `<th colspan="4" class="table-cell text-xs font-semibold uppercase tracking-wider text-gray-700 bg-blue-100">Nominativ Case (Artículos y Posesivos por Género)</th>`;
            html += '</tr>';
            html += '<tr>';
            html += `<th colspan="1" class="table-cell font-semibold tracking-wider text-gray-700 border-r border-gray-300 bg-gray-50">Sujeto (Nom.)</th>`;
            html += `<th colspan="1" class="table-cell text-xs font-semibold tracking-wider text-gray-700 border-r border-gray-300 bg-blue-200">Base/Posesivo</th>`;
            const genders = [
                { title: 'Männlich (M)', color: 'bg-blue-200', colspan: 1 },
                { title: 'Weiblich (F)', color: 'bg-blue-300', colspan: 1 },
                { title: 'Neutral (N)', color: 'bg-blue-400', colspan: 1 },
                { title: 'Plural (P)', color: 'bg-blue-500', colspan: 1 }
            ];
            genders.forEach(g => {
                html += `<th colspan="${g.colspan}" class="table-cell text-xs font-semibold tracking-wider text-gray-900 ${g.color}">${g.title}</th>`;
            });
            html += '</tr>';
            html += '</thead>';

            const keysToSkip = ["Trad. (M)", "Trad. (F)", "Trad. (N)", "Trad. (P)", "Männlich (M)", "Weiblich (F)", "Neutral (N)", "Plural (P)", "Trad. Base"];

            html += '<tbody class="divide-y divide-gray-200">';
            tableData.forEach((row) => {
                const isArticleRow = row["Sujeto (Nominativo)"].startsWith('Art.') ||
                                     row["Sujeto (Nominativo)"].startsWith('Articulo') ||
                                     row["Sujeto (Nominativo)"] === "Nullartikel";
                const rowClass = isArticleRow ? 'article-row' : 'possessive-row';
                html += `<tr class="${rowClass} hover:bg-opacity-75">`;

                const headers = [
                    "Sujeto (Nominativo)", "Base", "Trad. Base",
                    "der männlich (nominativ)", "Männlich (M)", "Trad. (M)",
                    "die weiblich (nominativ)", "Weiblich (F)", "Trad. (F)",
                    "das neutral (nominativ)", "Neutral (N)", "Trad. (N)",
                    "die plural (nominativ)", "Plural (P)", "Trad. (P)"
                ];

                headers.forEach((key) => {
                    const value = row[key];
                    if (keysToSkip.includes(key)) return;
                    let cellClass = 'table-cell text-sm text-gray-800 text-left';
                    let contentHtml = value;

                    if (determinerKeys.includes(key)) {
                        const mergedData = mergedDeterminerKeys.find(d => d.key === key);
                        const determiner = row[mergedData.key];
                        const exampleValue = row[mergedData.example];
                        const tradExampleValue = row[mergedData.translation];

                        const exampleTextToBold = determiner;
                        let styledExampleValue = exampleValue.replace(new RegExp(`\\b(${exampleTextToBold})\\b`), (m) => `<b>${m}</b>`);
                        cellClass += ` merged-gender-cell wrap-cell align-top ${mergedData.color}`;

                        if (exampleValue && exampleValue !== '-' && tradExampleValue && tradExampleValue !== '-') {
                            contentHtml = `
                                <span class="nominativ-determiner">${determiner}</span>
                                <div class="study-cell cursor-pointer p-0 pt-1" onclick="this.classList.toggle('active')">
                                    <span class="german-phrase whitespace-nowrap">${styledExampleValue}</span>
                                    <span class="spanish-translation">${tradExampleValue}</span>
                                </div>`;
                        } else {
                            contentHtml = `<span class="nominativ-determiner">${determiner}</span>${exampleValue ? '<br>' + exampleValue : ''}`;
                        }
                    }
                    else if (key === "Base") {
                        const baseValue = formatMultiLine(row["Base"], false);
                        const germanLines = baseValue.split('<br>');
                        let alignedHtml = '';
                        const isArticleRow = row["Sujeto (Nominativo)"].startsWith('Art.') ||
                                           row["Sujeto (Nominativo)"].startsWith('Articulo') ||
                                           row["Sujeto (Nominativo)"] === 'Nullartikel';
                        if (isArticleRow) {
                            const tradBaseValue = formatMultiLine(row["Trad. Base"], true);
                            const spanishLines = tradBaseValue.split('<br>');
                            cellClass += ' article-study-cell-wrapper wrap-cell align-top';
                            let germanDisplay = '';
                            for (let i = 0; i < germanLines.length; i++) {
                                const germanText = germanLines[i].trim();
                                const spanishText = (spanishLines[i] || '').trim();
                                if (germanText) {
                                    const isNom = germanText === '(Nom.)';
                                    const germanSpan = isNom ? `<span class="text-gray-800 font-medium">${germanText}</span>` : `<span class="base-article-german">${germanText}</span>`;
                                    const hiddenPart = spanishText ? `<span class="article-hidden-part">→ ${spanishText}</span>` : '';
                                    germanDisplay += `<div class="stacked-content-line">${germanSpan}${hiddenPart}</div>`;
                                }
                            }
                            contentHtml = `<div class="w-full" onclick="this.classList.toggle('active')">${germanDisplay}</div>`;
                            cellClass += ' merged-possessive-cell bg-blue-50';
                        } else {
                            const possessiveRoot = germanLines[0];
                            const tradBaseValue = formatMultiLine(row["Trad. Base"], true);
                            const spanishTranslation = tradBaseValue.split('<br>')[0].trim();
                            alignedHtml = `
                                <div class="stacked-content-line"><span class="base-article-german">${possessiveRoot}</span></div>
                                <div class="stacked-content-line text-xs italic text-gray-500" style="margin-top: 0.2rem;">${spanishTranslation}</div>`;
                            contentHtml = alignedHtml;
                            cellClass += ' merged-possessive-cell bg-blue-100';
                        }
                    }
                    else {
                        if (key === "Sujeto (Nominativo)") {
                            let formattedValue = value;
                            // Format article rows with line breaks
                            if (value.includes(' / ') && (value.startsWith('Articulo') || value.startsWith('Art.'))) {
                                formattedValue = value.replace(' / ', '<br>');
                            }
                            contentHtml = `<div class="w-full">${formattedValue}</div>`;
                            cellClass += ' wrap-cell align-top p-0 merged-possessive-cell bg-gray-50';
                        }
                    }
                    html += `<td class="${cellClass}">${contentHtml}</td>`;
                });
                html += '</tr>';
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        window.onload = renderTable;
    </script>
</body>
</html>
