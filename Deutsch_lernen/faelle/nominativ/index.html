<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>German Nominativ Case Table</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f7;
        }
        .table-cell {
            padding: 0.4rem 0.6rem;
            white-space: nowrap; 
            vertical-align: top;
        }
        .wrap-cell {
            white-space: normal;
        }

        /* --- BASE STYLES FOR INTERACTIVE CELLS --- */
        .interactive-cell-wrapper {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 0.4rem 0.6rem;
            transition: background-color 0.15s ease-in-out;
            min-height: 5.5rem; /* Ensure consistent height for all main interactive cells */
            justify-content: center;
        }
        .interactive-cell-wrapper:hover,
        .interactive-cell-wrapper.active {
            background-color: #e5e5e5; /* Light grey hover background */
        }

        /* --- HIDDEN TRANSLATION MECHANISM (UNIFIED) --- */
        .hidden-translation-part {
            color: #4b5563; 
            font-style: italic; /* Always italic for Spanish translations */
            font-size: 0.8rem;
            line-height: 1.2;
            white-space: normal;
            display: none;
        }
        
        /* RULE 1: Reveal on Hover/Active or Global Toggle */
        .interactive-cell-wrapper:hover .hidden-translation-part,
        .interactive-cell-wrapper.active .hidden-translation-part,
        .force-open .hidden-translation-part {
            display: block;
            margin-top: 0.1rem;
        }
        

        /* --- SPECIFIC STYLE ELEMENTS --- */
        
        /* Removed .merged-gender-cell, .merged-base-cell as they are no longer relevant */

        .german-phrase {
            color: #1f2937; 
            font-size: 0.9rem;
            line-height: 1.2;
        }
        .base-article-german {
            background-color: #ecfdf5; 
            display: inline-block;
            padding: 0.05rem 0.2rem;
            border-radius: 0.25rem;
            font-weight: 700; 
            color: #065f46;
        }
        .nominativ-pronoun-visible {
            font-weight: 700;
            color: #0f766e;
            background-color: #f0fdfa;
            display: inline-block;
            padding: 0.1rem 0.2rem;
            border-radius: 0.25rem;
            margin-right: 0.5rem;
        }
        .pronunciation-hint {
            font-size: 0.8rem;
            color: #4b5563;
            font-weight: 500;
            margin-top: 0;
        }

        /* Row colors */
        .article-row, .possessive-row {
            background-color: #f0fdfa;
        }
    </style>
</head>
<body class="p-4 sm:p-8">

        <p class="text-gray-600 mb-6">A comprehensive table of the Nominativ case, including personal pronouns, articles, and possessive determiners, with Spanish translations. (Click/tap any cell to reveal its translation.)</p>

        <div id="table-container" class="bg-white shadow-xl rounded-xl overflow-hidden border border-gray-200">
            <!-- Table will be rendered here by JavaScript -->

        <!-- Global Toggle Button -->

                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-4 5a1 1 0 100 2h2a1 1 0 100-2h-2z" clip-rule="evenodd" />
                </svg>
                Mostrar todas las traducciones
            </button>
        </div>
    </div>

                "Neutral (N) - Ejemplos con Verbos": "Ihr Gepäck ist angekommen.",

                "Plural (P) - Determiner": "Ihre",

        const pronunciationMap = {
            "ich": "/ij/", "du": "/du/", "er": "/ea/", "sie (ella)": "/si/",
            "es (neutro)": "/es/", "wir": "/via/", "ihr (vosotros)": "/ia/",
            "sie (ellos)": "/si/", "Sie (formal)": "/si/"
        };
        const spanishTranslationMap = {
            "ich": "yo", "du": "tú", "er": "él", "wir": "nosotros/as"
        };

        function toggleAllTranslations() {
            const button = document.getElementById('toggle-all-button');
            const table = document.getElementById('table-container');

            let translationsVisible = table.classList.contains('force-open');
            translationsVisible = !translationsVisible;
            
            if (translationsVisible) {
                table.classList.add('force-open');
                button.textContent = 'Ocultar todas las traducciones';
            } else {
                table.classList.remove('force-open');
                button.textContent = 'Mostrar todas las traducciones';
                document.querySelectorAll('.interactive-cell-wrapper').forEach(wrapper => {
                    wrapper.classList.remove('active');
                });
            }
        }

        function renderTable() {
            const container = document.getElementById('table-container');
            const headers = Object.keys(tableData[0]); // Get headers from the first data row

            let html = '<div class="overflow-x-auto"><table class="min-w-full divide-y divide-gray-300">';

            // Table Headers
            html += '<thead class="bg-gray-100"><tr>';
            headers.forEach(header => {
                html += `<th class="px-3 py-2 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">${header}</th>`;
            });
            html += '</tr></thead>';

            // Table Body
            html += '<tbody class="divide-y divide-gray-200">';
            tableData.forEach(row => {
                html += '<tr class="hover:bg-opacity-75">';
                headers.forEach(header => {
                    let cellContent = row[header];
                    let translationContent = '';
                    let cellClass = 'table-cell text-sm text-gray-800 text-left px-3 py-2';

                    // Determine if there's a corresponding translation column
                    if (header === "Sujeto (Nominativo)") {
                        const baseText = cellContent.replace(/ \((ella|vosotros|ellos|formal|neutro)\)/, '').trim();
                        const pronunciation = pronunciationMap[cellContent] || '';
                        const simpleSpanishTranslation = spanishTranslationMap[baseText] || '';

                        contentWrapper = `<span class="nominativ-pronoun-visible">${baseText}</span>`;
                        if (pronunciation) contentWrapper += `<span class="pronunciation-hint">${pronunciation}</span>`;
                        if (simpleSpanishTranslation) translationContent = simpleSpanishTranslation;
                        if (cellContent.includes('(')) translationContent = `${translationContent} ${cellContent.match(/ \((.+)\)/)[1]}`; // Append parenthesis content

                    } else if (header.endsWith(" - Determiner") || header.endsWith(" - Ejemplos con Verbos") || header === "Base") {
                         // Check for corresponding translation. Example: "Männlich (M) - Determiner" -> "Trad. (M)"
                        let baseHeader = '';
                        if(header.includes("Determiner")) {
                            baseHeader = header.replace(" - Determiner", "");
                        } else if (header.includes("Ejemplos con Verbos")) {
                            baseHeader = header.replace(" - Ejemplos con Verbos", "");
                        } else if (header === "Base") {
                            baseHeader = ""; // Special case for base
                        }

                        if (row[`Trad. ${baseHeader ? baseHeader + ' - ' : ''} ` + (baseHeader ? '' : 'Base')] !== undefined) {
                            translationContent = row[`Trad. ${baseHeader ? baseHeader + ' - ' : ''} `+ (baseHeader ? '' : 'Base')];
                        }

                        if (header.includes(" - Ejemplos con Verbos") && row[header.replace("Ejemplos con Verbos", "Determiner")] && row[header.replace("Ejemplos con Verbos", "Determiner")] !== '-') {
                            const currentDeterminer = row[header.replace("Ejemplos con Verbos", "Determiner")];
                            cellContent = cellContent.replace(currentDeterminer, `<b class="text-green-800">${currentDeterminer}</b>`);
                        }

                    }
                    
                    if (translationContent && translationContent !== '-') {
                        html += `<td class="${cellClass}"><div class="interactive-cell-wrapper">
                            ${cellContent}
                            <span class="hidden-translation-part">${translationContent}</span>
                        </div></td>`;
                    } else {
                        html += `<td class="${cellClass}">${cellContent}</td>`;
                    }
                });
                html += '</tr>';
            });
            html += '</tbody>';
            html += '</table></div>';

            container.innerHTML = html;
        }

        function setupEventListeners() {
            const tableContainer = document.getElementById('table-container');
            if (tableContainer) {
                tableContainer.addEventListener('click', function(event) {
                    const wrapper = event.target.closest('.interactive-cell-wrapper');
                    if (wrapper) {
                        wrapper.classList.toggle('active');
                    }
                });
            }
        }

        window.onload = function() {
            renderTable();
            setupEventListeners();
        };
    </script>
</body>
</html>
