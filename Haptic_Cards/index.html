        function getResearchFocus(device) {
            const focus = [];
            const auditInfo = hapticAuditData[device.name];
            const sens = auditInfo ? auditInfo.sensations : (device.submodalities || []);
            
            if (sens.includes("Impact") || sens.includes("Vibration")) focus.push("Transient Cues");
            if (sens.includes("Stiffness") || sens.includes("Resistance")) focus.push("Compliance & Force");
            if (sens.includes("Weight magnitude") || sens.includes("Weight distribution")) focus.push("Mass & Inertia");
            if (sens.includes("Shape") || sens.includes("Friction")) focus.push("Surface & Form");
            if (sens.includes("Thermal")) focus.push("Thermal Feedback");
            if (focus.length === 0) focus.push("Active Actuation");
            return focus;
        }

        function showMedia(container, index) {
            const mediaData = JSON.parse(container.dataset.media || '[]');
            const categorySymbol = container.dataset.categorySymbol || '⚙️';
            const display = container.querySelector('.gallery-media-display');
            if (!display) return;

            if (mediaData.length === 0) {
                display.innerHTML = `
                <div class="h-44 w-full bg-sky-900 flex flex-col items-center justify-center text-sky-200">
                    <span class="text-3xl mb-1">${categorySymbol}</span>
                    <span class="text-xs font-medium tracking-wide text-sky-300">Active Haptic Device</span>
                </div>`;
                return;
            }

            const normalizedIndex = (index + mediaData.length) % mediaData.length;
            container.dataset.currentIndex = normalizedIndex;

            const currentMedia = mediaData[normalizedIndex];
            if (currentMedia.type === 'video') {
                display.innerHTML = `<video src="${currentMedia.src}" class="w-full h-44 object-cover" autoplay loop muted playsinline></video>`;
            } else {
                display.innerHTML = `<img src="${currentMedia.src}" alt="Haptic Controller" class="w-full h-44 object-cover" loading="lazy" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'h-44 w-full bg-sky-900 flex flex-col items-center justify-center text-sky-200\'><span class=\'text-3xl mb-1\'>${categorySymbol}</span><span class=\'text-xs font-medium tracking-wide text-sky-300\'>Active Haptic Device</span></div>';">`;
            }

            const dots = container.querySelectorAll('.gallery-dot');
            dots.forEach((dot, idx) => {
                if (idx === normalizedIndex) dot.classList.add('active');

            const currentPat = canonicalPatterns[currentPatternIndex];
            const regularDevices = devices.filter(d => !d.isIntro);
            const patternDevices = regularDevices.filter(d => (deviceMechanismPatterns[d.name] || "General") === currentPat);
            const maxPages = Math.ceil(patternDevices.length / CARDS_PER_PAGE);
            if (currentCardsPage < maxPages - 1) {
                currentCardsPage++;
                renderApp();
            }

            if (currentCardsPage > 0) {

        function renderApp() {
            const regularDevices = devices.filter(d => !d.isIntro);
            const currentPat = canonicalPatterns[currentPatternIndex];
            const currentIcon = patternIcons[currentPat] || "⚙️";
            const patternDevices = regularDevices.filter(d => (deviceMechanismPatterns[d.name] || "General") === currentPat);

            const totalCards = patternDevices.length;
            const totalPages = Math.max(1, Math.ceil(totalCards / CARDS_PER_PAGE));
            if (currentCardsPage >= totalPages) currentCardsPage = 0;

            const startIdx = currentCardsPage * CARDS_PER_PAGE;
            const endIdx = Math.min(startIdx + CARDS_PER_PAGE, totalCards);
            const pageDevices = patternDevices.slice(startIdx, endIdx);

            // Update Top Banner
            const heroIcon = document.getElementById('hero-pattern-icon');
            const heroIdx = document.getElementById('hero-pattern-idx');

            if (heroIdx) heroIdx.textContent = `Pattern ${currentPatternIndex + 1} of ${canonicalPatterns.length}`;
            if (heroCount) heroCount.textContent = `${totalCards} ${totalCards === 1 ? 'Controller' : 'Controllers'}`;
            if (heroTitle) heroTitle.textContent = currentPat;

            if (pageIndicator) {
                if (totalCards === 0) pageIndicator.textContent = '0 cards';
                else pageIndicator.textContent = `Cards ${startIdx + 1}-${endIdx} of ${totalCards}`;
            }
            if (prevPageBtn) prevPageBtn.disabled = currentCardsPage === 0;
            if (nextPageBtn) nextPageBtn.disabled = currentCardsPage >= totalPages - 1 || totalCards <= CARDS_PER_PAGE;

            const viewport = document.getElementById('cards-viewport');

                            : '';

                        const generalUseCaseTagsHTML = Array.isArray(device.generalUseCases) && device.generalUseCases.length > 0 
                            ? device.generalUseCases.map(guc => `<span class="general-use-case-tag text-white text-[11px] font-medium px-2 py-0.5 rounded-full">${guc}</span>`).join('') 
                            : '';
                        
                        const mappedCategory = categoryMap[device.category] || device.category || "Unknown";
                        const categoryIconSymbol = categoryIconSymbols[mappedCategory] || categoryIconSymbols["Unknown"];

                        const mediaArray = Array.isArray(device.media) ? device.media : []; 
                        const mediaDataString = JSON.stringify(mediaArray).replace(/"/g, '&quot;');
                        
                        let dotsHTML = '';
                        if (mediaArray.length > 1) {
                            for (let i = 0; i < mediaArray.length; i++) {
                                dotsHTML += `<span class="gallery-dot ${i === 0 ? 'active' : ''}"></span>`;
                            }
                        }

                        const researchFocus = getResearchFocus(device);
                        const researchTagsHTML = researchFocus.map(topic => getResearchFocusTagHTML(topic)).join('');

                        const cardHTML = `
                        <div class="card-item bg-[#E0FFFF] rounded-xl shadow-md hover:shadow-xl transition-shadow duration-300 ease-in-out flex flex-col relative overflow-hidden border border-sky-200/60" data-pattern="${devicePattern}">
                            <!-- Card Header with Mechanism Pattern -->
                            <div class="bg-[#0369A1] border-b border-sky-800 flex flex-col">
                                <div class="px-4 pt-3 pb-2.5 flex justify-between items-center">
                                    <div class="flex flex-col">
                                        <span class="text-[9px] font-bold text-sky-200 uppercase tracking-widest leading-tight">${devicePattern}</span>
                                        <h2 class="text-base sm:text-lg font-bold text-white leading-snug">
                                            ${device.name}
                                        </h2>
                                    </div>
                                    ${device.year ? `<span class="text-[10px] font-semibold px-2 py-0.5 rounded bg-sky-900/70 text-sky-200 border border-sky-700/60">${device.year}</span>` : ''}
                                </div>
                                
                                <div class="gallery-container bg-gray-100 relative" data-media="${mediaDataString}" data-current-index="0" data-category-symbol="${categoryIconSymbol}">
                                    <div class="gallery-media-display"></div>
                                    <button class="gallery-nav-btn gallery-prev-btn">
                                         <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" /></svg>
                                    </button>
                                    <button class="gallery-nav-btn gallery-next-btn">
                                         <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" /></svg>
                                    </button>
                                    <div class="gallery-dots">${dotsHTML}</div>
                                </div>
                            </div>
                            
                            <div class="p-4 flex-grow flex flex-col justify-between">
                                <div>
                                    <!-- Sleek Tab Switcher -->
                                    <div class="flex border-b border-gray-300 mb-3 text-[11px] font-semibold select-none gap-2">
                                        <button class="info-tab-btn pb-1 text-blue-600 border-blue-600 border-b-2 focus:outline-none" data-tab="versatility">Haptic Versatility</button>
                                        <button class="info-tab-btn pb-1 text-gray-500 hover:text-gray-700 focus:outline-none" data-tab="research">Research</button>
                                        <button class="info-tab-btn pb-1 text-gray-500 hover:text-gray-700 focus:outline-none" data-tab="use-cases">Use Cases</button>
                                    </div>

                                    <!-- 1. Haptic Versatility Tab Content (Active & Visible by Default) -->
                                    <div class="versatility-tab-content flex-grow flex flex-col justify-start">
                                        ${renderVersatilityRating(device)}

                                        <!-- Mechanism Row with Relocated Category Emoji -->
                                        <div class="mb-2.5 pb-2 border-b border-gray-200">
                                           <button class="w-full text-left focus:outline-none flex justify-between items-center mechanism-toggle-btn mb-1">
                                               <div class="flex items-center gap-1.5 flex-wrap">
                                                   <h3 class="text-[11px] font-semibold text-gray-500 uppercase tracking-wider">Mechanism:</h3>
                                                   <span class="category-tag text-white text-[9px] font-semibold px-2 py-0.5 rounded-full bg-black lowercase tracking-wider">${mappedCategory.toLowerCase()}</span>
                                                   <span class="text-xs bg-sky-100 p-0.5 rounded-full border border-sky-200 inline-flex items-center justify-center" title="${mappedCategory}">${categoryIconSymbol}</span>
                                               </div>
                                               <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 transition-transform duration-200 transform mechanism-arrow text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                   <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                                               </svg>
                                           </button>
                                           <div class="mechanism-content hidden">
                                                <p class="text-gray-700 mt-1 text-xs leading-relaxed">
                                                    ${device.mechanism}
                                                </p>
                                           </div>
                                        </div>
                   
                                        <!-- Haptic Modality Row -->
                                        <div class="mb-2.5 pb-2 border-b border-gray-200">
                                             <h3 class="text-[11px] font-semibold text-gray-500 uppercase tracking-wider mb-1">Haptic Modality</h3>
                                             <div class="grid grid-cols-2 gap-2 text-xs">
                                                 <div>
                                                     <h4 class="text-[10px] font-bold text-gray-600 mb-0.5">Cutaneous</h4>
                                                     <div class="flex flex-wrap gap-0.5">${cutaneousTagsHTML}</div>
                                                 </div>
                                                 <div>
                                                     <h4 class="text-[10px] font-bold text-gray-600 mb-0.5">Kinesthetic</h4>
                                                     <div class="flex flex-wrap gap-0.5">${kinestheticTagsHTML}</div>
                                                 </div>
                                             </div>
                                        </div>
                                    </div>

                                    <!-- 2. Research Focus Tab Content -->
                                    <div class="research-tab-content hidden flex-grow flex flex-col justify-start">
                                        <div class="mb-3 pb-3 border-b border-gray-200">
                                            <h3 class="text-[11px] font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Research Focus</h3>
                                            <div class="flex flex-wrap gap-1 mb-2">
                                                ${researchTagsHTML}
                                            </div>
                                            
                                            ${generalUseCaseTagsHTML ? `
                                            <h3 class="text-[11px] font-semibold text-gray-500 uppercase tracking-wider mb-1 mt-2">Context</h3>
                                            <div class="flex flex-wrap gap-1 mb-1">
                                                ${generalUseCaseTagsHTML}
                                            </div>
                                            ` : ''}
                                        </div>
                                    </div>

                                    <!-- 3. Use Cases Tab Content -->
                                    <div class="use-cases-tab-content hidden flex-grow flex flex-col justify-start">
                                        <div class="mb-3 pb-3 border-b border-gray-200">
                                            <h3 class="text-[11px] font-semibold text-gray-500 uppercase tracking-wider mb-1">Use Cases</h3>
                                            ${useCaseTagsHTML ? `
                                            <div class="flex flex-wrap gap-1 mb-2"> 
                                               ${useCaseTagsHTML}
                                            </div>
                                            ` : ''}
                                            <div class="usecase-content">
                                                <p class="text-gray-700 mt-1 text-xs leading-relaxed">${device.useCaseText || ''}</p> 
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Reference Link at Bottom of Card -->
                                ${device.doi || device.publication || device.year ? `
                                <div class="mt-auto pt-2 border-t border-slate-200/60 text-xs text-gray-600">
                                    <button class="w-full text-left focus:outline-none flex justify-between items-center text-[10.5px] font-semibold text-gray-500 uppercase tracking-wider ref-toggle-btn">
                                        <span>Reference</span>
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 transition-transform duration-200 transform ref-arrow" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                                        </svg>
                                    </button>
                                    <div class="ref-content hidden text-[11px] mt-1.5">
                                        <p class="font-semibold text-gray-800">${device.author || 'Author in Proceedings'}</p>
                                        <p class="italic text-gray-600 my-0.5">"${device.title || device.name}"</p>
                                        <p class="text-gray-500">${device.publication || 'Proceedings'}, ${device.year || ''}</p>
                                        ${device.doi ? `
                                        <a href="https://doi.org/${device.doi}" target="_blank" rel="noopener noreferrer" class="text-blue-600 hover:text-blue-800 font-semibold transition-colors inline-flex items-center mt-1">
                                            Paper
                                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 ml-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                              <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                                            </svg>
                                        </a>` : ''}
                                    </div>
                                </div>
                                ` : ''}
                            </div>
                        </div>
                        `;
                        viewport.innerHTML += cardHTML;
                    });
                }

                document.querySelectorAll('.gallery-container').forEach(container => {
                    showMedia(container, 0);
                });
            }

            // Render Bottom Mechanism Pattern Pills exactly as in the screenshot
            const pillsContainer = document.getElementById('patterns-pills-container');
            if (pillsContainer) {
                pillsContainer.innerHTML = '';
                canonicalPatterns.forEach((pat, idx) => {
                    const count = regularDevices.filter(d => (deviceMechanismPatterns[d.name] || "General") === pat).length;
                    const icon = patternIcons[pat] || "⚙️";
                    const isActive = idx === currentPatternIndex;

                    const pillHTML = `
                    <button onclick="setPattern(${idx})" class="text-xs font-medium px-3.5 py-1.5 rounded-full border transition-all duration-150 select-none flex items-center gap-1.5 shadow-sm ${
                        isActive 
                            ? 'bg-blue-600 text-white border-blue-700 font-bold shadow-md ring-2 ring-blue-300 scale-105' 
                            : 'bg-white text-gray-700 border-sky-200 hover:bg-sky-50 hover:border-sky-300'
                    }">
                        <span>${icon}</span>
                        <span>${pat}</span>
                        <span class="text-[10.5px] ${isActive ? 'text-blue-100 font-bold' : 'text-gray-500 font-semibold'}">(${count})</span>
                    </button>
                    `;
                    pillsContainer.innerHTML += pillHTML;
                });
            }
        }

        function setupEventListeners() {
            const introDevice = devices.find(d => d.isIntro);
            if (introDevice) {
                const modalContent = document.getElementById('intro-modal-content');
                if (modalContent) {
                    modalContent.innerHTML = `
                    <div class="mb-3">
                        <span class="text-xs font-bold text-sky-700 uppercase tracking-widest">${introDevice.category}</span>
                        <h2 class="text-2xl font-bold text-sky-950">${introDevice.name}</h2>
                    </div>
                    ${introDevice.contentHTML}
                    `;
                }
            }

            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight') {
                    nextCardsPage();
                } else if (e.key === 'ArrowLeft') {
                    prevCardsPage();
                }
            });

            document.addEventListener('click', (event) => {
                // Gallery buttons
                const target = event.target.closest('button');
                if (!target) return;

                const galleryContainer = target.closest('.gallery-container');
                if (galleryContainer) {
                    let currentIndex = parseInt(galleryContainer.dataset.currentIndex || '0', 10);
                    if (target.classList.contains('gallery-prev-btn')) {
                        showMedia(galleryContainer, currentIndex - 1);
                    } else if (target.classList.contains('gallery-next-btn')) {
                        showMedia(galleryContainer, currentIndex + 1);
                    }
                }

                // Reference Toggle
                if (target.classList.contains('ref-toggle-btn') || target.closest('.ref-toggle-btn')) {
                    const btn = target.closest('.ref-toggle-btn') || target;
                    const content = btn.nextElementSibling;
                    const arrow = btn.querySelector('.ref-arrow');
                    if (content) {
                        content.classList.toggle('hidden');
                        if (arrow) arrow.classList.toggle('rotate-180');
                    }
                }

                // Mechanism Toggle
                if (target.classList.contains('mechanism-toggle-btn') || target.closest('.mechanism-toggle-btn')) {
                    const btn = target.closest('.mechanism-toggle-btn') || target;
                    const content = btn.nextElementSibling;
                    const arrow = btn.querySelector('.mechanism-arrow');
                    if (content) {
                        content.classList.toggle('hidden');
                        if (arrow) arrow.classList.toggle('rotate-180');
                    }
                }

                // Tab Switcher
                if (target.classList.contains('info-tab-btn')) {
                    const card = target.closest('.card-item');
                    if (!card) return;

                    const tabName = target.dataset.tab;
                    card.querySelectorAll('.info-tab-btn').forEach(btn => {
                        if (btn === target) {
                            btn.classList.add('text-blue-600', 'border-blue-600', 'border-b-2');
                            btn.classList.remove('text-gray-500');
                        } else {
                            btn.classList.remove('text-blue-600', 'border-blue-600', 'border-b-2');
                            btn.classList.add('text-gray-500');
                        }
                    });

                    const versatilityContent = card.querySelector('.versatility-tab-content');
                    const researchContent = card.querySelector('.research-tab-content');
                    const useCasesContent = card.querySelector('.use-cases-tab-content');
                    
                    if (versatilityContent) versatilityContent.classList.add('hidden');
                    if (researchContent) researchContent.classList.add('hidden');
                    if (useCasesContent) useCasesContent.classList.add('hidden');
                    
                    if (tabName === 'versatility' && versatilityContent) {
                        versatilityContent.classList.remove('hidden');
                    } else if (tabName === 'research' && researchContent) {
                        researchContent.classList.remove('hidden');
                    } else if (tabName === 'use-cases' && useCasesContent) {
                        useCasesContent.classList.remove('hidden');
                    }
                }

                // Intro card dots
                if (target.classList.contains('intro-dot')) {
                    const slideIndex = parseInt(target.dataset.slide, 10);
                    const modal = document.getElementById('intro-modal');
                    if (!modal) return;
                    const slide1 = modal.querySelector('.intro-slide-1');
                    const slide2 = modal.querySelector('.intro-slide-2');
                    const dots = modal.querySelectorAll('.intro-dot');
                    
                    if (slideIndex === 0) {
                        if (slide1) slide1.classList.remove('hidden');
                        if (slide2) slide2.classList.add('hidden');
                    } else {
                        if (slide1) slide1.classList.add('hidden');
                        if (slide2) slide2.classList.remove('hidden');
                    }
                    
                    dots.forEach((d, idx) => {
                        if (idx === slideIndex) {
                            d.classList.add('bg-blue-600');
                            d.classList.remove('bg-slate-300', 'hover:bg-slate-400');
                        } else {
                            d.classList.remove('bg-blue-600');
                            d.classList.add('bg-slate-300', 'hover:bg-slate-400');
                        }
                    });
                }
            });
        }

        window.onload = function() {
            renderApp();
            setupEventListeners();
        };
    </script>
</body>
</html>
