        /* A simple, clean font for better readability */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Base styles for all tags */
        .modality-tag, .use-case-tag, .general-use-case-tag, .category-tag, .none-tag {
            display: inline-block;
            border-radius: 9999px; /* Fully rounded */
            color: #fff;
            cursor: pointer;
            transition: opacity 0.2s;
            vertical-align: middle; /* Align category tag with text */
            margin: 2px; /* Base margin */
        }

        /* Size for Category, Use Case, and General Use Case tags */
        .category-tag, .use-case-tag, .general-use-case-tag {
             font-size: 0.85em;
             padding: 4px 10px;
             cursor: default; /* Not clickable */
        }

        /* Smaller size for Haptic Modality tags */
        .modality-tag, .none-tag {
            font-size: 0.75em; /* Smaller font */
            padding: 2px 8px; /* Reduced padding */
        }
        .modality-tag:hover { /* Keep hover only for clickable modality tags */
             opacity: 0.85;
         }

        /* Color styles */
        .cutaneous {
            background-color: #28a745; /* Green */
        }
        .kinesthetic {
            background-color: #dc3545; /* Red */
        }
        .use-case-tag {
            background-color: #007bff; /* Blue */
        }
        .general-use-case-tag {
            background-color: #fd7e14; /* Orange */
        }
        /* Move absolute positioned general use case tags closer in height */
        .absolute .general-use-case-tag {
            margin-top: 1px;
            margin-bottom: 1px;
        }
        .category-tag {
             background-color: #000000; /* Black */
             margin-right: 6px; /* Add space after the tag */
        }
        /* Style for the 'none' tag */
        .none-tag {
             background-color: #6c757d; /* Gray */
             cursor: default; /* Not clickable */
             pointer-events: none; /* Disable click events */
        }


        .gemini-ideas ul {

        }

        }

            height: 24px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Gallery Styles */
        .gallery-container {
            position: relative;
            overflow: hidden; /* Ensure buttons stay within bounds */
        }
        .gallery-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.4); /* Slightly lighter background */
            color: white;
            border: none;

            border-radius: 50%;
            cursor: pointer;
            z-index: 10;

        .gallery-nav-btn:hover {

             height: 18px;
         }
        .gallery-prev-btn {
            left: 10px;
        }
        .gallery-next-btn {
            right: 10px;
        }
        /* Dot counter styles */
        .gallery-dots {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px; /* Space between dots */
            z-index: 10;
        }
        .gallery-dot {
            width: 8px;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.5); /* Inactive dot color */

        .gallery-dot.active {

        // --- Gemini API Call Function ---
        async function getGeminiIdeas(device, buttonElement) {
            const ideasContainer = document.getElementById(`gemini-ideas-${device.name.replace(/\s+/g, '-').replace(/[^a-zA-Z0-9-]/g, '')}`); // Ensure ID matches sanitization
            ideasContainer.innerHTML = '<div class="loader"></div>';
            buttonElement.disabled = true;

            const systemPrompt = `You are an expert HCI researcher and creative technologist specializing in haptics. Your goal is to brainstorm novel, concrete, and imaginative use cases for haptic devices.
            - Provide exactly three distinct ideas.
            - Format the output as a simple HTML unordered list (<ul><li>Idea 1</li>...</ul>).
            - Do not include any other text, titles, or explanations.`;
            const userQuery = `Brainstorm three new, creative use cases for the following haptic device:
            - Name: ${device.name}
            - Mechanism: ${device.mechanism}
            - Known Modalities: ${device.submodalities.join(', ')}
            - Existing Use Cases (for context, do not repeat): ${device.useCaseTags.join(', ')}`; // Pass use case tags as context
            
            const apiKey = "YOUR_API_KEY"; // TODO: Replace with your actual Google AI Studio API key
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${apiKey}`;

            try {
                // Exponential backoff retry logic
                let response;
                let attempts = 0;
                const maxAttempts = 5;
                let delay = 1000; // Start with 1 second

                while (attempts < maxAttempts) {
                    response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userQuery }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] },
                        })
                    });

                    if (response.ok) {
                        break; // Success
                    } else if (response.status === 429 || response.status >= 500) {
                        // Throttled or server error, wait and retry
                        attempts++;
                        if (attempts >= maxAttempts) {
                           throw new Error(`API Error after ${maxAttempts} attempts: ${response.status} ${response.statusText}`);
                        }
                        console.warn(`API call failed with status ${response.status}. Retrying in ${delay / 1000}s...`);
                        await new Promise(resolve => setTimeout(resolve, delay));
                        delay *= 2; // Double the delay
                    } else {
                        // Other client-side error
                        throw new Error(`API Error: ${response.status} ${response.statusText}`);
                    }
                }


                const result = await response.json();
                const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                
                if (text) {
                    ideasContainer.innerHTML = text;
                } else {
                     console.error('Unexpected API response structure:', result);
                    ideasContainer.innerHTML = '<p class="text-red-500 text-sm">Could not generate ideas (unexpected response). Please try again.</p>';
                }

            } catch (error) {
                console.error('Gemini API call failed:', error);
                ideasContainer.innerHTML = `<p class="text-red-500 text-sm">Error: ${error.message}</p>`;
                 buttonElement.disabled = false; // Re-enable button on error
                 buttonElement.style.display = 'block'; // Ensure button is visible
            } finally {
                 // Hide button after successful generation
                 if (ideasContainer.innerHTML.startsWith('<ul')) { 
                      buttonElement.style.display = 'none'; 
                 } else { // Keep visible on error
                      buttonElement.disabled = false; 
                      buttonElement.style.display = 'block';
                 }
            }
        }

        // --- Gallery Navigation ---
        function showMedia(galleryContainer, index) {
            const mediaDisplay = galleryContainer.querySelector('.gallery-media-display');
            const dotsContainer = galleryContainer.querySelector('.gallery-dots'); // Get dots container
            const mediaDataString = galleryContainer.dataset.media;
            const categorySymbol = galleryContainer.dataset.categorySymbol; // Get symbol from data attribute
            let mediaData;

            try {
                 // Handle potential double escaping from attribute setting
                 const correctedString = mediaDataString.replace(/&quot;/g, '"');
                 mediaData = JSON.parse(correctedString);
            } catch (e) {
                 console.error("Failed to parse media data:", mediaDataString, e);
                 mediaDisplay.innerHTML = `<img src="https://placehold.co/400x250/CBD5E0/4A5568?text=Error+Loading+Media" alt="Error Loading Media" class="gallery-media">`;
                 return; // Stop if data is invalid
            }
            
            const total = mediaData.length;

             // If total is 0 or less, display default and hide controls
            if (total <= 0) {
                 mediaDisplay.innerHTML = `<img src="https://placehold.co/400x250/CBD5E0/4A5568?text=Media+Not+Available" alt="Media Not Available" class="gallery-media">`;
                 galleryContainer.querySelector('.gallery-prev-btn').style.display = 'none';
                 galleryContainer.querySelector('.gallery-next-btn').style.display = 'none';
                 if (dotsContainer) dotsContainer.style.display = 'none';
                 return;
            }


            // Ensure index is within bounds
            index = (index + total) % total; 
            galleryContainer.dataset.currentIndex = index;

            const currentMedia = mediaData[index];
            let mediaHTML = '';

            // Special handling for the first slide (index 0)
            if (index === 0 && currentMedia.type === 'image') {
                let imageUrl = currentMedia.src;
                // Remove text from placeholder URL for the first slide
                if (imageUrl.includes('placehold.co')) {
                    // Change to a solid color placeholder without text
                    imageUrl = "https://placehold.co/400x250/E2E8F0/E2E8F0"; // Background color same as text color
                }
                mediaHTML = `<img src="${imageUrl}" alt="Gallery image 1" class="gallery-media" onerror="this.onerror=null;this.src='https://placehold.co/400x250/CBD5E0/4A5568?text=Image+Not+Available';">`;
            } else if (currentMedia.type === 'image') {
                mediaHTML = `<img src="${currentMedia.src}" alt="Gallery image ${index + 1}" class="gallery-media" onerror="this.onerror=null;this.src='https://placehold.co/400x250/CBD5E0/4A5568?text=Image+Not+Available';">`;
            } else if (currentMedia.type === 'video') {
                 let videoSrc = currentMedia.src;
                 // Ensure src is embed link
                 if (videoSrc && !videoSrc.includes('/embed/')) {
                     if (videoSrc.includes('youtu.be/')) {
                         const videoId = videoSrc.split('youtu.be/')[1].split('?')[0];
                         videoSrc = `https://www.youtube.com/embed/${videoId}`;
                     } else if (videoSrc.includes('youtube.com/watch?v=')) {
                         const videoId = videoSrc.split('v=')[1].split('&')[0];
                         videoSrc = `https://www.youtube.com/embed/${videoId}`;
                     } else {
                          // Assume it's just the ID if it doesn't look like a URL

                               // Fallback if it's some other kind of URL - display error image maybe?
                               console.error("Invalid video URL format:", currentMedia.src);
                               mediaHTML = `<img src="https://placehold.co/400x250/CBD5E0/4A5568?text=Invalid+Video" alt="Invalid Video URL" class="gallery-media">`;
                               mediaDisplay.innerHTML = mediaHTML; // Set error HTML directly
                               return; // Exit early for invalid video format
                           }
                     }
                 }
                 if (mediaHTML === '') { // Only build iframe if not already set to error image
                     mediaHTML = `<iframe src="${videoSrc}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen class="gallery-media"></iframe>`;
                 }
            }

            mediaDisplay.innerHTML = mediaHTML;

            // Update dots
             if (dotsContainer) {
                 const dots = dotsContainer.querySelectorAll('.gallery-dot');
                 dots.forEach((dot, dotIndex) => {
                    if (dotIndex === index) {
                        dot.classList.add('active');
                    } else {
                        dot.classList.remove('active');
                    }
                 });
             }

             // Hide controls if only one item

            const nextBtn = galleryContainer.querySelector('.gallery-next-btn');
            if (total <= 1) {
                prevBtn.style.display = 'none';

            } else {
                prevBtn.style.display = 'flex';
                nextBtn.style.display = 'flex';
                 if (dotsContainer) dotsContainer.style.display = 'flex'; // Show dots container
            }
        }

                            </div>
                            <button class="gallery-nav-btn gallery-prev-btn">
                                 <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"> <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" /> </svg>
                            </button>
                            <button class="gallery-nav-btn gallery-next-btn">
                                 <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"> <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" /> </svg>
                            </button>
                            <div class="gallery-dots">${dotsHTML}</div>
                        </div>
                    </div>
                    
                    <!-- Content Section (with padding) -->
                    <div class="p-5 flex-grow flex flex-col">
                        <!-- Sleek Tab Switcher -->
                        <div class="flex border-b border-gray-300 mb-4 text-xs font-semibold select-none gap-4">
                            <button class="info-tab-btn pb-1.5 text-blue-600 border-blue-600 border-b-2 focus:outline-none" data-tab="research">Research Focus</button>
                            <button class="info-tab-btn pb-1.5 text-gray-500 hover:text-gray-700 focus:outline-none" data-tab="haptic-specs">Haptic Specs</button>
                            <button class="info-tab-btn pb-1.5 text-gray-500 hover:text-gray-700 focus:outline-none" data-tab="use-cases">Use Cases</button>
                        </div>

                        <!-- Research Focus Content Container (Active by Default) -->
                        <div class="research-tab-content flex-grow flex flex-col justify-start">
                            <div class="mb-4 pb-4 border-b border-gray-200">
                                <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-2">Research Focus</h3>
                                <p class="text-xs text-gray-600 mb-3">This project targets the following research focus areas:</p>
                                <div class="flex flex-wrap gap-2 mb-4">
                                    ${researchTagsHTML}
                                </div>
                                
                                ${generalUseCaseTagsHTML ? `
                                <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-2 mt-4">Application Context</h3>
                                <div class="flex flex-wrap gap-2 mb-1">
                                    ${generalUseCaseTagsHTML}
                                </div>
                                ` : ''}
                            </div>
                        </div>

                        <!-- Haptic Specs Content Container (Hidden by Default) -->
                        <div class="haptic-specs-tab-content hidden flex-grow flex flex-col">
                            <!-- Mechanism Section -->
                            <div class="mb-4 pb-4 border-b border-gray-200">
                               <button class="w-full text-left focus:outline-none flex justify-between items-center mechanism-toggle-btn mb-2">
                                   <div class="flex items-center gap-1.5 flex-wrap">
                                       <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider">Mechanism:</h3>
                                       <span class="category-tag text-white text-[10px] font-semibold px-2.5 py-0.5 rounded-full bg-black lowercase tracking-wider">${mappedCategory.toLowerCase()}</span>
                                       <span class="text-xl leading-none" title="${mappedCategory}">${categoryIconSymbol}</span>
                                   </div>
                                   <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transition-transform duration-200 transform mechanism-arrow text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                       <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                                   </svg>
                               </button>
                               <div class="mechanism-content hidden">
                                    <p class="text-gray-700 mt-1">
                                        ${device.mechanism}
                                    </p>
                               </div>
                           </div>
       
                            <!-- Haptic Modality Section -->
                            <div class="mb-4 pb-4 border-b border-gray-200">
                                 <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-2">Haptic Modality</h3>
                                 <div class="grid grid-cols-2 gap-4">
                                     <div>
                                         <h4 class="text-xs font-bold text-gray-700 mb-1">Cutaneous Perception</h4>
                                         <div class="flex flex-wrap gap-1">${cutaneousTagsHTML}</div>
                                     </div>
                                     <div>
                                         <h4 class="text-xs font-bold text-gray-700 mb-1">Kinesthetic Perception</h4>
                                         <div class="flex flex-wrap gap-1">${kinestheticTagsHTML}</div>
                                     </div>
                                 </div>
                            </div>
 
                          <!-- Reference Section -->
                          ${device.doi ? `
                          <div class="mt-auto text-xs text-gray-600">
                              <button class="w-full text-left focus:outline-none flex justify-between items-center text-sm font-semibold text-gray-500 uppercase tracking-wider mb-2 ref-toggle-btn">
                                  <span>Reference</span>
                                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transition-transform duration-200 transform ref-arrow" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                                  </svg>
                              </button>
                              <div class="ref-content hidden">
                                  <p class="font-semibold">${device.author || 'N/A'}</p>
                                  <p class="italic my-1">"${device.title || 'N/A'}"</p>
                                  <p>${device.publication || 'N/A'}, ${device.year || 'N/A'}</p>
                                  <a href="https://doi.org/${device.doi}" target="_blank" rel="noopener noreferrer" class="text-blue-600 hover:text-blue-800 font-medium transition-colors inline-flex items-center mt-2 mb-2">
                                      Paper
                                      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                                      </svg>
                                  </a>
                              </div>
                          </div>
                          ` : ''}
                        </div>

                        <!-- Use Cases Content Container (Hidden by Default) -->
                        <div class="use-cases-tab-content hidden flex-grow flex flex-col justify-start">
                            <!-- Use Cases Section -->
                            <div class="mb-4 flex-grow pb-4 border-b border-gray-200">
                                <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-2">Use Cases</h3>
                                <!-- Use case tags are always visible -->
                                ${useCaseTagsHTML ? `
                                <div class="flex flex-wrap gap-1 mb-3"> 
                                   ${useCaseTagsHTML}
                                </div>
                                ` : ''}
                                <!-- Text description is always visible -->
                                <div class="usecase-content">
                                    <p class="text-gray-700 mt-1 text-sm">${device.useCaseText || ''}</p> 
                                </div>
                            </div>
                        </div>
 
                         <!-- Gemini Section -->
                        <div class="gemini-section mt-4 pt-4 border-t border-dashed border-gray-300 hidden">
                             <button id="gemini-btn-${deviceId}" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition-colors duration-300">
                                Generate Ideas ✨
                            </button>
                            <div id="gemini-ideas-${deviceId}" class="gemini-ideas text-gray-700 mt-4 text-sm"></div>
                        </div>
                    </div>
                </div>
                `;
                
                cardContainer.innerHTML += cardHTML;
            });
            
             // Add event listeners after all cards are created
            devices.forEach(device => {
                 const deviceId = device.name.replace(/\s+/g, '-').replace(/[^a-zA-Z0-9-]/g, ''); // Sanitize ID further
                 const button = document.getElementById(`gemini-btn-${deviceId}`);
                 if (button) { // Check if the button exists
                    button.addEventListener('click', () => getGeminiIdeas(device, button));
                 }
            });

            // Add event listeners for modality tags (excluding 'none' and use case)
            document.querySelectorAll('.modality-tag').forEach(tag => {
                 if (!tag.classList.contains('use-case-tag') && !tag.classList.contains('none-tag') && !tag.classList.contains('category-tag')) { 
                    tag.addEventListener('click', () => {
                        const modalityName = tag.dataset.modality;
                        getGeminiExplanation(modalityName);
                    });
                 }
            });

            // Add delegated event listeners for gallery navigation
            cardContainer.addEventListener('click', (event) => {
                const target = event.target.closest('button'); // Ensure we get the button element
                 if (!target) return; // Exit if the click wasn't on or inside a button
                
                const galleryContainer = target.closest('.gallery-container');
                if (!galleryContainer) return;

                let currentIndex = parseInt(galleryContainer.dataset.currentIndex || '0', 10);

                if (target.classList.contains('gallery-prev-btn')) {
                    showMedia(galleryContainer, currentIndex - 1);
                } else if (target.classList.contains('gallery-next-btn')) {
                    showMedia(galleryContainer, currentIndex + 1);
                }
            });

            // Add delegated event listener for reference toggles
            cardContainer.addEventListener('click', (event) => {
                const targetBtn = event.target.closest('.ref-toggle-btn');
                if (!targetBtn) return;
                
                const clickedCard = targetBtn.closest('.card-item');
                if (!clickedCard) return;

                const allCards = Array.from(cardContainer.children);
                const isOpening = targetBtn.nextElementSibling.classList.contains('hidden');
                
                // Find all cards in the same row
                const rowCards = allCards.filter(card => card.offsetTop === clickedCard.offsetTop);
                
                rowCards.forEach(card => {
                    const btn = card.querySelector('.ref-toggle-btn');
                    if (btn) {
                        const content = btn.nextElementSibling;
                        const arrow = btn.querySelector('.ref-arrow');
                        if (isOpening) {
                            content.classList.remove('hidden');
                            arrow.classList.add('rotate-180');
                        } else {
                            content.classList.add('hidden');
                            arrow.classList.remove('rotate-180');
                        }
                    }
                });
            });

            // Add delegated event listener for mechanism toggles
            cardContainer.addEventListener('click', (event) => {
                const targetBtn = event.target.closest('.mechanism-toggle-btn');
                if (!targetBtn) return;
                
                const clickedCard = targetBtn.closest('.card-item');
                if (!clickedCard) return;

                const allCards = Array.from(cardContainer.children);
                const isOpening = targetBtn.nextElementSibling.classList.contains('hidden');
                
                // Find all cards in the same row
                const rowCards = allCards.filter(card => card.offsetTop === clickedCard.offsetTop);
                
                rowCards.forEach(card => {
                    const btn = card.querySelector('.mechanism-toggle-btn');
                    if (btn) {
                        const content = btn.nextElementSibling;
                        const arrow = btn.querySelector('.mechanism-arrow');
                        if (isOpening) {
                            content.classList.remove('hidden');
                            arrow.classList.add('rotate-180');
                        } else {
                            content.classList.add('hidden');
                            arrow.classList.remove('rotate-180');
                        }
                    }
                });
            });

            // Add delegated event listener for use case toggles
            cardContainer.addEventListener('click', (event) => {
                const targetBtn = event.target.closest('.usecase-toggle-btn');
                if (!targetBtn) return;
                
                const clickedCard = targetBtn.closest('.card-item');
                if (!clickedCard) return;

                const allCards = Array.from(cardContainer.children);
                const usecaseContent = clickedCard.querySelector('.usecase-content');
                if (!usecaseContent) return;
                const isOpening = usecaseContent.classList.contains('hidden');
                
                // Find all cards in the same row
                const rowCards = allCards.filter(card => card.offsetTop === clickedCard.offsetTop);
                
                rowCards.forEach(card => {
                    const btn = card.querySelector('.usecase-toggle-btn');
                    const content = card.querySelector('.usecase-content');
                    if (btn && content) {
                        const arrow = btn.querySelector('.usecase-arrow');
                        if (isOpening) {
                            content.classList.remove('hidden');
                            arrow.classList.add('rotate-180');
                        } else {
                            content.classList.add('hidden');
                            arrow.classList.remove('rotate-180');
                        }
                    }
                });
            });

             // Add delegated event listener for tab buttons
            cardContainer.addEventListener('click', (event) => {
                const targetBtn = event.target.closest('.info-tab-btn');
                if (!targetBtn) return;
                
                const card = targetBtn.closest('.card-item');
                if (!card) return;

                const tabName = targetBtn.dataset.tab;

                // Toggle active tab classes on buttons
                const tabButtons = card.querySelectorAll('.info-tab-btn');
                tabButtons.forEach(btn => {
                    if (btn === targetBtn) {
                        btn.classList.add('text-blue-600', 'border-blue-600', 'border-b-2');
                        btn.classList.remove('text-gray-500');
                    } else {
                        btn.classList.remove('text-blue-600', 'border-blue-600', 'border-b-2');
                        btn.classList.add('text-gray-500');
                    }
                });

                // Toggle visibility of sections
                const researchContent = card.querySelector('.research-tab-content');
                const hapticSpecsContent = card.querySelector('.haptic-specs-tab-content');
                const useCasesContent = card.querySelector('.use-cases-tab-content');
                
                // Hide all tabs
                if (researchContent) researchContent.classList.add('hidden');
                if (hapticSpecsContent) hapticSpecsContent.classList.add('hidden');
                if (useCasesContent) useCasesContent.classList.add('hidden');
                
                // Show the active tab
                if (tabName === 'research' && researchContent) {
                    researchContent.classList.remove('hidden');
                } else if (tabName === 'haptic-specs' && hapticSpecsContent) {
                    hapticSpecsContent.classList.remove('hidden');
                } else if (tabName === 'use-cases' && useCasesContent) {
                    useCasesContent.classList.remove('hidden');
                }
            });

             // Initialize galleries after adding cards to DOM
            document.querySelectorAll('.gallery-container').forEach(container => {
                showMedia(container, 0); // Show the first item initially
            });
        }

        // Run the function on page load
        window.onload = function() {
            createCards();

            // Setup toggle functionality
            const ideaToggle = document.getElementById('toggle-ideas');
            ideaToggle.addEventListener('change', () => {
                const geminiSections = document.querySelectorAll('.gemini-section');
                geminiSections.forEach(section => {
                    if (ideaToggle.checked) {
                        section.classList.remove('hidden');
                    } else {
                        section.classList.add('hidden');
                    }
                });
            });

            // Setup modal close functionality
            const modal = document.getElementById('explainer-modal');
            const closeBtn = document.getElementById('modal-close-btn');
            closeBtn.addEventListener('click', () => modal.classList.add('hidden'));
            modal.addEventListener('click', (e) => {
                // Close modal if clicking outside the content area
                if (e.target === modal) { 
                    modal.classList.add('hidden');
                }
            });
        };
    </script>

</body>
</html>
