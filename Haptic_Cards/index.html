        {"name": "Haptic Handshank", "category": "Flexible surface deformation", "author": "K. M. Arafat Aziz, Hu Luo, Lehiany Asma, Weiliang Xu, Yuru Zhang, Dangxiao Wang", "title": "Haptic Handshank – A Handheld Multimodal Haptic Feedback Controller for Virtual Reality", "mechanism": "A modular multimodal VR controller featuring a pneumatically actuated silicone airbag on the thumb module for softness and pressure feedback, combined with a Peltier thermoelectric element and vibration motor on the palm module.", "useCaseText": "Rendering synchronized multimodal thermal, compliance, and vibrotactile feedback during handheld virtual reality interactions.", "useCaseTags": ["Thermal cues", "Stiffness cues", "Vibration cues"], "generalUseCases": ["Gaming", "Virtual reality simulation", "Multimodal training"], "submodalities": ["Thermal", "Stiffness", "Vibration"], "media": [{"type": "image", "src": "img/haptic_handshank.png"}, {"type": "image", "src": "img/haptic_handshank_mechanism.jpg"}], "doi": "10.1109/ismar50242.2020.00047", "publication": "IEEE ISMAR", "year": "2020"},
        {"name": "CapstanCrunch", "category": "Joint actuation", "author": "Mike Sinclair, Eyal Ofek, Mar Gonzalez-Franco, Christian Holz", "title": "CapstanCrunch: A Haptic VR Controller with User-supplied Force Feedback", "mechanism": "A friction-based capstan-plus-cord brake mechanism driven by a miniature low-power motor amplifies user-supplied gripping force by up to 40x, rendering rigid and compliant virtual surfaces with high holding force and low latency.", "useCaseText": "Providing high-force resistive stiffness and variable compliance when grasping virtual objects.", "useCaseTags": ["Stiffness cues"], "generalUseCases": ["Gaming", "Virtual object manipulation", "Training"], "submodalities": ["Stiffness"], "media": [{"type": "image", "src": "img/capstancrunch.jpg"}, {"type": "image", "src": "img/capstancrunch_mechanism.jpg"}, {"type": "video", "src": "https://www.youtube.com/watch?v=btZoEgiwRA0"}], "doi": "10.1145/3332165.3347891", "publication": "ACM UIST", "year": "2019"},
        {"name": "CLAW", "category": "Joint actuation", "author": "Inrak Choi, Eyal Ofek, Hrvoje Benko, Mike Sinclair, Christian Holz", "title": "CLAW: A Multifunctional Handheld Haptic Controller for Grasping, Touching, and Triggering in Virtual Reality", "mechanism": "A motorized rotating arm tracks the index finger to actuate resistive grasping forces and trigger resistance, while an integrated voice-coil actuator on the fingertip delivers high-bandwidth vibrotactile textures and impact pulses.", "useCaseText": "Rendering multimodal grasping stiffness, surface touching textures, and firearm trigger recoil.", "useCaseTags": ["Stiffness cues", "Vibration cues", "Impact cues", "Shape cues"], "generalUseCases": ["Gaming", "Tool interaction", "Virtual reality simulation"], "submodalities": ["Stiffness", "Vibration", "Impact", "Shape"], "media": [{"type": "image", "src": "img/claw.jpg"}, {"type": "image", "src": "img/claw_mechanism.jpg"}, {"type": "video", "src": "https://www.youtube.com/watch?v=8BZ1JnnBwgI"}], "doi": "10.1145/3173574.3174228", "publication": "ACM CHI", "year": "2018"},
        {"name": "HapLinkage", "category": "Joint actuation", "author": "Nianlong Li, Han-Jong Kim, Luyao Shen, Feng Tian, Teng Han, Xing-Dong Yang, Tek-Jin Nam", "title": "HapLinkage: Prototyping Haptic Proxies for Virtual Hand Tools Using Linkage Mechanism", "mechanism": "Configurable planar mechanical linkage systems driven by active and passive joint actuators rapidly prototype kinematic motion and force feedback for diverse virtual hand tools (pliers, scissors, syringes, wrenches).", "useCaseText": "Prototyping dynamic kinetic motions and joint resistance forces for virtual handheld tools.", "useCaseTags": ["Resistance cues"], "generalUseCases": ["Tool prototyping", "Virtual training", "Gaming"], "submodalities": ["Resistance"], "media": [{"type": "image", "src": "img/haplinkage.jpg"}, {"type": "image", "src": "img/haplinkage_mechanism.jpg"}, {"type": "video", "src": "https://www.youtube.com/watch?v=3Hvr54iOArU"}], "doi": "10.1145/3379337.3415812", "publication": "ACM UIST", "year": "2020"},
        {"name": "Haptic Links", "category": "Joint actuation", "author": "Evan Strasnick, Christian Holz, Eyal Ofek, Mike Sinclair, Hrvoje Benko", "title": "Haptic Links: Bimanual Haptics for Virtual Reality Using Variable Stiffness Actuation", "mechanism": "Electro-mechanical variable stiffness linkages (Layer-Hinge, Chain, and Ratchet) connect two VR controllers, electrostatically and mechanically locking multi-DOF relative motion to render rigid, constrained, and compliant bimanual objects.", "useCaseText": "Transforming two handheld VR controllers into rigid two-handed tools, bows, weapons, or constrained mechanisms.", "useCaseTags": ["Resistance cues", "Shape cues"], "generalUseCases": ["Gaming", "Bimanual interaction", "Tool simulation"], "submodalities": ["Resistance", "Shape"], "media": [{"type": "image", "src": "img/hapticlinks.jpg"}, {"type": "image", "src": "img/hapticlinks_mechanism.jpg"}, {"type": "video", "src": "https://www.youtube.com/watch?v=aMkYJ0fKLEo"}], "doi": "10.1145/3173574.3174218", "publication": "ACM CHI", "year": "2018"},
        {"name": "ElaStick", "category": "Band elasticity control", "author": "Neung Ryu, Woojin Lee, Myung Jin Kim, Andrea Bianchi", "title": "ElaStick: A Handheld Variable Stiffness Display for Rendering Dynamic Haptic Response of Flexible Object", "mechanism": "Four servomotors wind spools to independently tension four elastic tendons along a 2-DOF flexible joint, dynamically modulating bending stiffness and damping to realistically render flexible virtual objects.", "useCaseText": "Simulating the dynamic bending compliance, stiffness, and oscillation of flexible objects and tools in VR.", "useCaseTags": ["Stiffness cues", "Shape cues"], "generalUseCases": ["Gaming", "Flexible object simulation", "Virtual sports"], "submodalities": ["Stiffness", "Shape"], "media": [{"type": "image", "src": "img/elastick.jpg"}, {"type": "image", "src": "img/elastick_mechanism.jpg"}, {"type": "video", "src": "https://www.youtube.com/watch?v=kkDMDuDpv9s"}], "doi": "10.1145/3379337.3415862", "publication": "ACM UIST", "year": "2020"},
        {"name": "ElastiLinks", "category": "Band elasticity control", "author": "Tzu-Yun Wei, Hsin-Ruey Tsai, Yu-So Liao, Chieh Tsai, Yi-Shan Chen, Chi Wang, Bing-Yu Chen", "title": "ElastiLinks: Force Feedback between VR Controllers with Dynamic Points of Application of Force", "mechanism": "A pair of VR controllers connected by an elastic link utilizing motorized rotatable tracks to dynamically reposition the Point of Application of Force (PAF) and wind the band, rendering directional resistive forces and impact moments.", "useCaseText": "Providing bimanual kinesthetic resistance and torque sensations with dynamic application points (e.g., archery bow, slingshot).", "useCaseTags": ["Impact cues", "Resistance cues"], "generalUseCases": ["Gaming", "Bimanual interaction", "Training"], "submodalities": ["Impact", "Resistance"], "media": [{"type": "image", "src": "img/elastilinks.jpg"}, {"type": "image", "src": "img/elastilinks_mechanism.jpg"}, {"type": "video", "src": "https://www.youtube.com/watch?v=VsMw4QpSgiA"}], "doi": "10.1145/3379337.3415836", "publication": "ACM UIST", "year": "2020"},
        {"name": "ElastOscillation", "category": "Band elasticity control", "author": "Hsin-Ruey Tsai, Ching-Wen Hung, Tzu-Chun Wu, Bing-Yu Chen", "title": "ElastOscillation: 3D Multilevel Force Feedback for Damped Oscillation on VR Controllers", "mechanism": "Elastic bands and controllable damping mechanisms suspend a moving proxy mass in 3D space within the controller, dynamically rendering 3D damped oscillation effects and shifting center of mass.", "useCaseText": "Rendering 3D damped oscillations, bouncing effects, and mass dynamics during virtual object manipulation.", "useCaseTags": ["Weight distribution cues"], "generalUseCases": ["Gaming", "Object physics simulation", "Training"], "submodalities": ["Weight distribution"], "media": [{"type": "image", "src": "img/elastoscillation.jpg"}, {"type": "image", "src": "img/elastoscillation_mechanism.jpg"}, {"type": "video", "src": "https://www.youtube.com/watch?v=Za-yDqn1tgc"}], "doi": "10.1145/3313831.3376408", "publication": "ACM CHI", "year": "2020"},
        {"name": "Bstick", "category": "Pin extension", "author": "Ginam Ko, Jaeseok Yoon, Byungseok Jung, SangHun Nam", "title": "Variable Offset Method Based on Five-finger Pressure to Enhance Weight Perception in Virtual Reality", "mechanism": "Five micro-linear pin actuators individually resist each finger with up to 22 N, coupled with independent pressure sensing and a grip vibrator to deliver individual finger stiffness and dynamic grasp weight cues.", "useCaseText": "Rendering individual finger contact compliance, active gripping stiffness, and dynamic weight perception in VR.", "useCaseTags": ["Stiffness cues", "Vibration cues"], "generalUseCases": ["Gaming", "Virtual grasping", "Training"], "submodalities": ["Stiffness", "Vibration"], "media": [{"type": "image", "src": "img/bstick.png"}, {"type": "image", "src": "img/bstick_mechanism.jpg"}, {"type": "video", "src": "https://www.youtube.com/watch?v=ga5Op0fq9NU"}], "doi": "10.1145/3588028.3603654", "publication": "ACM SIGGRAPH", "year": "2023"},
        {"name": "HaptiVec", "category": "Pin extension", "author": "Daniel K. Y. Chen, Jean-Baptiste Chossat, Peter B. Shull", "title": "HaptiVec: Presenting Haptic Feedback Vectors in Handheld Controllers using Embedded Tactile Pin Arrays", "mechanism": "A 3x5 tactile pin array embedded in the controller handle actuates miniature push-pins into the fingers and palm, rendering continuous 2D directional pressure vectors and multi-directional impact cues.", "useCaseText": "Presenting directional force vectors, projectile impact cues, and environmental tactile feedback (e.g. rain) in handheld VR.", "useCaseTags": ["Impact cues"], "generalUseCases": ["Gaming", "Shooting simulation", "Directional cues"], "submodalities": ["Impact"], "media": [{"type": "image", "src": "img/haptivec.jpg"}, {"type": "image", "src": "img/haptivec_mechanism.jpg"}, {"type": "video", "src": "https://www.youtube.com/watch?v=eBcRnL91buI"}], "doi": "10.1145/3290605.3300401", "publication": "ACM CHI", "year": "2019"},
        {"name": "PoCoPo", "category": "Pin extension", "author": "Shigeo Yoshida, Yuqian Sun, Hideaki Kuzuoka", "title": "PoCoPo: Handheld Pin-based Shape Display for Haptic Rendering in Virtual Reality", "mechanism": "A handheld shape display featuring 36 motorized linear pins distributed across two opposing faces that dynamically extend to render 2.5D physical shapes, contours, and physical button affordances directly in the palm.", "useCaseText": "Rendering 2.5D object shapes, physical tool profiles, and tangible interface components in VR without visual aid.", "useCaseTags": ["Shape cues"], "generalUseCases": ["Gaming", "Tactile shape exploration", "Virtual tool interaction"], "submodalities": ["Shape"], "media": [{"type": "image", "src": "img/pocopo.jpg"}, {"type": "image", "src": "img/pocopo_mechanism.jpg"}, {"type": "video", "src": "https://www.youtube.com/watch?v=_lL34qC3-q0"}], "doi": "10.1145/3313831.3376358", "publication": "ACM CHI", "year": "2020"},
        {"name": "TextureTouch", "category": "Pin extension", "author": "Hrvoje Benko, Christian Holz, Mike Sinclair, Eyal Ofek", "title": "NormalTouch and TextureTouch: High-fidelity 3D Haptic Shape Rendering on Handheld Virtual Reality Controllers", "mechanism": "A 4x4 matrix of independently actuated pins mounted on a handheld VR controller dynamically elevates pins to conform to virtual surface geometries, rendering fine-grained physical textures and 3D surface profiles.", "useCaseText": "Rendering high-fidelity 3D geometric shape details and surface textures directly against the user's fingertip.", "useCaseTags": ["Shape cues"], "generalUseCases": ["Virtual texture inspection", "Gaming", "Tactile rendering"], "submodalities": ["Shape"], "media": [{"type": "image", "src": "img/texturetouch.jpg"}, {"type": "image", "src": "img/texturetouch_mechanism.jpg"}, {"type": "video", "src": "https://www.youtube.com/watch?v=KhbUg3_3T0I"}], "doi": "10.1145/2984511.2984526", "publication": "ACM UIST", "year": "2016"},
        {"name": "Chanbara", "category": "Flywheel torque", "author": "", "title": "", "mechanism": "The earliest flywheel device here: braking a spinning wheel delivers sword-strike impact in VR.", "useCaseText": "Providing active impact cues in virtual reality interactions.", "useCaseTags": ["Impact cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Impact"], "media": [{"type": "image", "src": "https://placehold.co/400x250/DFE2DC/001011?text=Chanbara"}], "doi": "", "publication": "", "year": "2007"},
        {"name": "HapticWhirl", "category": "Flywheel torque", "author": "", "title": "", "mechanism": "A gimballed flywheel tilts to steer gyroscopic torque across impact, motion and resistance cues.", "useCaseText": "Providing active vibration, impact, motion, resistance cues in virtual reality interactions.", "useCaseTags": ["Vibration cues", "Impact cues", "Motion cues", "Resistance cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Vibration", "Impact", "Motion", "Resistance"], "media": [{"type": "image", "src": "img/hapticwhirl.png"}], "doi": "", "publication": "", "year": ""},
        {"name": "iTorqU 2.1", "category": "Flywheel torque", "author": "", "title": "", "mechanism": "A gimballed flywheel redirects its spin axis, producing torque that pulls the hand in a direction.", "useCaseText": "Providing active motion cues in virtual reality interactions.", "useCaseTags": ["Motion cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Motion"], "media": [{"type": "image", "src": "https://placehold.co/400x250/DFE2DC/001011?text=iTorqU+2.1"}], "doi": "", "publication": "", "year": ""},
        {"name": "MetamorphX", "category": "Flywheel torque", "author": "", "title": "", "mechanism": "Opposed gyroscopes generate 3-DoF moment, changing the inertia and viscosity of the wielded object.", "useCaseText": "Providing active resistance cues in virtual reality interactions.", "useCaseTags": ["Resistance cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Resistance"], "media": [{"type": "image", "src": "https://placehold.co/400x250/DFE2DC/001011?text=MetamorphX"}], "doi": "", "publication": "", "year": ""},
        {"name": "Sobue et al.", "category": "Flywheel torque", "author": "", "title": "", "mechanism": "A motor driver brakes the spinning rotor abruptly, and the reverse torque reads as an impact.", "useCaseText": "Providing active impact cues in virtual reality interactions.", "useCaseTags": ["Impact cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Impact"], "media": [{"type": "image", "src": "https://placehold.co/400x250/DFE2DC/001011?text=Sobue+et+al."}], "doi": "", "publication": "", "year": ""},
        {"name": "SpinShot", "category": "Flywheel torque", "author": "", "title": "", "mechanism": "A flywheel is fired and braked to produce directional impact, optimised for physical and felt force.", "useCaseText": "Providing active impact cues in virtual reality interactions.", "useCaseTags": ["Impact cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Impact"], "media": [{"type": "image", "src": "img/spinshot.jpg"}], "doi": "", "publication": "", "year": ""},
        {"name": "TorqueCapsules", "category": "Flywheel torque", "author": "", "title": "", "mechanism": "Fully encapsulated flywheel modules attach to objects, prototyping kinesthetic and movement cues.", "useCaseText": "Providing active impact, resistance cues in virtual reality interactions.", "useCaseTags": ["Impact cues", "Resistance cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Impact", "Resistance"], "media": [{"type": "image", "src": "img/torquecapsules.jpg"}], "doi": "", "publication": "", "year": ""},
        {"name": "HaptiCraft", "category": "Exchangeable actuator modules", "author": "Chaeyong Park, Jeongwoo Kim, Jinsoo Kim, Seungmoon Choi", "title": "HaptiCraft: A Modular Multimodal Haptic Controller for Immersive Virtual Reality Interactions", "mechanism": "Modular interchangeable haptic cubes attach onto a core handheld controller chassis, dynamically combining vibration, impact, thermal, variable inertia, and magnetorheological (MR) fluid variable stiffness actuators.", "useCaseText": "Rendering multimodal tactile and kinesthetic sensations (heat/cold, impact, stiffness, vibrations) by interchanging hardware modules.", "useCaseTags": ["Thermal cues", "Stiffness cues", "Vibration cues", "Impact cues"], "generalUseCases": ["Gaming", "Modular controller design", "VR interaction authoring"], "submodalities": ["Thermal", "Stiffness", "Vibration", "Impact"], "media": [{"type": "image", "src": "img/hapticraft.jpg"}, {"type": "image", "src": "img/hapticraft_mechanism.jpg"}, {"type": "video", "src": "https://www.youtube.com/watch?v=UWZDeVB9AT0"}], "doi": "10.1109/tvcg.2024.11481658", "publication": "IEEE TVCG", "year": "2024"},
        {"name": "SensoryBlox", "category": "Exchangeable actuator modules", "author": "Hyunjae Gil, Abbas Khawaja, Ben Cressman, Andrew Gerungan, Jin Ryong Kim", "title": "SensoryBlox: Plug-and-Feel Modular Multi-Sensory User Interface for Immersive Cardboard VR", "mechanism": "Plug-and-feel modular tactile blocks snap onto Cardboard VR headsets and controllers, instantly routing power and signals to thermal thermoelectric Peltier units and vibrotactile actuators.", "useCaseText": "Adding affordable, reconfigurable thermal and vibrotactile sensory feedback to low-cost VR headsets and handhelds.", "useCaseTags": ["Thermal cues", "Vibration cues"], "generalUseCases": ["Affordable VR", "Modular education", "Gaming"], "submodalities": ["Thermal", "Vibration"], "media": [{"type": "image", "src": "img/sensoryblox.jpg"}, {"type": "image", "src": "img/sensoryblox_mechanism.jpg"}, {"type": "video", "src": "https://www.youtube.com/watch?v=v4jbfg_5qjU"}], "doi": "10.1145/3772318.3791596", "publication": "ACM CHI", "year": "2024"},
        {"name": "VoxelHap", "category": "Exchangeable actuator modules", "author": "Martin Feick, Cihan Biyikli, Kiran Gani, Anton Wittig, Anthony Tang, Antonio Krüger", "title": "VoxelHap: A Toolkit for Constructing Proxies Providing Tactile and Kinesthetic Haptic Feedback in Virtual Reality", "mechanism": "An open-source toolkit combining functional active Voxels (integrated actuators for vibration, sensing, and resistance) with modular tactile Plates (shape, texture, weight) to rapidly build versatile VR haptic proxy objects.", "useCaseText": "Constructing modular physical props and proxies that combine tactile textures with kinesthetic resistance for VR tools.", "useCaseTags": ["Vibration cues", "Resistance cues"], "generalUseCases": ["VR prop construction", "Tool prototyping", "Gaming"], "submodalities": ["Vibration", "Resistance"], "media": [{"type": "image", "src": "img/voxelhap.jpg"}, {"type": "image", "src": "img/voxelhap_mechanism.jpg"}], "doi": "10.1145/3586183.3606722", "publication": "ACM UIST", "year": "2023"},
        {"name": "FluidWeight", "category": "Liquid mass shifting", "author": "Diego Monteiro et al.", "title": "Design and Development of a Low-cost Device for Weight and Center of Gravity Simulation in Virtual Reality", "mechanism": "Pumps move water between dual reservoirs driven by stepper motor syringes to dynamically modulate total mass up to 500g and shift center of gravity.", "useCaseText": "Simulating dynamic heft, shifting balance, and fluid inertia across diverse virtual objects in VR.", "useCaseTags": ["Weight magnitude cues", "Weight distribution cues", "Shape cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Weight magnitude", "Weight distribution", "Shape"], "media": [{"type": "image", "src": "img/fluidweight.png"}, {"type": "image", "src": "img/fluidweight_mechanism.png"}], "doi": "10.1145/3462244.3479907", "publication": "ACM ICMI", "year": "2021"},
        {"name": "GravityCup", "category": "Liquid mass shifting", "author": "Chih-Hao Cheng et al.", "title": "GravityCup: A liquid-based haptics for simulating dynamic weight in virtual reality", "mechanism": "Bi-directional pumping transfers liquid into and out of a handheld cup bladder, dynamically modulating mass and inertia during pouring and filling.", "useCaseText": "Simulating dynamic liquid volume, scooping, and container weight changes in virtual reality.", "useCaseTags": ["Weight magnitude cues", "Shape cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Weight magnitude", "Shape"], "media": [{"type": "image", "src": "img/gravitycup.jpg"}, {"type": "video", "src": "https://www.youtube.com/watch?v=IukNXxwoprI"}], "doi": "10.1145/3281505.3281569", "publication": "ACM VRST", "year": "2018"},
        {"name": "MobileGravity", "category": "Liquid mass shifting", "author": "Alexander Kalus et al.", "title": "MobileGravity: Mobile Simulation of a High Range of Weight in Virtual Reality", "mechanism": "Decoupled docking base station transfers liquid up to 1 kg at 235 g/s into untethered handheld controller proxies for unencumbered room-scale VR.", "useCaseText": "Rendering a high range of realistic object weights in room-scale untethered virtual reality.", "useCaseTags": ["Weight magnitude cues", "Shape cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Weight magnitude", "Shape"], "media": [{"type": "image", "src": "img/mobilegravity.jpg"}, {"type": "video", "src": "https://www.youtube.com/watch?v=AnwGVFSCo8Q"}], "doi": "10.1145/3613904.3642658", "publication": "ACM CHI", "year": "2024"},
        {"name": "PumpVR", "category": "Liquid mass shifting", "author": "", "title": "", "mechanism": "Liquid mass transfers between chambers to render the weight of objects and of the avatar's own limb.", "useCaseText": "Providing active weight magnitude, shape cues in virtual reality interactions.", "useCaseTags": ["Weight magnitude cues", "Shape cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Weight magnitude", "Shape"], "media": [{"type": "image", "src": "img/pumpvr.jpg"}], "doi": "", "publication": "", "year": ""},
        {"name": "VibroWeight", "category": "Liquid mass shifting", "author": "", "title": "", "mechanism": "Liquid shifts both total mass and its balance, while a voice coil adds vibration at contact.", "useCaseText": "Providing active vibration, weight magnitude, weight distribution, shape cues in virtual reality interactions.", "useCaseTags": ["Vibration cues", "Weight magnitude cues", "Weight distribution cues", "Shape cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Vibration", "Weight magnitude", "Weight distribution", "Shape"], "media": [{"type": "image", "src": "img/vibroweight.png"}], "doi": "", "publication": "", "year": ""},
        {"name": "Liu et al. (2023)", "category": "Solid mass shifting", "author": "Yuhu Liu et al.", "title": "Augmented Haptic VR Experience Combining Two Weight-Shifting Versatile Controllers", "mechanism": "Motorized internal weight-shifting modules in two versatile controllers dynamically modulate center of mass, impact force, and perceived volume.", "useCaseText": "Simulating versatile kinesthetic impacts, shifting mass balance, and two-handed multi-configuration tool interactions in VR.", "useCaseTags": ["Vibration cues", "Impact cues", "Weight distribution cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Vibration", "Impact", "Weight distribution"], "media": [{"type": "image", "src": "img/liu2023.jpg"}, {"type": "video", "src": "https://www.youtube.com/watch?v=C7SKKCUNVkw"}], "doi": "10.1145/3588037.3595399", "publication": "ACM SIGGRAPH Emerging Tech", "year": "2023"},
        {"name": "Shifty", "category": "Solid mass shifting", "author": "André Zenner and Antonio Krüger", "title": "Shifty: A Weight-Shifting Dynamic Passive Haptic Proxy to Enhance Object Perception in Virtual Reality", "mechanism": "A motor slides an internal weight along a rod, altering perceived length, thickness and heaviness.", "useCaseText": "Providing active weight magnitude, weight distribution, shape cues in virtual reality interactions.", "useCaseTags": ["Weight magnitude cues", "Weight distribution cues", "Shape cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Weight magnitude", "Weight distribution", "Shape"], "media": [{"type": "image", "src": "img/shifty.jpg"}, {"type": "image", "src": "img/shifty_hand.jpg"}, {"type": "video", "src": "https://www.youtube.com/watch?v=1l0wKk6q_ss"}], "doi": "10.1109/TVCG.2017.2656978", "publication": "IEEE TVCG / IEEE VR", "year": "2017"},
        {"name": "SWISH", "category": "Solid mass shifting", "author": "", "title": "", "mechanism": "Motors relocate the centre of gravity to emulate liquid sloshing inside a handheld vessel.", "useCaseText": "Providing active weight distribution, shape cues in virtual reality interactions.", "useCaseTags": ["Weight distribution cues", "Shape cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Weight distribution", "Shape"], "media": [{"type": "image", "src": "img/swish.jpg"}], "doi": "", "publication": "", "year": ""},
        {"name": "Transcalibur", "category": "Solid mass shifting", "author": "", "title": "", "mechanism": "A 2-DoF weight shift reconfigures mass distribution, rendering 2D shapes via a perception model.", "useCaseText": "Providing active weight distribution, shape cues in virtual reality interactions.", "useCaseTags": ["Weight distribution cues", "Shape cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Weight distribution", "Shape"], "media": [{"type": "image", "src": "img/transcalibur.jpg"}], "doi": "", "publication": "", "year": ""},
        {"name": "Unident", "category": "Solid mass shifting", "author": "Shuntaro Shimizu et al.", "title": "Unident: Providing Impact Sensations on Handheld Objects via High-Speed Change of the Rotational Inertia", "mechanism": "Timing belt drives an internal movable mass along the grip at high speed, altering rotational inertia during user swings to evoke sharp impact sensations.", "useCaseText": "Providing realistic ungrounded impact sensations and virtual object length/inertia perception in handheld VR tasks.", "useCaseTags": ["Impact cues", "Shape cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Impact", "Shape"], "media": [{"type": "image", "src": "img/unident_hand.jpg"}, {"type": "image", "src": "img/unident.png"}, {"type": "video", "src": "https://www.youtube.com/watch?v=bNRKsab2y6c"}], "doi": "10.1109/VR50410.2021.00021", "publication": "IEEE VR", "year": "2021"},
        {"name": "VolRec", "category": "Solid mass shifting", "author": "Ryota Koshiyama et al.", "title": "VolRec: Haptic display of virtual inner volume in consideration of angular moment", "mechanism": "Linear motion guide moves an internal weight along the central axis to dynamically displace the center of gravity and modulate angular moment.", "useCaseText": "Displaying perceived inner volume and liquid filling levels of virtual handheld containers.", "useCaseTags": ["Weight distribution cues", "Shape cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Weight distribution", "Shape"], "media": [{"type": "image", "src": "img/volrec.png"}, {"type": "image", "src": "img/volrec_fig.png"}], "doi": "10.1145/2832932.2832970", "publication": "ACM ACE", "year": "2015"},
        {"name": "White et al.", "category": "Solid mass shifting", "author": "Michael White et al.", "title": "The Case for Haptic Props: Shape, Weight and Vibro-tactile Feedback", "mechanism": "Tracked physical props with modular mass distribution calibrate passive weight matching against active vibrotactile feedback.", "useCaseText": "Evaluating empirical impact of mass distribution, weight realism, and physical grip stance in VR sports and tool simulations.", "useCaseTags": ["Weight magnitude cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Weight magnitude"], "media": [{"type": "image", "src": "img/white.jpg"}, {"type": "image", "src": "img/white_props.jpg"}], "doi": "10.1145/3359566.3360060", "publication": "ACM MIG", "year": "2019"},
        {"name": "GamesBond", "category": "Grip morphing", "author": "Neung Ryu et al.", "title": "GamesBond: Bimanual Haptic Illusion of Physically Connected Objects for Immersive VR Using Grip Deformation", "mechanism": "Paired unlinked controllers actuate bending and twisting servo backbones in real-time, creating the haptic illusion of a single connected deformable object between both hands.", "useCaseText": "Rendering bimanual sensations of connected virtual props such as jumping ropes, bows, and elastic bands in VR.", "useCaseTags": ["Shape cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Shape"], "media": [{"type": "image", "src": "img/gamesbond.jpg"}, {"type": "image", "src": "img/gamesbond_mechanism.jpg"}, {"type": "video", "src": "https://www.youtube.com/watch?v=0f3wAVNglsk"}], "doi": "10.1145/3411764.3445727", "publication": "ACM CHI", "year": "2021"},
        {"name": "Mac Murray et al.", "category": "Grip morphing", "author": "Benjamin C. Mac Murray et al.", "title": "A variable shape and variable stiffness controller for haptic virtual interactions", "mechanism": "Soft pneumatic elastomeric handle sleeve dynamically inflates and deflates to modulate grip diameter and compliance between rigid and compressible states.", "useCaseText": "Providing active stiffness and shape feedback for grasping rigid vs. soft compliant virtual items.", "useCaseTags": ["Stiffness cues", "Shape cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Stiffness", "Shape"], "media": [{"type": "image", "src": "img/murray.jpg"}, {"type": "image", "src": "img/murray_mechanism.jpg"}], "doi": "10.1109/ROBOSOFT.2018.8404930", "publication": "IEEE RoboSoft", "year": "2018"},
        {"name": "PaCaPa", "category": "Grip morphing", "author": "Yuqian Sun et al.", "title": "PaCaPa: A Handheld Haptic Device for Rendering Size, Shape, and Stiffness of Virtual Tools in Virtual Reality", "mechanism": "Two motorized wings adjust their opening angles dynamically via servo motors against the palm and fingers to render object dimensions, geometry, and contact stiffness.", "useCaseText": "Simulating the size, contour, and impact stiffness of virtual tools like sticks, swords, and rackets in VR.", "useCaseTags": ["Stiffness cues", "Shape cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Stiffness", "Shape"], "media": [{"type": "image", "src": "img/pacapa.jpg"}, {"type": "image", "src": "img/pacapa_mechanism.jpg"}, {"type": "video", "src": "https://www.youtube.com/watch?v=STvdd5JP0HA"}], "doi": "10.1145/3290605.3300682", "publication": "ACM CHI", "year": "2019"},
        {"name": "Shape-A-Getti", "category": "Grip morphing", "author": "Filipe Barbosa et al.", "title": "Shape-A-Getti: A haptic device for getting multiple shapes using a simple actuator", "mechanism": "Single gear motor rotates radial poles along geared tracks to transform the grip into distinct symmetrical 3D cross-sections and contours.", "useCaseText": "Rendering polymorphic shape profiles and thickness changes for grasping virtual handles, flashlights, and cylinders.", "useCaseTags": ["Shape cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Shape"], "media": [{"type": "image", "src": "img/shapeagetti.jpg"}, {"type": "image", "src": "img/shapeagetti_mechanism.jpg"}], "doi": "10.1016/j.cag.2023.10.014", "publication": "Computers & Graphics", "year": "2023"},
        {"name": "ThumbShift", "category": "Grip morphing", "author": "Jian Zhang et al.", "title": "ThumbShift: Modulating Perceived Object Properties Through Dynamic Thumb Repositioning", "mechanism": "Internal linear servo actuator repositions the thumb rest along the handle axis to dynamically manipulate grip span and trick visuo-haptic perception of object weight and size.", "useCaseText": "Modulating perceived heaviness, heft, and scale of handheld objects in virtual reality without large force-feedback motors.", "useCaseTags": ["Weight magnitude cues", "Shape cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Weight magnitude", "Shape"], "media": [{"type": "image", "src": "img/thumbshift.jpg"}, {"type": "image", "src": "img/thumbshift_mechanism.jpg"}], "doi": "10.1109/ISMAR67309.2025.00067", "publication": "IEEE ISMAR", "year": "2025"},
        {"name": "X-Rings", "category": "Grip morphing", "author": "Eric J. Gonzalez et al.", "title": "X-Rings: A Hand-Mounted 360° Shape Display for Grasping in Virtual Reality", "mechanism": "A vertical stack of four motorized expandable rings dynamically expands and contracts within ~100 ms to form full 360° graspable shapes with capacitive touch sensing.", "useCaseText": "Rendering dynamic 360-degree contours, grasping affordances, and squeezing stiffness for handles, goblets, and spheres.", "useCaseTags": ["Shape cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Shape"], "media": [{"type": "image", "src": "img/xrings.jpg"}, {"type": "image", "src": "img/xrings_mechanism.jpg"}, {"type": "video", "src": "https://www.youtube.com/watch?v=yTqaB1g-IeY"}], "doi": "10.1145/3472749.3474782", "publication": "ACM UIST", "year": "2021"},
        {"name": "ShakeSense", "category": "Electrode stimulation", "author": "Zhenxuan He et al.", "title": "ShakeSense: An Electrotactile System to Simulate Shaking a Container with Fluid Contents", "mechanism": "High-density electrotactile arrays lining the container fingerpad contact surfaces render spatial fluid sloshing pressure and shear waves computed via real-time SPH liquid simulation.", "useCaseText": "Simulating dynamic liquid splashing, sloshing waves, and fluid viscosity inside handheld virtual containers.", "useCaseTags": ["Friction cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Friction"], "media": [{"type": "image", "src": "img/shakesense.jpg"}, {"type": "image", "src": "img/shakesense_mechanism.jpg"}], "doi": "10.1145/3772318.3791974", "publication": "ACM CHI", "year": "2026"},
        {"name": "Slip-Grip", "category": "Electrode stimulation", "author": "Hongnan Lin et al.", "title": "Slip-Grip: An Electrotactile Method to Simulate Weight", "mechanism": "Dynamic electrotactile stimulation on flexible fingerpad electrode arrays delivers micro-slip sensations when grip force drops below virtual weight thresholds, compelling firmer grip and inducing weight perception.", "useCaseText": "Rendering weight perception and slip transitions on handheld virtual objects without bulky mechanical actuators.", "useCaseTags": ["Friction cues", "Weight magnitude cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Friction", "Weight magnitude"], "media": [{"type": "image", "src": "img/slipgrip.jpg"}, {"type": "image", "src": "img/slipgrip_mechanism.jpg"}], "doi": "10.1145/3706598.3713361", "publication": "ACM CHI", "year": "2025"},
        {"name": "Mouillé", "category": "Peltier cell actuation", "author": "Teng Han et al.", "title": "Mouillé: Exploring Wetness Illusion on Fingertips to Enhance Immersive Experience in VR", "mechanism": "Dual motorized Peltier thermoelectric arrays pressed against fingertips and palm deliver rapid cooling combined with tactile pressure to induce realistic multi-level wetness illusions.", "useCaseText": "Rendering tactile wetness illusions and temperature sensations during virtual water and fluid interactions.", "useCaseTags": ["Thermal cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Thermal"], "media": [{"type": "image", "src": "img/mouille.jpg"}, {"type": "image", "src": "img/mouille_mechanism.jpg"}, {"type": "video", "src": "https://www.youtube.com/watch?v=WUZGRM8f9TU"}], "doi": "10.1145/3313831.3376138", "publication": "ACM CHI", "year": "2020"},
        {"name": "ThermalPen", "category": "Peltier cell actuation", "author": "Philipp Pascal Hoffmann et al.", "title": "ThermalPen: Investigating the Influence of Thermal Haptic Feedback for Creativity in 3D Sketching", "mechanism": "Miniature Peltier thermoelectric element coupled with a compact heat sink and cooling fan mounted on a smart 3D sketch pen provides dynamic thermal heating and cooling to the index finger during VR drawing.", "useCaseText": "Augmenting 3D sketching, creative modeling, and material rendering with temperature cues in VR.", "useCaseTags": ["Thermal cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Thermal"], "media": [{"type": "image", "src": "img/thermalpen.jpg"}, {"type": "image", "src": "img/thermalpen_mechanism.jpg"}, {"type": "video", "src": "https://www.youtube.com/watch?v=plEx_9fr7Zc"}], "doi": "10.1145/3635636.3656191", "publication": "ACM C&C", "year": "2024"},
        {"name": "Aero-plane", "category": "Propeller thrust", "author": "Seungwoo Je et al.", "title": "Aero-plane: A Handheld Force-Feedback Device that Renders Weight Motion Illusion on a Virtual 2D Plane", "mechanism": "Two miniature electric ducted fan propellers dynamically shift thrust vectors to generate continuous 2D planar weight motion and inertia illusions up to 14 N within 0.3 s.", "useCaseText": "Rendering dynamic weight shifting, inertia, and sliding sensations across 2D planar props like trays and kitchen tools in VR.", "useCaseTags": ["Motion cues", "Weight distribution cues", "Shape cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Motion", "Weight distribution", "Shape"], "media": [{"type": "image", "src": "img/aeroplane.jpg"}, {"type": "image", "src": "img/aeroplane_mechanism.jpg"}, {"type": "video", "src": "https://www.youtube.com/watch?v=-8yYRvdDKPM"}], "doi": "10.1145/3332165.3347926", "publication": "ACM UIST", "year": "2019"},
        {"name": "Arezoo et al.", "category": "Propeller thrust", "author": "Keyvan Arezoo et al.", "title": "A Novel Ungrounded Haptic Device for Generation and Orientation of Force and Torque Feedbacks", "mechanism": "Dual counter-rotating propellers mounted inside a 2-DoF motorized gimbal cage with linear sliders continuously orient 3D force vectors up to 15 N and decoupled torques up to 1.0 N·m in <370 ms.", "useCaseText": "Delivering simultaneous multi-axis force vectors and rotational torque cues for ungrounded tools and steering in VR.", "useCaseTags": ["Motion cues", "Resistance cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Motion", "Resistance"], "media": [{"type": "image", "src": "img/arezoo.jpg"}, {"type": "image", "src": "img/arezoo_mechanism.jpg"}], "doi": "10.1109/TOH.2024.3493377", "publication": "IEEE ToH", "year": "2024"},
        {"name": "CrazyJoystick", "category": "Propeller thrust", "author": "Yang Chen, Xinlei Yu, and Heather Culbertson", "title": "CrazyJoystick: A Handheld Flyable Joystick for Providing On-Demand Haptic Feedback in Extended Reality", "mechanism": "An autonomous quadrotor flies to the user on demand, then transitions into a handheld joystick whose thrust is dynamically reallocated to render multi-axis kinesthetic forces and torques.", "useCaseText": "Providing on-demand flyable joystick interaction and active directional resistance in spatial VR navigation.", "useCaseTags": ["Motion cues", "Resistance cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Motion", "Resistance"], "media": [{"type": "image", "src": "img/crazyjoystick.jpg"}, {"type": "image", "src": "img/crazyjoystick_mechanism.jpg"}, {"type": "video", "src": "https://www.youtube.com/watch?v=8QuRP5O5Vi8"}], "doi": "10.1109/WHC64065.2025.11123327", "publication": "IEEE WHC", "year": "2025"},
        {"name": "Flyables", "category": "Propeller thrust", "author": "Jonas Auda et al.", "title": "Flyables: Haptic Input Devices for Virtual Reality using Quadcopters", "mechanism": "Autonomous micro-quadcopters deliver physical 3D-printed UI elements and tangible interactive handles to the user's hand on demand in mid-air.", "useCaseText": "Supplying physical prop counterparts and tangible shapes on demand for diverse UI widgets in VR.", "useCaseTags": ["Shape cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Shape"], "media": [{"type": "image", "src": "img/flyables.jpg"}, {"type": "image", "src": "img/flyables_mechanism.jpg"}, {"type": "video", "src": "https://www.youtube.com/watch?v=kAw3gDq_2wM"}], "doi": "10.1145/3489849.3489855", "publication": "ACM VRST", "year": "2021"},
        {"name": "Hydra", "category": "Propeller thrust", "author": "Christian Eichhorn et al.", "title": "Hydra – A Hybrid Controller for Multi-Haptic Feedback to Mimic Impulsive Forces in Virtual Reality", "mechanism": "Hybrid handheld controller integrating four toroidal brushless propellers for continuous aerodynamic thrust combined with an electromagnetic linear solenoid accelerating a 90 g slug to generate 26 N peak impulsive recoil.", "useCaseText": "Simulating sharp impulsive collisions, weapon discharges, and sustained aerodynamic drag in VR combat and tool simulations.", "useCaseTags": ["Impact cues", "Motion cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Impact", "Motion"], "media": [{"type": "image", "src": "img/hydra.jpg"}, {"type": "image", "src": "img/hydra_mechanism.jpg"}], "doi": "10.1109/VRW70859.2026.00237", "publication": "IEEE VRW", "year": "2026"},
        {"name": "LevioPole", "category": "Propeller thrust", "author": "Tomoya Sasaki et al.", "title": "LevioPole: Mid-Air Haptic Interactions Using Multirotor", "mechanism": "Multirotor thruster assemblies mounted at both ends of a two-handed carbon pole generate dynamic mid-air rotational torque and linear resistance forces up to 15 N.", "useCaseText": "Simulating bimanual mid-air sports resistance, kayaking, and heavy virtual pole balancing in VR.", "useCaseTags": ["Resistance cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Resistance"], "media": [{"type": "image", "src": "img/leviopole.jpg"}, {"type": "image", "src": "img/leviopole_mechanism.jpg"}, {"type": "video", "src": "https://www.youtube.com/watch?v=Qh3SDRaOR_4"}], "doi": "10.1145/3214907.3214913", "publication": "ACM SIGGRAPH", "year": "2018"},
        {"name": "Thor's Hammer", "category": "Propeller thrust", "author": "Seongkook Heo et al.", "title": "Thor's Hammer: An Ungrounded Force Feedback Device Utilizing Propeller-Induced Propulsive Force", "mechanism": "Six high-thrust motors and propellers positioned along orthogonal cube faces synthesize arbitrary 3-DoF ungrounded directional force vectors up to 4 N to simulate weight, drag, and impact forces.", "useCaseText": "Rendering 3D ungrounded force vectors, weight, spring stiffness, and directional wind drag in VR.", "useCaseTags": ["Stiffness cues", "Motion cues", "Resistance cues", "Weight magnitude cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Stiffness", "Motion", "Resistance", "Weight magnitude"], "media": [{"type": "image", "src": "img/thorshammer.jpg"}, {"type": "image", "src": "img/thorshammer_mechanism.jpg"}, {"type": "video", "src": "https://www.youtube.com/watch?v=wE-nkHiqTyU"}], "doi": "10.1145/3173574.3174099", "publication": "ACM CHI", "year": "2018"},
        {"name": "OrbitStick", "category": "Mass acceleration", "author": "Jaesuk Jang, Seokmin Hong, Jaeyoung Park", "title": "OrbitStick: A Hand-Held Haptic Impact Display With Mass Shifting Mechanism", "mechanism": "A 2-DOF spherical mass shifting mechanism moves a guided impact mass along hemispherical coordinates and rapidly decelerates it, delivering high-magnitude 3D directional impact forces and torque sensations to the hand.", "useCaseText": "Rendering multi-directional ungrounded impact forces, collisions, and recoil sensations in VR.", "useCaseTags": ["Impact cues", "Motion cues"], "generalUseCases": ["Gaming", "Virtual sports", "Collision simulation"], "submodalities": ["Impact"], "media": [{"type": "image", "src": "img/orbitstick.jpg"}, {"type": "image", "src": "img/orbitstick_mechanism.jpg"}], "doi": "10.1109/access.2026.3690302", "publication": "IEEE Access", "year": "2026"},
        {"name": "Su et al.", "category": "Mass acceleration", "author": "Yuning Su, Weizhi Nai, Xiaoying Sun, Zuowei Sun", "title": "Design and Modeling of an Ungrounded Haptic Gun that Simulates Recoil Using Asymmetric Force", "mechanism": "An ungrounded voice-coil linear actuator drives an internal inertial mass with sharp acceleration pulses and slow sub-threshold return strokes, generating convincing directional firearm recoil kicks.", "useCaseText": "Simulating realistic ungrounded firearm recoil sensations in VR shooting simulations.", "useCaseTags": ["Impact cues"], "generalUseCases": ["Gaming", "Shooting simulation", "Tactical training"], "submodalities": ["Impact"], "media": [{"type": "image", "src": "img/su.jpg"}, {"type": "image", "src": "img/su_mechanism.jpg"}], "doi": "10.1109/whc49131.2021.9517202", "publication": "IEEE World Haptics (WHC)", "year": "2021"},
        {"name": "Amemiya et al.", "category": "Mass acceleration", "author": "Tomohiro Amemiya and Taro Maeda", "title": "Asymmetric Oscillation Distorts the Perceived Heaviness of Handheld Objects", "mechanism": "Asymmetric vertical acceleration pulses via voice-coil / linear shaker distort perceived object heaviness through nonlinear biological force integration.", "useCaseText": "Distorting perceived heaviness and inducing weight illusions on handheld controllers without external grounding.", "useCaseTags": ["Weight magnitude cues"], "generalUseCases": ["Gaming", "Training"], "submodalities": ["Weight magnitude"], "media": [{"type": "image", "src": "img/amemiya.jpg"}, {"type": "image", "src": "img/amemiya_mechanism.jpg"}], "doi": "10.1109/TOH.2008.5", "publication": "IEEE ToH", "year": "2008"},

        function getResearchFocus(device) {
            const focus = [];

            const sens = auditInfo ? auditInfo.sensations : (device.submodalities || []);

            if (sens.includes("Shape") || sens.includes("Friction")) focus.push("Surface & Form");
            if (sens.includes("Thermal")) focus.push("Thermal Feedback");
            if (focus.length === 0) focus.push("Active Actuation");
            return focus;

        function showMedia(container, index) {
            const mediaData = JSON.parse(container.dataset.media || '[]');
            const categorySymbol = container.dataset.categorySymbol || '⚙️';
            const display = container.querySelector('.gallery-media-display');
            if (!display) return;

            container.dataset.currentIndex = normalizedIndex;

            const isVideo = currentMedia.type === 'video' || (currentMedia.src && (currentMedia.src.endsWith('.mp4') || currentMedia.src.endsWith('.webm') || currentMedia.src.endsWith('.mov')));

        function setPattern(idx, targetPage = 0) {
            if (idx < 0) idx = canonicalPatterns.length - 1;

            if (selectedFamilyId !== 'all') {

        function setCardsPage(page) {
            const currentPat = canonicalPatterns[currentPatternIndex];
            const regularDevices = devices.filter(d => !d.isIntro);
            const patternDevices = regularDevices.filter(d => (deviceMechanismPatterns[d.name] || "General") === currentPat);
            const totalPages = Math.ceil(patternDevices.length / CARDS_PER_PAGE);

            if (page >= 0 && page < totalPages) {
                currentCardsPage = page;
                renderApp();
            }
        }

        function nextCardsPage() {
            const currentPat = canonicalPatterns[currentPatternIndex];
            const regularDevices = devices.filter(d => !d.isIntro);
            const patternDevices = regularDevices.filter(d => (deviceMechanismPatterns[d.name] || "General") === currentPat);
            const totalPages = Math.ceil(patternDevices.length / CARDS_PER_PAGE);

            if (currentCardsPage < totalPages - 1) {
                currentCardsPage++;
                renderApp();
            }
        }

        function prevCardsPage() {
            if (currentCardsPage > 0) {
                currentCardsPage--;
                renderApp();
            }
        }

        function nextPattern() {
            const currentPat = canonicalPatterns[currentPatternIndex];
            const regularDevices = devices.filter(d => !d.isIntro);
            const patternDevices = regularDevices.filter(d => (deviceMechanismPatterns[d.name] || "General") === currentPat);
            const totalPages = Math.ceil(patternDevices.length / CARDS_PER_PAGE);

            if (currentCardsPage < totalPages - 1) {
                currentCardsPage++;
                renderApp();
            } else {
                setPattern(currentPatternIndex + 1, 0);
            }
        }

        function prevPattern() {
            if (currentCardsPage > 0) {
                currentCardsPage--;
                renderApp();
            } else {
                let prevIdx = currentPatternIndex - 1;
                if (prevIdx < 0) prevIdx = canonicalPatterns.length - 1;
                
                const prevPat = canonicalPatterns[prevIdx];
                const regularDevices = devices.filter(d => !d.isIntro);
                const prevDevices = regularDevices.filter(d => (deviceMechanismPatterns[d.name] || "General") === prevPat);
                const prevTotalPages = Math.ceil(prevDevices.length / CARDS_PER_PAGE);
                const targetPage = Math.max(0, prevTotalPages - 1);

                setPattern(prevIdx, targetPage);
            }

            if (heroTitle) heroTitle.textContent = currentPat;
            if (heroCount) {
                if (totalCards > 0) {
                    heroCount.textContent = `${totalCards}`;
                    heroCount.classList.remove('hidden');
                } else {
                    heroCount.classList.add('hidden');
                }
            }

            // Render 4 Cards in Viewport
            const viewport = document.getElementById('cards-viewport');
            if (viewport) {
                viewport.innerHTML = '';

                if (pageDevices.length === 0) {
                    viewport.innerHTML = `
                    <div class="col-span-full py-16 text-center bg-white/70 rounded-2xl border border-[#001011]/15 flex flex-col items-center justify-center">
                        <span class="text-4xl mb-2">${currentIcon}</span>
                        <p class="text-gray-600 font-medium">No controllers registered in this pattern yet.</p>
                    </div>`;
                } else {
                    pageDevices.forEach(device => {
                        const devicePattern = deviceMechanismPatterns[device.name] || currentPat;
                        const deviceCutaneous = (device.submodalities || []).filter(sm => cutaneousSubmodalities.has(sm));
                        const deviceKinesthetic = (device.submodalities || []).filter(sm => kinestheticSubmodalities.has(sm));

                        const cutaneousTagsHTML = deviceCutaneous.length > 0 
                            ? deviceCutaneous.map(sm => `<button data-modality="${sm}" class="modality-tag cutaneous">${sm}</button>`).join('')
                            : '<span class="modality-tag none-tag">none</span>';

                        const kinestheticTagsHTML = deviceKinesthetic.length > 0 
                            ? deviceKinesthetic.map(sm => `<button data-modality="${sm}" class="modality-tag kinesthetic">${sm}</button>`).join('')
                            : '<span class="modality-tag none-tag">none</span>';

                        const useCaseTagsHTML = Array.isArray(device.useCaseTags) && device.useCaseTags.length > 0 
                            ? device.useCaseTags.map(uc => `<span class="use-case-tag text-white text-[11px] font-medium px-2 py-0.5 rounded-full">${uc}</span>`).join('') 
                            : '';

                        const generalUseCaseTagsHTML = Array.isArray(device.generalUseCases) && device.generalUseCases.length > 0 
                            ? device.generalUseCases.map(guc => `<span class="general-use-case-tag text-white text-[11px] font-medium px-2 py-0.5 rounded-full">${guc}</span>`).join('') 
                            : '';
                        
                        const mappedCategory = categoryMap[device.category] || device.category || "Unknown";
                        const categoryIconSymbol = categoryIconSymbols[mappedCategory] || categoryIconSymbols["Unknown"];

                        const mediaArray = Array.isArray(device.media) ? device.media : []; 
                        const mediaDataString = JSON.stringify(mediaArray).replace(/"/g, '&quot;');
                        
                        let dotsHTML = '';
                        if (mediaArray.length > 1) {
                            for (let i = 0; i < mediaArray.length; i++) {
                                dotsHTML += `<span class="gallery-dot ${i === 0 ? 'active' : ''}"></span>`;
                            }
                        }

                        const researchFocus = getResearchFocus(device);
                        const researchTagsHTML = researchFocus.map(topic => getResearchFocusTagHTML(topic)).join('');

                        const cardHTML = `
                        <div class="card-item bg-[#ECEDE8] rounded-2xl shadow-sm hover:shadow-lg transition-all duration-300 ease-in-out flex flex-col relative overflow-hidden border border-[#001011]/10" data-pattern="${devicePattern}">
                            <!-- Card Header: #001011 with Pattern tag on the RIGHT in light text -->
                            <div class="bg-[#001011] border-b border-black flex flex-col">
                                <div class="px-4 pt-3.5 pb-3 flex justify-between items-center gap-2">
                                    <h2 class="text-base sm:text-lg font-bold text-white leading-snug truncate" title="${device.name}">
                                        ${device.name}
                                    </h2>
                                    <span class="text-[10px] font-medium text-white/95 bg-white/15 px-2.5 py-0.5 rounded-full border border-white/20 uppercase tracking-wider text-right shrink-0 whitespace-nowrap shadow-sm">
                                        ${devicePattern}
                                    </span>
                                </div>
                                
                                <div class="gallery-container bg-gray-100 relative" data-media="${mediaDataString}" data-current-index="0" data-category-symbol="${categoryIconSymbol}">
                                    <div class="gallery-media-display"></div>
                                    <button class="gallery-nav-btn gallery-prev-btn">
                                         <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" /></svg>
                                    </button>
                                    <button class="gallery-nav-btn gallery-next-btn">
                                         <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" /></svg>
                                    </button>
                                    <div class="gallery-dots">${dotsHTML}</div>
                                </div>
                            </div>
                            
                            <div class="p-4 flex-grow flex flex-col justify-between">
                                <div>
                                    <!-- Tab Switcher: #fd5321 for selected tab with light text -->
                                    <div class="flex items-center gap-1.5 p-1 bg-[#001011]/5 rounded-full mb-3 text-[11px] font-medium select-none">
                                        <button class="info-tab-btn px-3 py-1 rounded-full bg-[#fd5321] text-white font-semibold shadow-sm focus:outline-none transition-all text-xs" data-tab="versatility">Haptic Versatility</button>
                                        <button class="info-tab-btn px-3 py-1 rounded-full text-[#001011]/70 hover:text-[#001011] hover:bg-[#001011]/5 focus:outline-none transition-all text-xs" data-tab="research">Research</button>
                                        <button class="info-tab-btn px-3 py-1 rounded-full text-[#001011]/70 hover:text-[#001011] hover:bg-[#001011]/5 focus:outline-none transition-all text-xs" data-tab="use-cases">Use Cases</button>
                                    </div>

                                    <!-- 1. Haptic Versatility Tab Content (Active & Visible by Default) -->
                                    <div class="versatility-tab-content flex-grow flex flex-col justify-start">
                                        ${renderVersatilityRating(device)}

                                        <!-- Mechanism Row (Always visible short definition) -->
                                         <div class="mb-2.5 pb-2 border-b border-gray-200 space-y-1">
                                            <div class="flex items-center gap-1.5">
                                                <h3 class="text-[11px] font-semibold text-[#001011]/60 uppercase tracking-wider">Mechanism:</h3>
                                                <span class="text-xs bg-[#001011]/5 p-0.5 rounded-full border border-[#001011]/15 inline-flex items-center justify-center" title="${mappedCategory}">${categoryIconSymbol}</span>
                                            </div>
                                            <p class="text-gray-800 text-xs leading-relaxed font-medium">
                                                ${device.mechanism || 'Actuation mechanism rendering haptic feedback.'}
                                            </p>
                                         </div>
                   
                                    </div>

                                    <!-- 2. Research Focus Tab Content (Year moved here) -->
                                    <div class="research-tab-content hidden flex-grow flex flex-col justify-start">
                                        <div class="mb-3 pb-3 border-b border-gray-200">
                                            <div class="flex items-center justify-between mb-2 flex-wrap gap-1">
                                                <h3 class="text-[11px] font-semibold text-[#001011]/60 uppercase tracking-wider">Research Focus</h3>
                                                ${device.year ? `<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-[#001011]/5 text-[#001011]/80 border border-[#001011]/15">📅 ${device.year}</span>` : ''}
                                            </div>
                                            <div class="flex flex-wrap gap-1 mb-2">
                                                ${researchTagsHTML}
                                            </div>
                                            
                                            ${generalUseCaseTagsHTML ? `
                                            <h3 class="text-[11px] font-semibold text-[#001011]/60 uppercase tracking-wider mb-1 mt-2">Context</h3>
                                            <div class="flex flex-wrap gap-1 mb-1">
                                                ${generalUseCaseTagsHTML}
                                            </div>
                                            ` : ''}
                                        </div>
                                    </div>

                                    <!-- 3. Use Cases Tab Content -->
                                    <div class="use-cases-tab-content hidden flex-grow flex flex-col justify-start">
                                        <div class="mb-3 pb-3 border-b border-gray-200">
                                            <h3 class="text-[11px] font-semibold text-[#001011]/60 uppercase tracking-wider mb-1">Use Cases</h3>
                                            ${useCaseTagsHTML ? `
                                            <div class="flex flex-wrap gap-1 mb-2"> 
                                               ${useCaseTagsHTML}
                                            </div>
                                            ` : ''}
                                            <div class="usecase-content">
                                                <p class="text-gray-700 mt-1 text-xs leading-relaxed">${device.useCaseText || ''}</p> 
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Reference Link at Bottom of Card -->
                                ${device.doi || device.publication || device.year ? `
                                <div class="mt-auto pt-2 border-t border-slate-200/60 text-xs text-gray-600">
                                    <button class="w-full text-left focus:outline-none flex justify-between items-center text-[10.5px] font-semibold text-[#001011]/60 uppercase tracking-wider ref-toggle-btn">
                                        <span>Reference</span>
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 transition-transform duration-200 transform ref-arrow" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                                        </svg>
                                    </button>
                                    <div class="ref-content hidden text-[11px] mt-1.5">
                                        <p class="font-semibold text-gray-800">${device.author || 'Author in Proceedings'}</p>
                                        <p class="italic text-gray-600 my-0.5">"${device.title || device.name}"</p>
                                        <p class="text-[#001011]/60">${device.publication || 'Proceedings'}, ${device.year || ''}</p>
                                        ${device.doi ? `
                                        <a href="https://doi.org/${device.doi}" target="_blank" rel="noopener noreferrer" class="text-[#fd5321] hover:underline font-semibold transition-colors inline-flex items-center mt-1">
                                            Paper
                                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 ml-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                              <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                                            </svg>
                                        </a>` : ''}
                                    </div>
                                </div>
                                ` : ''}
                            </div>
                        </div>
                        `;
                        viewport.innerHTML += cardHTML;
                    });
                }

                document.querySelectorAll('.gallery-container').forEach(container => {
                    showMedia(container, 0);
                });
            }

            // Card Controls: Minimal transparent dots just below cards
            const dotsContainer = document.getElementById('cards-dots-container');

            if (dotsContainer) {
                if (totalPages > 1) {
                    let dotsHTML = '<div class="flex items-center gap-1.5">';
                    for (let p = 0; p < totalPages; p++) {
                        const isCurrent = p === currentCardsPage;
                        dotsHTML += `
                        <button onclick="setCardsPage(${p})" title="Controllers ${p * CARDS_PER_PAGE + 1}–${Math.min((p + 1) * CARDS_PER_PAGE, totalCards)}" class="transition-all duration-200 cursor-pointer ${
                            isCurrent
                                ? 'w-5 h-2 rounded-full bg-[#fd5321]'
                                : 'w-2 h-2 rounded-full bg-[#001011]/25 hover:bg-[#001011]/60'
                        }"></button>
                        `;
                    }
                    dotsHTML += '</div>';
                    dotsHTML += `
                    <span class="text-xs font-semibold text-[#001011]/60 ml-1.5 select-none">
                        ${startIdx + 1 === endIdx ? endIdx : (startIdx + 1) + '&ndash;' + endIdx} of ${totalCards} controllers
                    </span>
                    `;
                    dotsContainer.innerHTML = dotsHTML;
                    dotsContainer.classList.remove('hidden');
                } else {
                    dotsContainer.innerHTML = '';
                    dotsContainer.classList.remove('hidden');
                }
            }

            // Render Bottom Mechanism Family Tabs and Pattern Pills
            const currentFamily = getFamilyForPattern(currentPat);
            const effectiveFamilyId = selectedFamilyId === 'all' 
                ? 'all' 
                : (selectedFamilyId === 'auto' ? currentFamily.id : selectedFamilyId);

            const familyTabsContainer = document.getElementById('family-tabs-container');
            if (familyTabsContainer) {
                let tabsHTML = '';
                
                // "All Families" Tab
                const isAllActive = effectiveFamilyId === 'all';
                tabsHTML += `
                <button onclick="selectFamily('all')" class="text-xs font-bold px-3 py-1.5 rounded-xl border transition-all duration-150 select-none flex items-center gap-1.5 ${
                    isAllActive
                        ? 'bg-[#001011] text-white border-[#001011] shadow-sm'
                        : 'bg-white/60 hover:bg-white text-gray-400 hover:text-[#001011] border-[#001011]/10 hover:border-[#001011]/25'
                }">
                    <span>All Families</span>
                    <span class="text-[10px] ${isAllActive ? 'text-white/80' : 'text-gray-400 group-hover:text-[#001011]/70'} font-semibold">(21)</span>
                </button>
                `;

                // Individual Family Tabs
                mechanismFamilies.forEach(fam => {
                    const isFamActive = effectiveFamilyId === fam.id;
                    const famPatternCount = fam.patterns.length;
                    tabsHTML += `
                    <button onclick="selectFamily('${fam.id}')" class="text-xs font-bold px-3 py-1.5 rounded-xl border transition-all duration-150 select-none flex items-center gap-1.5 ${
                        isFamActive
                            ? 'bg-[#001011] text-white border-[#001011] shadow-sm'
                            : 'bg-white/60 hover:bg-white text-gray-400 hover:text-[#001011] border-[#001011]/10 hover:border-[#001011]/25'
                    }">
                        <span>${fam.name}</span>
                        <span class="text-[10px] ${isFamActive ? 'text-white/80' : 'text-gray-400 group-hover:text-[#001011]/70'} font-semibold">(${famPatternCount})</span>
                    </button>
                    `;
                });

                familyTabsContainer.innerHTML = tabsHTML;
            }

            const pillsContainer = document.getElementById('patterns-pills-container');
            if (pillsContainer) {
                pillsContainer.innerHTML = '';

                if (effectiveFamilyId === 'all') {
                    // Grouped view by family when "All" is active
                    let groupedHTML = '<div class="flex flex-col gap-2.5 w-full">';
                    mechanismFamilies.forEach(fam => {
                        groupedHTML += `
                        <div class="flex items-center gap-2 flex-wrap">
                            <span class="text-[11px] font-black uppercase text-[#001011]/70 tracking-wider bg-[#001011]/5 px-2.5 py-1 rounded-lg shrink-0">
                                ${fam.name}
                            </span>
                            <div class="flex flex-wrap gap-1.5">
                        `;
                        fam.patterns.forEach(pat => {
                            const idx = canonicalPatterns.indexOf(pat);
                            const count = regularDevices.filter(d => (deviceMechanismPatterns[d.name] || "General") === pat).length;
                            const isActive = idx === currentPatternIndex;
                            groupedHTML += `
                            <button onclick="setPattern(${idx})" class="text-xs font-medium px-3 py-1.5 rounded-full border transition-all duration-150 select-none flex items-center gap-1.5 shadow-xs ${
                                isActive 
                                    ? 'bg-[#fd5321] text-white border-[#fd5321] font-bold shadow-md scale-105' 
                                    : 'bg-white text-[#001011] border-[#001011]/15 hover:border-[#fd5321] hover:bg-[#FEFAF6]'
                            }">
                                <span>${pat}</span>
                                <span class="text-[10px] ${isActive ? 'text-white font-bold' : 'text-[#001011]/60 font-semibold'}">(${count})</span>
                            </button>
                            `;
                        });
                        groupedHTML += `</div></div>`;
                    });
                    groupedHTML += '</div>';
                    pillsContainer.innerHTML = groupedHTML;
                } else {
                    // Focused single-family view: clean, comfortable row
                    const fam = mechanismFamilies.find(f => f.id === effectiveFamilyId) || mechanismFamilies[0];
                    let pillsHTML = '';
                    fam.patterns.forEach(pat => {
                        const idx = canonicalPatterns.indexOf(pat);
                        const count = regularDevices.filter(d => (deviceMechanismPatterns[d.name] || "General") === pat).length;
                        const isActive = idx === currentPatternIndex;

                        pillsHTML += `
                        <button onclick="setPattern(${idx})" class="text-xs font-medium px-3.5 py-1.5 rounded-full border transition-all duration-150 select-none flex items-center gap-1.5 shadow-sm ${
                            isActive 
                                ? 'bg-[#fd5321] text-white border-[#fd5321] font-bold shadow-md scale-105' 
                                : 'bg-white text-[#001011] border-[#001011]/15 hover:border-[#fd5321] hover:bg-[#FEFAF6]'
                        }">
                            <span>${pat}</span>
                            <span class="text-[10.5px] ${isActive ? 'text-white font-bold' : 'text-[#001011]/60 font-semibold'}">(${count})</span>
                        </button>
                        `;
                    });
                    pillsContainer.innerHTML = pillsHTML;
                }
            }
        }

        function setupEventListeners() {
            const introDevice = devices.find(d => d.isIntro);
            if (introDevice) {
                const modalContent = document.getElementById('intro-modal-content');
                if (modalContent) {
                    modalContent.innerHTML = `
                    <div class="mb-3">
                        <span class="text-xs font-bold text-[#001011]/70 uppercase tracking-widest">${introDevice.category}</span>
                        <h2 class="text-2xl font-bold text-[#001011]">${introDevice.name}</h2>
                    </div>
                    ${introDevice.contentHTML}
                    `;
                }
            }

            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight') {
                    nextCardsPage();
                } else if (e.key === 'ArrowLeft') {
                    prevCardsPage();
                }
            });

            document.addEventListener('click', (event) => {
                // Gallery buttons
                const target = event.target.closest('button');
                if (!target) return;

                const galleryContainer = target.closest('.gallery-container');
                if (galleryContainer) {
                    let currentIndex = parseInt(galleryContainer.dataset.currentIndex || '0', 10);
                    if (target.classList.contains('gallery-prev-btn')) {
                        showMedia(galleryContainer, currentIndex - 1);
                    } else if (target.classList.contains('gallery-next-btn')) {
                        showMedia(galleryContainer, currentIndex + 1);
                    }
                }

                // Reference Toggle
                if (target.classList.contains('ref-toggle-btn') || target.closest('.ref-toggle-btn')) {
                    const btn = target.closest('.ref-toggle-btn') || target;
                    const content = btn.nextElementSibling;
                    const arrow = btn.querySelector('.ref-arrow');
                    if (content) {
                        content.classList.toggle('hidden');
                        if (arrow) arrow.classList.toggle('rotate-180');
                    }
                }

                // Mechanism Toggle
                if (target.classList.contains('mechanism-toggle-btn') || target.closest('.mechanism-toggle-btn')) {
                    const btn = target.closest('.mechanism-toggle-btn') || target;
                    const content = btn.nextElementSibling;
                    const arrow = btn.querySelector('.mechanism-arrow');
                    if (content) {
                        content.classList.toggle('hidden');
                        if (arrow) arrow.classList.toggle('rotate-180');
                    }
                }

                // Tab Switcher: #fd5321 for active tab with white text
                if (target.classList.contains('info-tab-btn')) {
                    const card = target.closest('.card-item');
                    if (!card) return;

                    const tabName = target.dataset.tab;
                    card.querySelectorAll('.info-tab-btn').forEach(btn => {
                        if (btn === target) {
                            btn.classList.add('bg-[#fd5321]', 'text-white', 'font-semibold', 'shadow-sm');
                            btn.classList.remove('text-[#001011]/70', 'hover:bg-[#001011]/5');
                        } else {
                            btn.classList.remove('bg-[#fd5321]', 'text-white', 'font-semibold', 'shadow-sm');
                            btn.classList.add('text-[#001011]/70', 'hover:bg-[#001011]/5');
                        }
                    });

                    const versatilityContent = card.querySelector('.versatility-tab-content');
                    const researchContent = card.querySelector('.research-tab-content');
                    const useCasesContent = card.querySelector('.use-cases-tab-content');
                    
                    if (versatilityContent) versatilityContent.classList.add('hidden');
                    if (researchContent) researchContent.classList.add('hidden');
                    if (useCasesContent) useCasesContent.classList.add('hidden');
                    
                    if (tabName === 'versatility' && versatilityContent) {
                        versatilityContent.classList.remove('hidden');
                    } else if (tabName === 'research' && researchContent) {
                        researchContent.classList.remove('hidden');
                    } else if (tabName === 'use-cases' && useCasesContent) {
                        useCasesContent.classList.remove('hidden');
                    }
                }

                // Intro card dots
                if (target.classList.contains('intro-dot')) {
                    const slideIndex = parseInt(target.dataset.slide, 10);
                    const modal = document.getElementById('intro-modal');
                    if (!modal) return;
                    const slide1 = modal.querySelector('.intro-slide-1');
                    const slide2 = modal.querySelector('.intro-slide-2');
                    const dots = modal.querySelectorAll('.intro-dot');
                    
                    if (slideIndex === 0) {
                        if (slide1) slide1.classList.remove('hidden');
                        if (slide2) slide2.classList.add('hidden');
                    } else {
                        if (slide1) slide1.classList.add('hidden');
                        if (slide2) slide2.classList.remove('hidden');
                    }
                    
                    dots.forEach((d, idx) => {
                        if (idx === slideIndex) {
                            d.classList.add('bg-blue-600');
                            d.classList.remove('bg-slate-300', 'hover:bg-slate-400');
                        } else {
                            d.classList.remove('bg-blue-600');
                            d.classList.add('bg-slate-300', 'hover:bg-slate-400');
                        }
                    });
                }
            });
        }

        window.onload = function() {
            renderApp();
            setupEventListeners();
        };
    </script>
</body>
</html>
